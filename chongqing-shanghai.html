es and dates must match the form)","Detailed day-by-day itinerary","Employment certificate","Recent bank statement in English with the holder's name and currency; for the partner's account, an English marriage certificate"],"steps":["Create an account on the Cairo visa centre website and fill in the online form; upload the documents","Wait for the online review; fix and resubmit if it shows Rejected","When it shows Approved, print the certificate","Go to the centre with the certificate, passports and photos, and pay","Collect the passports about 4 working days later"],"sources":[{"label":"Visa fee (Chinese Embassy)","url":"https://eg.china-embassy.gov.cn/eng/ywzn/lsyw/zytz/202512/t20251231_11796187.htm"},{"label":"Service fee from 1 Oct","url":"https://bio.visaforchina.cn/CAI4_EN/tongzhigonggao/553119309547835439.html"},{"label":"L visa documents","url":"https://bio.visaforchina.cn/CAI4_EN/qianzhengyewu/jichuzhishi/banliliucheng/553119309547835404.html"},{"label":"Cairo rules (20 Oct)","url":"https://bio.visaforchina.cn/CAI4_EN/tongzhigonggao/553119309573001241.html"},{"label":"Online arrival card","url":"https://s.nia.gov.cn/ArrivalCardFillingPC/"}]}]},"days/d-2027-01-02":{"date":"2027-01-02","city":"sh","title":"Old Shanghai, the Bund and the night flight home","summary":"Yu Garden, the bazaar, the Bund by day, early dinner, then the 11:35 pm flight to Cairo.","order":24,"items":[{"start":"08:15","end":"08:45","type":"meal","title":"Breakfast: croissant and coffee at the hotel buffet, Atour Bund Yuyuan","cost":6.67,"costEstimate":true,"costBasis":"CNY 48 per adult (hotel breakfast price listed on Trip.com; the Queen city-view rate is room only, so pay at the hotel)","costSource":"https://nz.trip.com/hotels/shanghai-hotel-detail-131314697/shanghai-bund-yuyuan-subway-station-yaduo-hotel","note":"Western and Chinese buffet on the hotel's 3rd floor, 7:00 am to 10:30 am every day. Take a croissant or plain pastry and coffee; the buffet is not halal, so skip the meats.   --hk: #6b9cff; --cq: #fb8a4c; --sh: #a98bfa;
  --k-sight: #6b9cff; --k-shop: #a98bfa; --k-hotel: #a98bfa; --k-ticket: #fb8a4c;
  --ok: #6ee7a0; --bad: #fca5a5;
  --b-green-bg: #12301f; --b-green: #86efac; --b-orange-bg: #3a2414; --b-orange: #fdba74; --b-purple-bg: #2a2147; --b-purple: #c4b5fd;
  --b-blue-bg: #1b2740; --b-blue: #93c5fd; --b-grey-bg: #262a33; --b-grey: #d1d5db; --b-red-bg: #3a1a1c; --b-red: #fca5a5;
  --b-lime-bg: #24300f; --b-lime: #bef264; --b-amber-bg: #33280e; --b-amber: #fcd34d; --b-solid-green: #15803d;
  --bar-visa: #9ca3af; --bar-leave: #f472b6; --shadow: none; --shadow-sel: none;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { overflow-x: clip; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap {
  max-width: 980px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
  display: grid; gap: 20px;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(28px, 4.5vw, 34px); }
b, strong { font-weight: 600; }
.eyebrow { font-size: 13px; font-weight: 500; color: var(--muted); }
a { color: var(--accent); }
a:hover { color: var(--accent-press); }
a:focus-visible, summary:focus-visible, button:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: 10px; }
.opt input:focus-visible + .opt-body, .m-alt:has(input:focus-visible) { box-shadow: var(--focus-ring); }
/* White bands across the full width, as on the canvas: title band at the top, sticky tab band below */
/* Light / Dark switch, top right of the title band */
.head-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.theme-sw { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--line-soft); }
.theme-sw button { font: inherit; font-size: 13px; font-weight: 500; color: var(--muted); min-height: 32px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
@media (max-width: 480px) { .head-top { flex-wrap: nowrap; } .theme-sw { flex: none; } .theme-sw button { padding: 0 9px; } .theme-sw .t { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } }
.theme-sw button svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.theme-sw button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--shadow-sel); }
:root[data-theme="dark"] .theme-sw button[aria-pressed="true"], :root[data-theme="dark"] .tab[aria-selected="true"], :root[data-theme="dark"] .ml-f[aria-pressed="true"] { background: var(--line); }
.vhead::after { content: ""; position: absolute; left: -100vmax; right: -100vmax; bottom: 0; height: 1px; background: var(--line); }
.sub { color: var(--ink-2); max-width: 64ch; margin: 0; }

/* Trip total card */
.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 18px 20px; display: grid; gap: 14px; }
.sum-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; }
.sum-top .eyebrow { font-size: 14px; }
.sum-top .value { font-size: clamp(26px, 4vw, 30px); font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
.sum-bar { display: flex; gap: 2px; height: 8px; border-radius: 999px; overflow: hidden; background: var(--line-soft); }
.sum-bar span { display: block; height: 100%; min-width: 3px; }
.sum-legend { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 24px; font-size: 13px; color: var(--ink-2); }
.sum-legend span { display: flex; align-items: center; gap: 8px; min-width: 0; }
.sum-legend i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.sum-legend b { margin-left: auto; color: var(--ink); }
.sum-cities { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 16px; padding-top: 12px; border-top: 1px solid var(--line-soft); }
.sum-cell { display: grid; grid-template-rows: 1fr auto; gap: 2px; min-width: 0; }
.sum-cell .label { font-size: 12px; font-weight: 500; color: var(--muted); }
.sum-city .value { font-size: 16px; font-weight: 600; }
.sum-city .label::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--city); margin-right: 6px; vertical-align: 1px; }
.sum-tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 14px; color: var(--muted); padding-top: 12px; border-top: 1px solid var(--line-soft); }
.sum-foot { display: contents; }
.sum-allin { margin-left: auto; font-weight: 600; font-size: 14px; }
.sum-allin a { text-decoration: none; }
@media (max-width: 640px) {
  .summary { padding: 16px; }
  .sum-legend { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; }
  .sum-city .value { font-size: 15px; }
  .sum-allin { margin-left: 0; width: 100%; }
}
.notice { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px 14px 48px; font-size: 14px; display: grid; gap: 2px; color: var(--ink-2); position: relative; }
.notice::before { content: ""; position: absolute; left: 14px; top: 13px; width: 24px; height: 24px; border-radius: 50%; background: var(--b-purple-bg) center / 14px no-repeat; }
.notice::after { content: ""; position: absolute; left: 19px; top: 18px; width: 14px; height: 14px; background: var(--b-purple); -webkit-mask: var(--i-clock) center / contain no-repeat; mask: var(--i-clock) center / contain no-repeat; }
.notice strong { color: var(--ink); font-size: 14px; }
.state { background: var(--surface); border: 1px dashed var(--line); border-radius: 16px; padding: 28px 20px; text-align: center; color: var(--muted); }

/* Tabs */
.tabs-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--surface); box-shadow: 0 0 0 100vmax var(--surface); clip-path: inset(0 -100vmax); display: grid; gap: 8px; padding-block: 10px; }
.tabs, .daybar { scrollbar-width: none; }
.tabs::-webkit-scrollbar, .daybar::-webkit-scrollbar { display: none; }
.tabs { display: flex; gap: 4px; overflow-x: auto; padding: 4px; border-radius: 12px; background: var(--line-soft); }
.tab {
  flex: none; font: inherit; font-weight: 500; font-size: 14px; color: var(--ink-2); cursor: pointer;
  min-height: 40px; padding: 0 14px; border-radius: 9px; border: 0; background: transparent;
  display: inline-flex; align-items: center; gap: 8px;
}
.tab:hover { color: var(--ink); }
.tab::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--city); }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--shadow-sel); }
.tab .n { font-size: 12px; color: var(--muted); font-weight: 500; }
.daybar { display: flex; gap: 6px; overflow-x: auto; }
.daychip { flex: none; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; min-height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
.daychip b { font-weight: 600; color: var(--ink); }
.daychip:hover { border-color: var(--subtle); }
.daychip.exploring::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--k-ticket); margin-left: 4px; }

.city-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 6px 16px; }
.city-head h2 { font-size: 26px; display: flex; align-items: center; gap: 10px; }
.city-head h2::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--city); flex: none; }
.city-head .meta { color: var(--muted); font-size: 14px; margin-top: 2px; }
.city-head .sub-total { font-size: 15px; font-weight: 600; text-align: right; }
.panel { display: grid; gap: 16px; }
@media (max-width: 560px) { .city-head .sub-total, .city-head .sub-total small { text-align: left; } }
.legend { display: flex; flex-wrap: wrap; gap: 8px 12px; font-size: 12.5px; color: var(--muted); align-items: center; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.legend .key { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.legend .halal { margin-left: 0; }

/* Day card */
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; scroll-margin-top: 130px; box-shadow: var(--shadow); }
.day-head { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.stub { display: grid; justify-items: center; text-align: center; line-height: 1.15; }
.stub .dow { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
.stub .d { font-size: 24px; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; }
.stub .m { font-size: 11px; color: var(--muted); font-weight: 500; }
.stub::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--city); margin-top: 3px; }
.day-head h3 { font-size: 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.day-head h3 .chip { letter-spacing: 0; }
.day-head .sum { font-size: 14px; color: var(--muted); margin-top: 2px; }
.day-head .cost { text-align: right; font-size: 15px; font-weight: 600; white-space: nowrap; }
.day-head .cost small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
@media (max-width: 560px) { .day-head { grid-template-columns: 44px minmax(0, 1fr) auto; align-items: start; padding: 14px; gap: 4px 10px; } .stub .d { font-size: 22px; } .day-head h3 { font-size: 18px; } }

.tl { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: 132px 32px minmax(0, 1fr) auto; gap: 2px 12px; padding: 14px 20px; align-items: start; position: relative; }
.row + .row { border-top: 1px solid var(--line-soft); }
.row .time { font-size: 13px; color: var(--muted); padding-top: 6px; white-space: nowrap; }
.row .time { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
.row .time .from { color: var(--ink); font-weight: 600; }
.row .dur { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); color: var(--muted); background: var(--surface); font-size: 10.5px; font-weight: 600; letter-spacing: -.02em; margin-top: -3px; }
.row .time .to { display: block; font-size: 13px; }
.row .ic { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--k) 12%, var(--surface)); color: color-mix(in srgb, var(--k) 70%, var(--ink)); }
.row .ic svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.row { --k: var(--k-free); }
.row.t-meal { --k: var(--k-meal); }
.row.t-activity { --k: var(--k-ticket); }
.row.t-travel, .row.t-transit { --k: var(--k-move); }
.row.t-shopping { --k: var(--k-shop); }
.row.t-sight { --k: var(--k-sight); }
.row.t-hotel, .row.t-stay { --k: var(--k-hotel); }
.row .main { display: grid; gap: 4px; min-width: 0; }
.row .kind { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
.row .kind::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--k); }
.row .title { font-weight: 600; font-size: 15px; line-height: 1.35; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.row .note { font-size: 13px; line-height: 1.45; color: var(--muted); }
.row .stp { display: flex; gap: 6px; align-items: baseline; font-size: 12.5px; line-height: 1.4; color: var(--muted); }
.row .stp b { flex: none; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.row .stp svg, .steps-chip svg { width: 14px; height: 14px; flex: none; align-self: center; fill: currentColor; stroke: none; }
.steps-chip { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; line-height: 1; white-space: nowrap; color: var(--sf); background: var(--sb); }
.lv-light { --sf: var(--b-green); --sb: var(--b-green-bg); }
.lv-mod { --sf: var(--b-blue); --sb: var(--b-blue-bg); }
.lv-heavy { --sf: var(--b-orange); --sb: var(--b-orange-bg); }
.lv-vheavy { --sf: var(--b-red); --sb: var(--b-red-bg); }
.stp-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 10px; box-shadow: var(--shadow); margin-bottom: 16px; }
.stp-card h2 { margin: 0; font-size: 17px; }
.stp-card p { margin: 0; font-size: 13px; line-height: 1.45; color: var(--muted); }
.stp-rows { display: grid; gap: 4px; }
.stp-rows a { display: grid; grid-template-columns: 52px 1fr 64px; gap: 10px; align-items: center; color: inherit; text-decoration: none; font-size: 13px; padding: 2px 0; }
.stp-rows a:hover .stp-bar i { filter: brightness(.95); }
.stp-rows .dt { color: var(--ink-2); font-weight: 600; white-space: nowrap; }
.stp-rows .n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.stp-bar { height: 12px; border-radius: 6px; background: var(--b-grey-bg); overflow: hidden; display: flex; }
.stp-bar i { display: block; height: 100%; border-radius: 6px; background: var(--sf); }
.stp-rows .city-gap { height: 6px; }
.stp-bar i.o { opacity: .35; border-radius: 0 6px 6px 0; }
.steps-chip .o { font-weight: 500; opacity: .85; }
.opt-tag { display: inline-block; margin-left: 4px; padding: 1px 7px; border-radius: 999px; border: 1px dashed var(--line); font-size: 11px; font-weight: 600; color: var(--muted); }
.stp-legend { display: flex; flex-wrap: wrap; gap: 6px; }
.row .right { text-align: right; display: grid; justify-items: end; gap: 4px; }
.pp { --c: var(--ink); display: inline-block; font-size: 14px; font-weight: 600; line-height: 1.3; white-space: nowrap; color: var(--ink); }
.pp-none { color: var(--muted); font-weight: 500; }
.pcap { font-size: 12px; color: var(--muted); white-space: nowrap; }
.rate-m { display: none; }
.opt-prox { font-size: 12.5px; font-weight: 600; color: var(--ok); }
/* Hotel badges: star (or Trip.com diamond) rating and a bidet icon */
.hb { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.hb-stars { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 999px; background: var(--b-grey-bg); color: var(--b-grey); }
.hb-stars i { font-style: normal; letter-spacing: 1px; font-size: 10px; }
.hb-bidet { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px 0 6px; border-radius: 999px; background: var(--b-blue-bg); color: var(--b-blue); }
.ups { display: grid; gap: 6px; }
.ups > b { font-size: 13px; }
.ups-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.up { background: var(--sunken); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; align-content: start; min-width: 0; }
.up strong { font-size: 13.5px; line-height: 1.3; }
.up .up-price { font-size: 16px; font-weight: 700; white-space: nowrap; }
.up .up-price small { font-size: 12px; font-weight: 500; color: var(--muted); }
.up .up-more { font-size: 12px; font-weight: 600; color: var(--b-orange); }
.up .up-more.less { color: var(--ok); }
.up small.up-facts { font-size: 12px; color: var(--muted); }
.opt-ups { display: block; font-size: 12.5px; color: var(--muted); }
.hguide { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 0 10px; }
.hguide > div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 1px; min-width: 0; }
.hguide span { font-size: 12px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.hguide span svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hguide b { font-size: 17px; font-weight: 700; }
.hguide small { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hguide-note { font-size: 12px; color: var(--muted); margin: -4px 0 10px; }
.hb-bidet svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Status badges: icon + label (the design's icon circles, with the word kept for clarity) */
.chip, .halal, .opt-title .rec { --bb: var(--b-grey-bg); --bf: var(--b-grey); --ic: var(--i-minus);
  display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px 0 4px; border-radius: 999px; white-space: nowrap;
  font-size: 12px; font-weight: 600; line-height: 1; letter-spacing: 0; text-transform: none; background: var(--bb); color: var(--bf); vertical-align: middle; }
.chip::before, .halal::before, .opt-title .rec::before { content: ""; width: 18px; height: 18px; flex: none; background: currentColor; -webkit-mask: var(--ic) center / 14px no-repeat; mask: var(--ic) center / 14px no-repeat; }
.chip.ice { --bb: var(--b-blue-bg); --bf: var(--b-blue); --ic: var(--i-snow); }
.row .kind .chip.ice { margin-left: 6px; }
.chip.final { --bb: var(--b-green-bg); --bf: var(--b-green); --ic: var(--i-check); }
.chip.exploring { --bb: var(--b-orange-bg); --bf: var(--b-orange); --ic: var(--i-help); }
.chip.available { --bb: var(--b-green-bg); --bf: var(--b-green); --ic: var(--i-ticket); }
.chip.not_released { --bb: var(--b-purple-bg); --bf: var(--b-purple); --ic: var(--i-clock); }
.chip.sold_out { --bb: var(--b-red-bg); --bf: var(--b-red); --ic: var(--i-x); }
.chip.unverified { --bb: var(--b-grey-bg); --bf: var(--b-grey); --ic: var(--i-help); box-shadow: inset 0 0 0 1.5px var(--line); }
.chip.skip { --bb: var(--b-grey-bg); --bf: var(--b-grey); --ic: var(--i-minus); }
.chip.free { --bb: var(--b-blue-bg); --bf: var(--b-blue); --ic: var(--i-ticket); }
.chip.agreed { --bb: var(--b-blue-bg); --bf: var(--b-blue); --ic: var(--i-bookmark); }
.chip.booked { --bb: var(--b-green-bg); --bf: var(--b-green); --ic: var(--i-check); }
.chip.needed { --bb: var(--b-orange-bg); --bf: var(--b-orange); --ic: var(--i-alert); }
.chip.not_needed { --bb: var(--b-green-bg); --bf: var(--b-green); --ic: var(--i-check); }
.stm { display: inline-flex; align-items: center; height: 26px; margin-left: 6px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; line-height: 1; letter-spacing: 0; text-transform: none; vertical-align: middle; white-space: nowrap; }
.stm.s-easy { color: var(--b-blue); background: var(--b-blue-bg); }
.stm.s-rough { color: var(--b-orange); background: var(--b-orange-bg); }
.m-row .stm, .m-alt .stm { margin-left: 0; }
.ml-gut { display: grid; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; font-size: 13.5px; color: var(--ink-2); box-shadow: var(--shadow); }
.ml-gut b { font-size: 15px; color: var(--ink); }
.ml-gut .bar { display: flex; gap: 3px; flex-wrap: wrap; margin: 4px 0 2px; }
.ml-gut .bar i { width: 14px; height: 14px; border-radius: 4px; background: var(--b-blue-bg); border: 1px solid color-mix(in srgb, var(--b-blue) 30%, transparent); }
.ml-gut .bar i.r { background: var(--cq); border-color: var(--cq); }
.ml-gut .bar i.gap { width: 6px; background: none; border: 0; }
.ml-gut ul { margin: 0; padding-left: 18px; color: var(--muted); }

/* Bottom menu on phones */

  const apply = () => {
    if (root.getAttribute("data-theme") !== pick) root.setAttribute("data-theme", pick);
    document.querySelectorAll("[data-theme-set]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.themeSet === pick)));
  };
  apply();
  // Keep the viewer's pick if the host page changes the theme attribute
  new MutationObserver(apply).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
  document.addEventListener("click", (e) => {
    const b = e.target.closest && e.target.closest("[data-theme-set]");
    if (!b) return;
    pick = b.dataset.themeSet;
    try { localStorage.setItem(KEY, pick); } catch (_) {}
    apply();
  });
})();

      return gap + '<a href="#day/' + d.date + '" class="lv-' + l[2] + '" title="' + esc(d.title + ": " + l[1]) + '"><span class="dt">' + esc(dp.dow + " " + dp.d) + '</span><span class="stp-bar"><i style="width:' + Math.max(2, Math.round(vals[i] / max * 100)) + '%"></i>' + (opts[i] ? '<i class="o" style="width:' + Math.round(opts[i] / max * 100) + '%" title="' + esc("Optional shopping: about " + r100(opts[i]) + " more") + '"></i>' : "") + '</span><span class="n">' + r100(vals[i]) + '</span></a>'; }).join("");
    return '<section class="stp-card" aria-label="Walking per day"><h2>Walking per day</h2>' +
      '<p>Steps for one average adult, from every row of the plan: walks between places, stations and airports, and time on foot at each sight. About 1,300 steps make 1 km. Optional shopping is left out of the totals and shown as the lighter part of each bar. Average ' + fmtN(Math.round(avg / 100) * 100) + ' a day' + (big ? '; ' + big + ' day' + (big > 1 ? "s" : "") + ' over 20,000' : "") + (range ? '; longest heavy run ' + esc(range) + ' (' + best.length + ' days in a row)' : "") + '.</p>' +
      '<div class="stp-legend">' + STEP_LEVELS.map((l, i) => '<span class="steps-chip lv-' + l[2] + '">' + l[1] + ' ' + (i === 0 ? "under 10,000" : i === STEP_LEVELS.length - 1 ? "20,000+" : fmtN(STEP_LEVELS[i - 1][0]) + "–" + fmtN(l[0])) + '</span>').join("") + '</div>' +
      '<div class="stp-rows">' + rows + '</div></section>';
  }
  function mealKind(it) {
    if (it.meal) return it.meal;
    const t = String(it.title || "").toLowerCase();
    if (/breakfast|brunch/.test(t)) return "breakfast";
    if (/lunch/.test(t)) return "lunch";
    if (/dinner|supper/.test(t)) return "dinner";
    const h = parseInt(it.start, 10); return h < 11 ? "breakfast" : h < 16 ? "lunch" : "dinner";
  }

  function dateParts(iso) {
    const d = new Date(iso + "T12:00:00Z");
    return { dow: d.toLocaleDateString("en-GB", { weekday: "short", timeZone: "UTC" }), d: d.getUTCDate(), m: d.toLocaleDateString("en-GB", { month: "short", timeZone: "UTC" }) };
  }

  // Hotels must be refundable: show the free-cancellation deadline, or flag a rate without one
  const cancelLine = (o) => o.cancel ? '<span class="opt-cancel">✓ ' + esc(o.cancel) + '</span>' : o.unit === "room" && o.status !== "sold_out" ? '<span class="opt-cancel no">Non-refundable</span>' : "";
  // Star rating (Trip.com "diamonds" for mainland hotels without an official rating) and a bidet icon when the room has one
  const BIDET_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11h16"/><path d="M5 11a7 6 0 0 0 14 0"/><path d="M9 16.5 8 21h8l-1-4.5"/><path d="M12 3v4M8.5 4.5 10 7.5M15.5 4.5 14 7.5"/></svg>';
  function hotelBadges(o) {
    if (!o) return "";
    const n = Math.round(o.stars || 0), dia = o.starsKind === "diamond";
    const stars = n ? '<span class="hb-stars" title="' + esc(n + (dia ? " diamonds on Trip.com (no official star rating)" : "-star hotel")) + '">' + esc(n + (dia ? "-diamond hotel" : "-star hotel")) + '<i aria-hidden="true">' + (dia ? "◆" : "★").repeat(n) + '</i></span>' : "";
    const bidet = o.bidet === "yes" ? '<span class="hb-bidet" title="' + esc(o.bidetWhy || "Room has a bidet") + '">' + BIDET_SVG + 'Bidet</span>' : "";
    return stars || bidet ? '<span class="hb">' + stars + bidet + '</span>' : "";
  }
  // Per-city price guide (typical refundable night for 2 adults incl. taxes, from Trip.com search), stored on the hotel doc as `guide`
  function cityGuide(xs) {
    const g = (xs.find((a) => a.guide) || {}).guide; if (!g) return "";
    const tile = (k, label, icon) => { const v = g[k]; if (!v) return ""; return '<div title="' + esc(v.method || "") + '"><span>' + (icon || "") + esc(label) + '</span><b>' + (v.avgPerNight != null ? money(Math.round(v.avgPerNight)) : "–") + '</b><small>' + esc(v.n === 1 ? "Only 1 hotel" : v.min != null ? money(Math.round(v.min)) + "–" + Math.round(v.max).toLocaleString("en-US") : (v.label || "")) + '</small></div>'; };
    return '<div class="hguide" aria-label="Typical hotel prices a night">' + tile("stars4", "Avg 4-star") + tile("stars5", "Avg 5-star") + tile("bidet", "With bidet", BIDET_SVG) + '</div>' +
      '<p class="hguide-note">' + esc(g.note || ("Average night for two incl. taxes, refundable rates, about 10 hotels each, " + (g.area || "near the plan") + (g.checkedOn ? ", Trip.com " + dayLabel(g.checkedOn).replace(/^\w+ /, "") : ""))) + '</p>';
  }
  // Other room types in the same hotel, priced against the cheapest room (`upgrades` on the option). Totals always use the cheapest room.
  function upPct(o, u) { return o.price ? Math.round((u.perNight / o.price - 1) * 100) : null; }
  function roomSquares(o) {
    const ups = (o && o.upgrades) || []; if (!ups.length) return "";
    return '<div class="ups"><b>Other rooms here</b><div class="ups-grid">' + ups.map((u) => { const pct = upPct(o, u), diff = u.total != null && o.price ? u.total - o.price * (o.nights || 1) : null;
      return '<div class="up"><strong>' + esc(u.label) + '</strong><span class="up-price">' + money(Math.round(u.perNight)) + '<small> a night</small></span>' +
        (pct != null ? '<span class="up-more' + (pct < 0 ? " less" : "") + '">' + (pct >= 0 ? "+" : "−") + Math.abs(pct) + '%' + (diff != null ? " · " + (diff >= 0 ? "+" : "−") + money(Math.abs(Math.round(diff))) + " in all" : "") + '</span>' : "") +
        '<small class="up-facts">' + esc([u.view, u.size, u.meal && !/^room only$/i.test(u.meal) ? u.meal : "", u.cancel ? String(u.cancel).replace(/^Free cancellation until .*?on /, "Cancel free to ") : "Non-refundable"].filter(Boolean).join(" · ")) + '</small></div>'; }).join("") + '</div></div>';
  }
  const upsLine = (o) => (o.upgrades || []).length ? '<span class="opt-ups">Other rooms: ' + o.upgrades.map((u) => esc(u.short || u.label) + " " + money(Math.round(u.perNight)) + (upPct(o, u) != null ? " (" + (upPct(o, u) >= 0 ? "+" : "−") + Math.abs(upPct(o, u)) + "%)" : "")).join(" · ") + '</span>' : "";
  function renderOption(a, o, cid, disabled) {
    const idAttr = "opt-" + a.id + "-" + o.id;
    const group = costForGroup(o);
    const priceCol = o.price == null
      ? '<span class="opt-price">–<small>' + esc(STATUS_TEXT[o.status] || "") + '</small></span>'
      : '<span class="opt-price">' + (o.price === 0 ? "Free" : money(o.price)) + '<small>' + esc(unitText(o)) + (group && o.unit !== "group" && o.unit !== "cabin" ? " · " + money(group) + (o.unit === "room" ? " in all" : " for two") : "") + '</small></span>';
    const rate = o.ratings ? compactRating(o.ratings).html : "";
    const near = o.walk ? o.walk.filter((w) => w.min <= 15).length : 0;
    const saves = o.savesMin == null ? "" : o.savesMin > 0 ? "Saves about " + o.savesMin + " min of travel" : o.savesMin < 0 ? "About " + (-o.savesMin) + " min more travel" : "";
    const prox = (saves || near) ? '<span class="opt-prox">' + [saves, near ? near + " plan stops within a 15-min walk" : "", o.bundNYE ? "Bund " + o.bundNYE + " min on foot on New Year’s Eve" : ""].filter(Boolean).map(esc).join(" · ") + '</span>' : "";
    const meta = [o.time, o.duration, o.note].filter(Boolean).map(esc).join(" · ");
    const term = o.searchTerm || (o.searchUrl && keywordFrom(o.searchUrl)) || null;
    return '<label class="opt" for="' + idAttr + '"><input type="radio" name="pick-' + esc(a.id) + '" id="' + idAttr + '" value="' + esc(o.id) + '"' + (cid === o.id ? " checked" : "") + disabled + '>' +
      '<span class="opt-body"><span class="radio" aria-hidden="true"></span><span class="opt-main"><span class="opt-title">' + esc(o.label) +
      ' <span class="chip ' + esc(o.status) + '">' + esc(STATUS_TEXT[o.status] || o.status) + '</span>' + (o.recommended ? ' <span class="rec">★ Suggested</span>' : "") + '</span>' +
      hotelBadges(o) + prox + cancelLine(o) + upsLine(o) + (meta ? '<span class="opt-meta">' + meta + '</span>' : "") + (term ? iconLinks(term, o.url, o.igTag) : "") + '</span>' +
      '<span class="opt-side">' + rate + priceCol + '</span></span></label>';
  }

  // Ticket block shown inside a timeline row
  // ---- Hotels: one stay card at the top of each city; the timeline only shows light check-in/out rows
  const isHotel = (a) => a && a.kind === "hotel";
  const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  function stayDates(a) { const p = chosen(a) || (a.options || [])[0] || {}; const ci = a.checkIn || a.date; return { ci, co: a.checkOut || addDays(ci, p.nights || 1), nights: p.nights || 1 }; }
  const splitLabel = (l) => { const i = String(l || "").indexOf(" — "); return i < 0 ? [l || "", ""] : [l.slice(0, i), l.slice(i + 3)]; };
  const hotels = () => [...state.activities.values()].filter(isHotel);
  function stayForNight(date) { return hotels().find((a) => { const d = stayDates(a); return d.ci <= date && date < d.co; }); }
  const dayLabel = (iso) => { const dp = dateParts(iso); return dp.dow + " " + dp.d + " " + dp.m; };
  function hotelRowFor(a, role) {
    for (const d of state.days.values()) (d.items || []).forEach((it, i) => { if (it.activityId === a.id && (it.role || "checkin") === role) hotelRowFor.hit = { date: d.date, i, it }; });
    const h = hotelRowFor.hit; hotelRowFor.hit = null; return h;
  }
  function renderStay(a) {
    const pick = chosen(a), cid = choiceId(a), d = stayDates(a);
    const cost = pick ? costForGroup(pick) : null;
    const [name, room] = splitLabel(pick ? pick.label : a.name);
    const disabled = state.canWrite === false ? " disabled" : "";
    const ci = hotelRowFor(a, "checkin"), co = hotelRowFor(a, "checkout");
    const cell = (lbl, date, row) => '<a class="stay-when" href="' + (row ? "#r-" + row.date + "-" + row.i : "#") + '"><span>' + lbl + '</span><b>' + esc(dayLabel(date)) + '</b>' + (row ? '<small>' + esc(ampm(row.it.start)) + '</small>' : "") + '</a>';
    const walk = pick && pick.walk ? pick.walk.filter((w) => w.min <= 15).sort((x, y) => x.min - y.min) : [];
    const prices = (a.options || []).map(costForGroup).filter((x) => x != null);
    const range = prices.length > 1 ? " · " + money(Math.round(Math.min(...prices))) + "–" + money(Math.round(Math.max(...prices))) : "";
    const key = a.id + ":options", open = !pick ? !closedSet.has(key) : openSet.has(key);
    const opts = (a.options || []).map((o) => renderOption(a, o, cid, disabled));
    return '<section class="stay" id="stay-' + esc(a.id) + '">' +
      '<div class="stay-top"><div class="stay-eyebrow">Where we stay · ' + d.nights + ' nights' + (pick ? ' <span class="chip ' + esc(pick.status) + '">' + esc(STATUS_TEXT[pick.status] || pick.status) + '</span>' : "") + '</div>' +
      '<div class="stay-price">' + (cost != null ? pill(money(round2(cost)), "hotel", money(round2(cost)) + " for " + d.nights + " nights") + cap(money(round2(cost / d.nights)) + " a night") : pill("Not chosen", "none", "")) + '</div></div>' +
      '<h3 class="stay-name" tabindex="-1">' + esc(name) + '</h3>' + (room ? '<div class="stay-room">' + esc(room) + '</div>' : "") +
      hotelBadges(pick) +
      (pick && pick.ratings ? '<div>' + compactRating(pick.ratings).html + '</div>' : "") +
      '<div class="stay-dates">' + cell("Check in", d.ci, ci) + cell("Check out", d.co, co) + '</div>' +
      (pick ? '<div class="stay-facts">' + [pick.time, pick.duration].filter(Boolean).map((x) => '<span>' + esc(x) + '</span>').join("") + '</div>' : "") +
      (pick ? cancelLine(pick) : "") +
      (pick && pick.note ? '<p class="stay-why">' + esc(pick.note) + '</p>' : "") +
      roomSquares(pick) +
      (walk.length ? '<div class="stay-walk"><b>Walkable from here</b>' + walk.map((w) => '<span class="wchip">' + esc(w.place) + ' · ' + w.min + ' min</span>').join("") + '</div>' : "") +
      (pick ? iconLinks(pick.searchTerm || name, pick.url, pick.igTag) : "") +
      '<details data-key="' + esc(key) + '"' + (open ? " open" : "") + '><summary>Compare ' + (a.options || []).length + ' hotels<span class="hint">' + esc(range) + '</span></summary><div class="opts">' + opts.join("") + '</div></details></section>';
  }

  function renderTicket(a) {
    const cid = choiceId(a), pick = chosen(a), exploring = a.decision === "exploring";
    const disabled = state.canWrite === false ? " disabled" : "";
    const cost = pick ? costForGroup(pick) : null;
    const pk = a.kind === "hotel" ? "hotel" : "ticket";
    let price;
    if (!pick) price = pill("–", "none", "") + cap(a.backup ? "backup" : exploring ? "not decided" : "skipped");
    else if (cost == null) price = pill("Pending", "none", "Not on sale yet") + cap("not on sale yet");
    else if (cost === 0) price = pill("Free", pk, "No ticket needed");
    else price = pill(money(round2(cost)), pk, money(round2(cost)) + " for two") + (pick.unit === "room" ? cap((pick.nights || 1) + " nights") : pick.unit === "group" || pick.unit === "cabin" ? cap("for the group") : "");
    const ratingSrc = (pick && pick.ratings) || (!exploring ? a.ratings : null);
    const rating = ratingSrc ? compactRating(ratingSrc).html : (exploring ? "" : '<span class="rate na">Rating not available</span>');
    const decision = a.decision === "final" ? '<span class="chip final">Final</span>' : exploring ? '<span class="chip exploring">Exploring</span>' : "";
    const status = pick ? '<span class="chip ' + esc(pick.status) + '">' + esc(STATUS_TEXT[pick.status] || pick.status) + '</span>' : '<span class="chip skip">' + (exploring ? "Not decided" : a.backup ? "Backup" : "Skipped") + '</span>';
    const facts = pick ? [pick.time, pick.duration].filter(Boolean).map(esc).join(" · ") : "";
    const opts = (a.options || []).map((o) => renderOption(a, o, cid, disabled));
    const skipId = "opt-" + a.id + "-skip";
    if (!isHotel(a)) opts.push('<label class="opt" for="' + skipId + '"><input type="radio" name="pick-' + esc(a.id) + '" id="' + skipId + '" value="skip"' + (cid === "skip" ? " checked" : "") + disabled + '>' +
      '<span class="opt-body"><span class="radio" aria-hidden="true"></span><span class="opt-main"><span class="opt-title">' + (a.backup ? "Keep as backup" : exploring ? "Nothing planned for this slot" : "Skip this") + '</span><span class="opt-meta">Not counted in the total.</span></span><span class="opt-side"><span class="opt-price">US$0</span></span></span></label>');
    const key = a.id + ":options";
    const open = exploring ? !closedSet.has(key) : openSet.has(key);
    return {
      right: price + '<span class="rate-d">' + rating + '</span>',
      rating: rating,
      block: '<div class="ticket' + (exploring ? " exploring" : "") + '">' +
        '<div class="ticket-line">' + decision + status + '<span class="pick">' + esc(pick ? pick.label : exploring ? "Compare the options below." : a.backup ? "Use if something is cancelled." : "Skipped") + '</span></div>' +
        (facts ? '<div class="ticket-facts">' + facts + '</div>' : "") +
        (!exploring ? (a.kind === "hotel" && pick ? iconLinks(pick.searchTerm || pick.label, pick.url, pick.igTag) : iconLinks(activityTerm(a), activityListing(a), a.igTag)) : "") +
        (exploring && renderTicket.pickAbove ? '<a class="stay-ref" href="#pick-' + esc(a.id) + '">' + (pick ? "Change the pick above ↑" : "Pick an option above ↑") + '</a>' : '<details data-key="' + esc(key) + '"' + (open ? " open" : "") + '><summary>' + (exploring ? "Options we are exploring" : a.kind === "hotel" ? "Hotel options" : "Ticket options") + ' <span class="hint">· ' + (a.options || []).length + '</span></summary><div class="opts">' + opts.join("") + '</div></details>') + '</div>'
    };
  }

  function renderRow(item, city, rowDate, rowIdx) {
    const a = item.activityId ? state.activities.get(item.activityId) : null;
    const type = a ? (a.kind === "hotel" ? "hotel" : "activity") : (item.type || "free");
    const mins = durationMin(item);
    const time = '<span class="span"><span class="from">' + esc(ampm(item.start)) + '</span>' + (item.end ? '<span class="to">– ' + esc(ampm(item.end)) + '</span>' : "") + '</span>' +
      (mins ? '<span class="dur" title="Duration ' + esc(durText(mins)) + '" aria-label="Duration ' + esc(durText(mins)) + '">' + esc(durText(mins)) + '</span>' : "");
    let right = "", extra = "", rateM = "";
    if (isHotel(a)) {
      const [hn] = splitLabel((chosen(a) || {}).label || a.name);
      const other = a.city !== city;
      extra = '<a class="stay-ref" href="#stay-' + esc(a.id) + '" data-city="' + esc(a.city) + '" style="--c: var(--' + esc(a.city) + ')">' + esc(hn) + (other ? " → " + esc((CITY_FALLBACK[a.city] || {}).name || a.city) : " ↑") + '</a>';
    } else if (a) { const t = renderTicket(a); right = t.right; extra = t.block; rateM = t.rating ? '<span class="rate-m">' + t.rating + '</span>' : ""; }
    else if (item.cost != null) {
      const c = round2(itemCost(item));
      const tip = (item.costEstimate ? "Estimate, " : "Today's price, ") + money(c) + " for two" + (item.costBasis ? ". " + item.costBasis : "") + (item.costRange ? " · US$" + item.costRange[0] + "–" + item.costRange[1] + " per person" : "");
      right = item.costIncluded ? pill("Included", "none", item.note || "Included") : pill((item.costEstimate ? "~" : "") + money(c), item.type === "meal" ? "meal" : "move", tip);
    }
    const term = !a && item.place ? placeTerm(item.place, item.city || city) : null;
    return '<li class="row t-' + esc(type) + (isHotel(a) ? " t-stay" : "") + '" id="r-' + esc(rowDate) + '-' + rowIdx + '"><span class="time">' + time + '</span><span class="ic">' + (TYPE_ICON[type] || TYPE_ICON.free) + '</span>' +
      '<div class="main"><span class="kind">' + esc(TYPE_TEXT[type] || type) + (item.optional ? '<span class="opt-tag" title="Optional: do as much as you like, or rest instead">Optional</span>' : "") + (item.halal ? ' <span class="halal h-' + esc(item.halal) + '"' + (item.halalSource ? ' title="' + esc(item.halalSource) + '"' : "") + '>' + esc(HALAL_TEXT[item.halal] || item.halal) + '</span>' : "") + stomachBadge(item) + iceBadge(item) + '</span><span class="title">' + esc(item.title) + '</span>' + rateM +

  }

  function dayCost(day) {
    let s = 0; const seen = new Set();
    for (const it of effItems(day)) {
      s += moveCost(it) || 0;
      if (!it.activityId) { s += itemCost(it) || 0; continue; }
      if (seen.has(it.activityId)) continue; seen.add(it.activityId);
      const a = state.activities.get(it.activityId); if (!a || isHotel(a)) continue;
      const c = costForGroup(chosen(a)); if (c) s += c;
    }
    return s;
  }

  function renderDay(day) {
    const dp = dateParts(day.date);
    const cost = dayCost(day);
    const exploring = (day.items || []).some((it) => { const a = it.activityId && state.activities.get(it.activityId); return a && a.decision === "exploring" && !chosen(a); });
    return '<section class="day" id="day-' + esc(day.date) + '" style="--city: var(--' + esc(day.city) + ')">' +
      '<div class="day-head"><div class="stub" aria-hidden="true"><span class="dow">' + esc(dp.dow) + '</span><span class="d">' + dp.d + '</span><span class="m">' + esc(dp.m) + '</span></div>' +
      '<div><h3>' + esc(day.title) + (exploring ? ' <span class="chip exploring">Pick one</span>' : "") + '</h3><div class="sum">' + esc(day.summary || "") + '</div></div>' +
      '<div class="cost">' + (cost ? money(round2(cost)) : "–") + '<small>for two</small>' + (() => { const h = stayForNight(day.date); const p = h && chosen(h); const c = p && costForGroup(p); return c ? '<small class="night">+ ' + money(round2(c / (p.nights || 1))) + (h.city !== day.city ? " " + esc(CITY_WORD[h.city] || "") : "") + ' hotel night</small>' : ""; })() + '</div></div>' +
      '<ol class="tl">' + effItems(day).map((it, i) => renderLeg(it) + renderRow(it, day.city, day.date, i)).join("") + '</ol></section>';
  }

  function totals() {
    const t = { hk: 0, cq: 0, sh: 0 }, k = { tickets: 0, hotels: 0, meals: 0, transport: 0 }; let pending = 0, finals = 0, exploring = 0;
    for (const d of state.days.values()) for (const it of effItems(d)) {
      const mc = moveCost(it); if (mc) { t[d.city] = (t[d.city] || 0) + mc; k.transport += mc; }
      if (it.activityId) continue;
      const c = itemCost(it); if (!c) continue;
      t[d.city] = (t[d.city] || 0) + c; k[it.type === "meal" ? "meals" : "transport"] += c;

      if (a.backup) continue;
      const p = chosen(a); if (!p) continue;
      const c = costForGroup(p);
      if (c == null || p.status === "not_released") pending++;

    }
    return { t, k, pending, finals, exploring };
  }

  // ---- Flights, trains and visas: a separate tab, kept out of the trip total
  const TRAVEL_TAB = "travel";
  const legCost = (l) => l.price == null || l.includedIn ? 0 : l.priceUnit === "person" ? l.price * travellers() : l.price;
  function travelTotals() {
    const t = state.travel || {}; let legs = 0, visas = 0;
    for (const l of t.legs || []) if (!l.countedInDays) legs += legCost(l);
    for (const v of t.visas || []) visas += v.cost || 0;
    return { legs, visas, all: legs + visas };
  }

  function renderMeals() {

    const shown = meals.filter(mealShown);

  // ---- Screens, as on the canvas "China Trip Page Redesign": Today, Days, one day, To do, plus Meals, Hotels and Flights & visa.
  // Routes live in the URL hash: #today, #days, #day/2026-12-26, #todo, #meals, #hotels, #travel, #considered[/flight|route|hotel|meal|activity] (#today/2026-12-21T10:05 previews a moment of the trip).

  const isoLocal = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const toMin = (t) => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(t || "")); return m ? +m[1] * 60 + +m[2] : null; };

  function nowInfo(at) {
    const ds = sortedDays(), d = new Date();

    if (!ds.length) return { phase: "none", date, min, ds };

  function route() {
    const h = decodeURIComponent((location.hash || "").slice(1));

  // ---- Status of a day: one badge for decisions, plus "not on sale yet" when a ticket or train is not released
  const BADGE = { final: ["final", "Final"], pick: ["exploring", "Pick one"], sale: ["not_released", "Not on sale yet"], suggested: ["suggested", "Suggested pick"], travel: ["travel", "Travel day"] };
  const badge = (k, iconOnly) => '<span class="chip ' + BADGE[k][0] + (iconOnly ? ' ico" title="' + esc(BADGE[k][1]) + '">' + sr(BADGE[k][1]) : '">' + esc(BADGE[k][1])) + '</span>';
  const dayActs = (day) => [...new Set((day.items || []).map((it) => it.activityId).filter(Boolean))].map((id) => state.activities.get(id)).filter((a) => a && !isHotel(a));
  function dayStatus(day) {
    const acts = dayActs(day), items = day.items || [], out = [];
    if (acts.some((a) => a.decision === "exploring" && !chosen(a))) out.push("pick");

    else if (acts.length) out.push("suggested");

  function dayBreakdown(day) {

  const MONTHS = { Jan: "01", Feb: "02", Mar: "03", Apr: "04", May: "05", Jun: "06", Jul: "07", Aug: "08", Sep: "09", Oct: "10", Nov: "11", Dec: "12" };

  function leaveTotals() {

        '<div class="dv-card">' + hotelRows + '<ol class="dv-days">' + days.map((d) => { const dp = dateParts(d.date);
          return '<li><a href="#day/' + d.date + '"><span class="dn"><span>' + esc(dp.dow) + '</span><b>' + dp.d + '</b></span><span class="dx"><strong>' + esc(d.title) + '</strong><span>' + esc(d.summary || "") + '</span><span class="dbadges">' + dayStatus(d).map((s) => badge(s, true)).join("") + (hasSteps(d) ? dayChip(d) : "") + '</span></span>' + CHEV_R + '</a></li>'; }).join("") + '</ol></div>' +
        (backups.length ? '<div class="backup"><h3>Backup if something is cancelled</h3>' + backups.map((a) => '<div><div class="title"><b>' + esc(a.name) + '</b> <span class="note">' + esc(a.area || "") + '</span></div>' + renderTicket(a).block + '</div>').join("") + '</div>' : "") + '</section>';

  // ---- One day: the choice to make at the top, then the hour-by-hour plan, then the day total

  function dayView(r) {

  // ---- Today: what is on now, next, later, and today's spend; before the trip a countdown and day 1
  function todayView(r) {
    const n = nowInfo(r.at);
    if (n.phase === "none") return vhead('<h1>Today</h1><p class="sub">No days in the plan yet.</p>');
    if (n.phase === "after") return vhead('<div class="eyebrow">' + esc(tripDatesText()) + '</div><h1>The trip is over</h1><p class="sub">Welcome home. Every day is still in <a href="#days">Days</a>.</p>');
    if (n.phase === "before") {
      const left = daysBetween(n.date, n.first), d1 = n.ds[0];
      const nd = todoItems().filter((x) => !x.done).sort((a, b) => (a.due || "").localeCompare(b.due || ""))[0];
      return vhead('<div class="eyebrow">' + esc(tripDatesText()) + '</div><h1>' + (left === 1 ? "The trip starts tomorrow" : left + " days to go") + '</h1><p class="sub">This screen follows the plan hour by hour once the trip starts on ' + esc(dayLabel(n.first)) + '.</p>') +
        (nd ? deadlineCard(nd, n.date) : "") +
        '<section class="next-card"><span class="kicker">Day 1 · ' + esc(dayLabel(d1.date)) + '</span><h3>' + esc(d1.title) + '</h3><p class="sub">' + esc(d1.summary || "") + '</p>' +
        '<ul class="mini">' + effItems(d1).slice(0, 4).map((it) => '<li><b>' + esc(ampm(it.start)) + '</b><span>' + esc(it.title) + '</span></li>').join("") + '</ul><a class="btn" href="#day/' + d1.date + '">Open day 1' + CHEV_R + '</a></section>';
    }
    const ds = n.ds, day = state.days.get("d-" + n.date) || ds.filter((d) => d.date <= n.date).pop() || ds[0];
    const idx = ds.indexOf(day), dp = dateParts(day.date), items = effItems(day).map((it, i) => Object.assign({}, it, { i }));
    const span = (it) => { const s = toMin(it.start); let e = toMin(it.end); if (e == null) e = s + 30; if (e < s) e += 1440; return [s, e]; };
    const nowIt = items.filter((it) => { const [s, e] = span(it); return s <= n.min && n.min < e; }).pop();
    const upcoming = items.filter((it) => span(it)[0] > n.min && it !== nowIt);
    const nextIt = upcoming[0], later = upcoming.slice(1), done = items.filter((it) => span(it)[1] <= n.min && it !== nowIt);
    const time = (h, m) => { const d = new Date(2000, 0, 1, Math.floor(h / 60) % 24, h % 60); return ampm(String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0")); };
    const strip = ds.slice(Math.max(0, idx - 2), Math.max(0, idx - 2) + 7).map((d) => { const p = dateParts(d.date), on = d === day;
      return '<a href="' + (on ? "#today" : "#day/" + d.date) + '"' + (on ? ' aria-current="page"' : "") + '><span>' + (on ? "Today" : esc(p.dow)) + '</span><b>' + p.d + '</b></a>'; }).join("");
    let h = vhead('<div class="vh-top"><span class="eyebrow dot">Day ' + (idx + 1) + ' of ' + ds.length + ' · ' + esc(CITY_WORD[day.city] || day.city) + '</span><span class="eyebrow">' + esc(dp.dow + " " + dp.d + " " + dp.m + " · " + time(n.min)) + '</span></div><h1>' + esc(day.title) + '</h1><nav class="strip" aria-label="Days">' + strip + '</nav>', day.city);
    const place = (it) => it.place || it.title;
    const maps = (it) => "https://maps.apple.com/?q=" + encodeURIComponent(placeTerm(place(it), it.city || day.city) || place(it));
    const photos = (it) => igSearch(placeTerm(place(it), it.city || day.city) || place(it));
    if (nowIt) {
      const [s, e] = span(nowIt), pct = Math.round(Math.max(0, Math.min(1, (n.min - s) / (e - s))) * 100), left = e - n.min;
      h += '<section class="now-card" aria-label="Now"><div class="nc-top"><span class="live">Now</span><span>' + esc(ampm(nowIt.start)) + (nowIt.end ? " – " + esc(ampm(nowIt.end)) : "") + '</span></div><h2>' + esc(nowIt.title) + '</h2>' + (nowIt.freezing ? '<p class="sub">' + iceBadge(nowIt) + '</p>' : "") +
        (nowIt.place ? '<p class="sub with-ic">' + PIN + esc(nowIt.place) + '</p>' : "") +
        '<div class="prog"><div class="bar"><i style="width:' + pct + '%"></i></div><span>' + esc(durText(left)) + ' left</span></div>' +
        '<div class="btns"><a class="btn dark" href="' + esc(maps(nowIt)) + '" target="_blank" rel="noopener">' + NAVI + 'Directions</a><a class="btn" href="' + esc(photos(nowIt)) + '" target="_blank" rel="noopener">' + CAM + 'Photos</a></div>' +
        '<a class="stay-ref" href="#r-' + day.date + '-' + nowIt.i + '">See it in the day plan</a></section>';
    } else {
      h += '<section class="now-card" aria-label="Now"><div class="nc-top"><span class="live idle">Free time</span></div><h2>Nothing planned right now</h2><p class="sub">' + esc(nextIt ? "Next up at " + ampm(nextIt.start) + "." : "The plan for today is done.") + '</p></section>';
    }
    if (nextIt) {
      const m = nextIt.move, cost = itemCost(nextIt);
      h += '<section class="next-card" aria-label="Next"><span class="kicker">Next · ' + esc(ampm(nextIt.start)) + '</span><h3>' + esc(nextIt.title) + '</h3><div class="meta-row">' +
        (m && m.mode && m.mode !== "none" ? '<span>' + esc((m.label || (MOVE[MODE_ALIAS[String(m.mode).toLowerCase()] || String(m.mode).toLowerCase()] || [m.mode])[0]) + (m.minutes ? " " + durText(m.minutes) : "")) + '</span>' : "") +
        (cost != null && !nextIt.activityId ? '<span>' + esc((nextIt.costEstimate ? "About " : "") + money(round2(nextIt.cost)) + (nextIt.costUnit === "group" ? " for the group" : " each")) + '</span>' : "") +

  // ---- Earlier options (collection "considered"): everything set aside or looked at, kept so Claude Code can switch back.
  // One doc per option: kind, topic, title, status (was-planned | was-picked | looked-at), setAside, why, replacedBy, price (for two), deltaVsPlan, legs, facts, image, restore.
  const CV_KINDS = [["all", "All"], ["flight", "Flights & trains"], ["route", "Route"], ["hotel", "Hotels"], ["meal", "Meals"], ["activity", "Activities"]];
  const CV_STATUS = { "was-planned": ["agreed", "Was in the plan"], "was-picked": ["swapped", "Was your pick"], "looked-at": ["unverified", "Looked at"] };

  const cvList = () => [...state.considered.values()];
  function cvTopic(e) {

      '<div class="tv-name">' + esc(e.title) + '</div>' + (halal || delta ? '<div class="m-row">' + halal + delta + '</div>' : "") + '</div>' +

      ((e.links && e.links.length) || e.imageSource ? '<div class="tv-links">' + (e.links || []).map((x) => '<a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.label) + '</a>').join("") + (e.imageSource ? '<a href="' + esc(e.imageSource) + '" target="_blank" rel="noopener">Photo source</a>' : "") + '</div>' : "") +
      '<div class="cv-ask"><span>' + esc(ask) + '</span><button type="button" class="cv-copy" data-copy="' + esc(e.id) + '" title="Copy the id to paste into Claude Code">' + esc(e.id) + '</button></div>' +

  function consideredView(r) {

  const smooth = () => matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
  function scrollToId(id, flash) {

  document.addEventListener("click", (e) => {

    const a = e.target.closest('a[href^="#"]');
    if (a) {
      const href = decodeURIComponent(a.getAttribute("href").slice(1)); let m;
      if ((m = /^r-(\d{4}-\d{2}-\d{2})-\d+$/.exec(href))) { e.preventDefault(); go("day/" + m[1], href); return; }
      if (/^stay-/.test(href)) { e.preventDefault(); go("hotels", href); return; }
      if (/^(pick|mday|city|day)-/.test(href)) { e.preventDefault(); scrollToId(href, true); return; }
      if (CITY_ORDER.includes(href) && route().view === "days") { e.preventDefault(); history.replaceState(null, "", "#" + href); scrollToId("city-" + href); return; }
      if (!href) { e.preventDefault(); return; }

    }

    const mf = e.target.closest(".ml-f");
    if (mf && mf.dataset.sf) { stomachFilter = mf.dataset.sf; try { localStorage.setItem("stomachFilter", stomachFilter); } catch (_) {} render(); return; }
    if (mf) { mealFilter = mf.dataset.mf; try { localStorage.setItem("mealFilter", mealFilter); } catch (_) {} render(); return; }
    const cp = e.target.closest(".cv-copy");

      try { navigator.clipboard.writeText(id).then(done, () => {}); } catch (_) {} const rg = document.createRange(); rg.selectNodeContents(cp); const sl = getSelection(); sl.removeAllRanges(); sl.addRange(rg); return; }

  window.addEventListener("hashchange", () => render());
  document.addEventListener("toggle", (e) => {
    const d = e.target; if (!(d instanceof HTMLDetailsElement) || !d.dataset.key) return;
    if (d.open) { openSet.add(d.dataset.key); closedSet.delete(d.dataset.key); } else { openSet.delete(d.dataset.key); closedSet.add(d.dataset.key); }
  }, true);
  async function saveChoice(id, value) {
    state.choices.set(id, value); render();
    if (state.db && state.canWrite !== false) {
      try { await state.db.doc("choices/" + id).set({ optionId: value, updatedAt: new Date().toISOString() }); }
      catch (err) { if (err && err.code === "invalid_argument") { state.canWrite = false; render(); } }
    }
  }
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (!(t instanceof HTMLInputElement)) return;
    if (t.type === "checkbox" && t.dataset.todo) { saveChoice("todo-" + t.dataset.todo, t.checked ? "done" : "open"); return; }
    if (t.type !== "radio" || !t.name.startsWith("pick-")) return;
    const id = t.name.slice(5), value = t.value;
    if (state.choices.get(id) === value) return;
    saveChoice(id, value);
  });

  function showState(msg) { if (state.activities.size || state.days.size) return; $("main").innerHTML = '<div class="state">' + esc(msg) + '</div>'; }

  async function start() {
    if (!window.claude || typeof window.claude.use !== "function") { showState("Open this page on claude.ai to see the trip plan."); return; }
    const db = await window.claude.use("db");
    if (!db) { showState("Sign in to claude.ai to see the trip plan."); return; }
    state.db = db;
    try { const user = await window.claude.use("user"); if (user && typeof user.can === "function") { const can = await user.can("data.write"); state.canWrite = can === null ? null : !!can; } } catch (_) {}
    const timer = setTimeout(() => { if (!state.got) showState("The trip data can't be reached yet. It will appear once the connection returns."); }, 10000);
    const fail = (err) => { clearTimeout(timer); showState("The trip data couldn't be loaded (" + (err && err.code) + ")."); };
    db.collection("activities").onSnapshot((snap) => {
      state.activities.clear(); snap.docs.forEach((d) => { const v = d.data(); if (v) state.activities.set(d.id, Object.assign({ id: d.id }, v)); });
      if (!snap.metadata.fromCache) { state.got = true; clearTimeout(timer); }
      render();
    }, fail);
    db.collection("days").onSnapshot((snap) => {
      state.days.clear(); snap.docs.forEach((d) => { const v = d.data(); if (v) state.days.set(d.id, Object.assign({ id: d.id }, v)); });
      if (!snap.metadata.fromCache && !state.days.size && !state.activities.size) showState("No days yet. Ask Claude to add the trip plan.");
      render();
    }, fail);
    db.doc("meta/trip").onSnapshot((snap) => { state.meta = snap.exists ? snap.data() : null; render(); }, () => {});
    db.doc("meta/travel").onSnapshot((snap) => { state.travel = snap.exists ? snap.data() : null; render(); }, () => {});
    db.doc("meta/localfood").onSnapshot((snap) => { state.localfood = snap.exists ? snap.data() : null; render(); }, () => {});
    db.doc("meta/todo").onSnapshot((snap) => { state.todo = snap.exists ? snap.data() : null; render(); }, () => {});
    db.collection("considered").onSnapshot((snap) => {
      state.considered.clear(); snap.docs.forEach((d) => { const v = d.data(); if (v) state.considered.set(d.id, Object.assign({ id: d.id }, v)); }); render();
    }, () => {});
    db.collection("choices").onSnapshot((snap) => {
      state.choices.clear(); snap.docs.forEach((d) => { const v = d.data(); if (v && v.optionId) state.choices.set(d.id, v.optionId); }); render();
    }, () => {});
  }
  start();
})();
</script>

<script>
(() => {
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (standalone) return;
  const KEY = 'trip-install-later';
  try { if (Date.now() < +localStorage.getItem(KEY)) return; } catch (_) {}
  const box = document.getElementById('inst'), t = document.getElementById('inst-t'), go = document.getElementById('inst-go');
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const shareIcon = '<svg class="share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
  let deferred = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault(); deferred = e;
    t.innerHTML = '<b>Install China trip</b><span>Opens from your home screen and works offline.</span>';
    go.hidden = false; box.classList.add('on');
  });
  go.addEventListener('click', async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice.catch(() => {}); deferred = null; box.classList.remove('on'); });
  window.addEventListener('appinstalled', () => box.classList.remove('on'));
  document.getElementById('inst-no').addEventListener('click', () => {
    box.classList.remove('on'); try { localStorage.setItem(KEY, String(Date.now() + 3 * 864e5)); } catch (_) {}
  });
  if (ios) {
    t.innerHTML = '<b>Add China trip to your home screen</b><span>Tap Share ' + shareIcon + ' (or <b style="display:inline">&middot;&middot;&middot;</b> then Share), then <b style="display:inline">Add to Home Screen</b>.</span>';
    box.classList.add('on');
  }
})();
