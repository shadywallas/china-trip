<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Holiday Questionnaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Questionnaire for the shutdown trip: Hong Kong or Shanghai. Same look as the trip pages (Inter, grey page, white cards).
   English and Arabic (?lang=ar, right to left). Questions never name a place; each answer adds points to hk and/or sh (times the
   question weight). Cost is left out on purpose. Questions marked "required" have no Skip button and a red frame.
   More than MAX_SKIP skipped questions: no winner is announced. */
:root {
  --bg: #f4f5f7; --surface: #ffffff; --sunken: #fafafa; --ink: #111827; --ink-2: #374151; --muted: #4b5563; --subtle: #9ca3af;
  --line: #e5e7eb; --accent: #1d4ed8; --accent-press: #1e3a8a; --select: #2563eb; --select-bg: #eff6ff;
  --hk: #2563eb; --sh: #7c3aed; --hk-bg: #dbeafe; --sh-bg: #ede9fe; --ok: #166534;
  --req: #b91c1c; --req-bg: #fee2e2; --warn-bg: #fef3c7; --warn: #92400e;
  --shadow: 0 1px 3px rgba(17, 24, 39, .06); --focus-ring: 0 0 0 3px rgba(37, 99, 235, .4);
  --font: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --surface: #181b21; --sunken: #1e2128; --ink: #f3f4f6; --ink-2: #d1d5db; --muted: #9ca3af; --subtle: #6b7280; --line: #2b303a;
    --accent: #8fb4ff; --accent-press: #b9cfff; --select: #6b9cff; --select-bg: #1b2740;
    --hk: #6b9cff; --sh: #a98bfa; --hk-bg: #1b2740; --sh-bg: #2a2147; --ok: #6ee7a0;
    --req: #fca5a5; --req-bg: #3b1717; --warn-bg: #3a2a10; --warn: #fcd34d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --surface: #181b21; --sunken: #1e2128; --ink: #f3f4f6; --ink-2: #d1d5db; --muted: #9ca3af; --subtle: #6b7280; --line: #2b303a;
  --accent: #8fb4ff; --accent-press: #b9cfff; --select: #6b9cff; --select-bg: #1b2740;
  --hk: #6b9cff; --sh: #a98bfa; --hk-bg: #1b2740; --sh-bg: #2a2147; --ok: #6ee7a0;
  --req: #fca5a5; --req-bg: #3b1717; --warn-bg: #3a2a10; --warn: #fcd34d; color-scheme: dark;
}
:root[lang="ar"] { --font: "Noto Sans Arabic", Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); min-height: 100vh; min-height: 100dvh; }
:root[lang="ar"] body { font-size: 17px; line-height: 1.7; }
:root[dir="rtl"] * { letter-spacing: 0 !important; }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px calc(32px + env(safe-area-inset-bottom)); }
.top { display: flex; align-items: center; gap: 12px; min-height: 44px; margin-bottom: 8px; }
.top .back { width: 44px; height: 44px; border: 0; background: none; border-radius: 12px; cursor: pointer; display: grid; place-items: center; color: var(--ink-2); flex: none; }
:root[dir="rtl"] .top .back svg { transform: scaleX(-1); }
.top[hidden], .top .back[hidden] { display: none; }
.top .count { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.lang { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; min-height: 36px; padding: 4px 12px; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--ink-2); flex: none; }
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; flex: 1; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; }
.card.req { border: 2px solid var(--req); }
.reqtag { display: inline-flex; align-items: center; gap: 6px; background: var(--req-bg); color: var(--req); font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 99px; margin: 0 0 10px; }
h1 { font-size: 26px; line-height: 1.25; margin: 4px 0 8px; letter-spacing: -.01em; }
h2 { font-size: 21px; line-height: 1.35; margin: 0 0 6px; letter-spacing: -.01em; }
.kind { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 6px; }
:root[lang="ar"] .kind { text-transform: none; font-size: 14px; }
.sub { color: var(--muted); margin: 0 0 16px; font-size: 15px; }
.opts { display: grid; gap: 10px; }
.opt { display: block; width: 100%; text-align: start; padding: 14px 16px; min-height: 56px; border: 1.5px solid var(--line); border-radius: 14px;
  background: var(--sunken); cursor: pointer; transition: border-color .15s, background .15s; }
.opt[aria-pressed="true"] { border-color: var(--select); background: var(--select-bg); }
.opt b { display: block; font-weight: 600; }
.opt span { display: block; font-size: 14px; color: var(--muted); margin-top: 2px; }
.opt.sit { padding: 16px 18px; }
.opt.sit b { font-weight: 500; line-height: 1.5; }
.skip { display: block; width: 100%; margin-top: 12px; min-height: 48px; border: 1.5px dashed var(--line); border-radius: 14px; background: none; color: var(--muted); font-weight: 500; cursor: pointer; }
.skip[aria-pressed="true"] { border-color: var(--subtle); color: var(--ink-2); }
.pics { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 520px) { .pics { grid-template-columns: 1fr 1fr; } }
.pic { position: relative; padding: 0; border: 3px solid transparent; border-radius: 16px; overflow: hidden; cursor: pointer; background: var(--line); aspect-ratio: 4 / 3; }
.pic img { display: block; width: 100%; height: 100%; object-fit: cover; }
.pic[aria-pressed="true"] { border-color: var(--select); }
.pic .tag { position: absolute; inset-inline-start: 10px; top: 10px; width: 30px; height: 30px; border-radius: 99px; background: rgba(17, 24, 39, .65); color: #fff; font-weight: 600; font-size: 14px; display: grid; place-items: center; }
.pic[aria-pressed="true"] .tag { background: var(--select); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 12px 20px; border-radius: 12px; border: 0; cursor: pointer;
  background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; }
:root[data-theme="dark"] .btn { color: #0f1115; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn { color: #0f1115; } }
.btn.ghost { background: none; color: var(--ink-2); border: 1px solid var(--line); }
.btn.wa { background: #16a34a; color: #fff; }
@media (hover: hover) {
  .top .back:hover { background: var(--surface); }
  .opt:hover { border-color: var(--subtle); }
  .skip:hover { border-color: var(--subtle); color: var(--ink-2); }
  .btn:hover { background: var(--accent-press); }
  .btn.ghost:hover { background: var(--surface); }
  .btn.wa:hover { background: #15803d; }
}
.row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.intro .lrow { display: flex; justify-content: flex-end; align-items: center; gap: 10px; flex-wrap: wrap; margin: -4px 0 4px; }
.gsel { display: flex; align-items: center; gap: 6px; margin-inline-end: auto; font-size: 14px; color: var(--muted); }
.gsel button { border: 1px solid var(--line); background: var(--sunken); border-radius: 10px; min-height: 36px; padding: 4px 12px; font-size: 14px; cursor: pointer; color: var(--ink-2); }
.gsel button[aria-pressed="true"] { border-color: var(--select); background: var(--select-bg); color: var(--select); font-weight: 600; }
.conf { display: inline-block; margin: 2px 0 8px; padding: 3px 12px; border-radius: 99px; font-size: 14px; font-weight: 600; }
.conf.clear { background: #dcfce7; color: #166534; } .conf.lean { background: var(--select-bg); color: var(--select); } .conf.close { background: var(--warn-bg); color: var(--warn); }
:root[data-theme="dark"] .conf.clear { background: #12301f; color: #86efac; }
.intro p { margin: 0 0 12px; color: var(--ink-2); }
.intro ul { margin: 0 0 16px; padding-inline-start: 20px; color: var(--ink-2); }
.intro li { margin-bottom: 4px; }
.intro li.r { color: var(--req); font-weight: 500; }
/* Result */
.win { text-align: center; padding: 24px 20px; }
.win .eyebrow { font-size: 14px; color: var(--muted); margin: 0; }
.win h1 { font-size: 34px; margin: 4px 0 4px; }
.win .line { color: var(--ink-2); margin: 0; }
.win.none h1 { font-size: 28px; }
.scores { display: grid; gap: 12px; margin-top: 20px; text-align: start; }
.score { display: grid; grid-template-columns: 96px 1fr 44px; align-items: center; gap: 10px; font-weight: 600; }
.score .track { height: 12px; background: var(--line); border-radius: 99px; overflow: hidden; }
.score .track i { display: block; height: 100%; border-radius: 99px; width: 0; transition: width .6s ease; }
.score.hk i { background: var(--hk); } .score.sh i { background: var(--sh); }
.score .n { text-align: end; font-variant-numeric: tabular-nums; }
.skipnote { margin: 14px 0 0; font-size: 14px; color: var(--muted); }
.sec { margin-top: 16px; }
.sec h2 { font-size: 18px; margin-bottom: 10px; }
.why { display: grid; gap: 10px; }
.why .w { padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--sunken); }
.why .w b { display: block; font-weight: 600; font-size: 15px; }
.why .w p { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; margin-inline-end: 6px; vertical-align: 1px; }
.pill.hk { background: var(--hk-bg); color: var(--hk); } .pill.sh { background: var(--sh-bg); color: var(--sh); } .pill.even { background: var(--line); color: var(--ink-2); }
.pill.skip-p { background: var(--warn-bg); color: var(--warn); }
.revs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rev { margin: 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--sunken); position: relative; }
.rev img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.rev figcaption { padding: 8px 10px; font-size: 13px; color: var(--ink-2); line-height: 1.4; }
.rev.chosen { border-color: var(--select); box-shadow: 0 0 0 2px var(--select); }
.rev .mine { position: absolute; top: 8px; inset-inline-start: 8px; background: var(--select); color: #fff; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; }
.credits { font-size: 12px; color: var(--muted); margin-top: 16px; }
.credits a { color: var(--muted); }
.fade { animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fade { animation: none; } .bar i, .score .track i { transition: none; } }
</style>
</head><body>
<div class="wrap">
  <div class="top" id="top" hidden>
    <button class="back" id="back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    <span class="count" id="count"></span>
    <button class="lang" id="lang2"></button>
  </div>
  <main id="main"></main>
</div>
<script>
(() => {
  // Theme: the trip pages remember Light/Dark per browser under "tripTheme"; light by default.
  try { const t = localStorage.getItem("tripTheme"); document.documentElement.dataset.theme = t === "dark" ? "dark" : "light"; } catch (_) { document.documentElement.dataset.theme = "light"; }

  // Each question: kind (text | situation | photo), q, w (weight), required, ar {q}, opts [{t, d?, img?, hk, sh, why, cap?, ar {t, d, why, cap}}]
  const QUESTIONS = [{"id":"weather","kind":"text","w":2,"q":"Your ideal holiday weather is…","opts":[{"t":"Mild and sunny","d":"A light jacket in the evening is enough.","hk":3,"sh":0,"why":"Hong Kong is about 19°C by day and 14°C at night over these dates, with about 8 hours of sun.","ar":{"why":"حرارة هونغ كونغ في هذه الأيام حوالي 19 درجة نهارًا و14 ليلًا، مع حوالي 8 ساعات من الشمس يوميًا.","t":"معتدل ومشمس","d":"يكفي جاكيت خفيف في المساء."}},{"t":"Proper winter","d":"Coat, scarf, gloves and hot drinks.","hk":0,"sh":3,"why":"Shanghai is about 10°C by day and 2°C at night: a crisp, damp winter cold.","ar":{"why":"حرارة شنغهاي حوالي 10 درجات نهارًا ودرجتان ليلًا: برد شتوي قارس ورطب.","t":"شتاء حقيقي","d":"معطف وكوفية وقفازات ومشروبات ساخنة."}},{"t":"I do not mind, as long as it is dry","hk":1,"sh":1,"why":"Both cities are mostly dry at this time of year.","ar":{"why":"المدينتان جافتان غالبًا في هذا الوقت من السنة.","t":"لا يهمني، طالما أن الجو غير ممطر"}}],"ar":{"q":"طقس الإجازة المثالي {بالنسبة لكِ|بالنسبة لك}…"},"required":true,"theme":"weather"},{"id":"walk-photo","kind":"photo","w":1,"q":"A free morning. Which walk?","opts":[{"img":"hk-trail","hk":3,"sh":0,"cap":"A ridge trail above the sea, Hong Kong","why":"About 40% of Hong Kong is country park, and late December is its hiking season.","ar":{"why":"حوالي 40% من مساحة هونغ كونغ محميات طبيعية، وأواخر ديسمبر هو موسم المشي في الجبال.","cap":"ممر على قمة تل فوق البحر، هونغ كونغ"}},{"img":"sh-street","hk":0,"sh":3,"cap":"A quiet plane-tree street with old villas, Shanghai","why":"Shanghai's old French Concession is made of flat, leafy streets with villas and cafés.","ar":{"why":"الحي الفرنسي القديم في شنغهاي شوارع مستوية تظللها الأشجار، فيها فيلات ومقاهٍ.","cap":"شارع هادئ تظلله الأشجار وفيه فيلات قديمة، شنغهاي"}}],"ar":{"q":"صباح يوم حر. أي نزهة {تختارين|تختار}؟"},"theme":"nature"},{"id":"recharge","kind":"text","w":1,"q":"After a long day out, what recharges you most?","ar":{"q":"بعد يوم طويل في الخارج، ما الذي {يريحكِ|يريحك} أكثر؟"},"opts":[{"t":"Fresh air","d":"A walk by the water, or a short ferry ride at sunset.","hk":2,"sh":0,"why":"Hong Kong puts the sea, ferries and waterfront paths a few minutes from almost everywhere.","ar":{"t":"هواء نقي","why":"في هونغ كونغ البحر والعبّارات والممشى على الواجهة المائية على بعد دقائق من كل مكان تقريبًا.","d":"مشي بجانب الماء، أو رحلة قصيرة بالعبّارة وقت الغروب."}},{"t":"A cosy café","d":"Something warm to drink, watching people on a quiet, pretty street.","hk":0,"sh":2,"why":"Shanghai's old French Concession is full of cafés on quiet, tree-lined streets.","ar":{"t":"مقهى دافئ","why":"الحي الفرنسي القديم في شنغهاي مليء بالمقاهي في شوارع هادئة تظللها الأشجار.","d":"مشروب ساخن ومشاهدة الناس في شارع هادئ وجميل."}}]},{"id":"walking","kind":"text","w":2,"q":"On a free day, the walking you enjoy most is…","opts":[{"t":"Up and down","d":"Hills, stairs, and a trail with a view at the top.","hk":3,"sh":0,"why":"Hong Kong is steep: stairs, hill trails, and an 800 m outdoor escalator up the hillside.","ar":{"why":"هونغ كونغ مدينة منحدرة: سلالم وممرات جبلية وسلم متحرك مكشوف بطول 800 متر على سفح التل.","t":"صعود ونزول","d":"تلال وسلالم، وممر جبلي ينتهي بمنظر جميل."}},{"t":"Flat and easy","d":"Long, leafy streets and riverside promenades.","hk":0,"sh":3,"why":"Shanghai is completely flat (its average height is 4 m), so walks have no climbs.","ar":{"why":"شنغهاي مستوية تمامًا (متوسط ارتفاعها 4 أمتار)، فلا صعود في المشي.","t":"مستوٍ وسهل","d":"شوارع طويلة تظللها الأشجار وممشى على النهر."}}],"ar":{"q":"في يوم حر، أكثر نوع مشي {تستمتعين|تستمتع} به…"},"required":true},{"id":"sit-photo","kind":"photo","w":1,"q":"Where would you sit for an hour?","opts":[{"img":"hk-beach","hk":3,"sh":0,"cap":"A sandy bay with green hills, Hong Kong","why":"Hong Kong has beaches and islands within half an hour of the centre, warm enough to sit on in December.","ar":{"why":"في هونغ كونغ شواطئ وجزر على بعد نصف ساعة من وسط المدينة، والجو دافئ بما يكفي للجلوس عليها في ديسمبر.","cap":"خليج رملي تحيط به تلال خضراء، هونغ كونغ"}},{"img":"sh-lake","hk":0,"sh":3,"cap":"West Lake in Hangzhou, a day trip from Shanghai","why":"West Lake, with its willows, causeways and pagodas, is about 45 minutes from Shanghai by fast train.","ar":{"why":"بحيرة الغرب بأشجار الصفصاف والجسور والمعابد على بعد حوالي 45 دقيقة من شنغهاي بالقطار السريع.","cap":"بحيرة الغرب في هانغتشو، رحلة يوم من شنغهاي"}}],"ar":{"q":"أين {تحبين أن تجلسي|تحب أن تجلس} لمدة ساعة؟"},"theme":"nature"},{"id":"downside","kind":"text","w":3,"required":true,"q":"Every trip has a downside. Which one could you live with more easily?","ar":{"q":"لكل رحلة عيب. أي عيب {تتحملين|تتحمل} بسهولة أكبر؟"},"opts":[{"t":"Crowded streets, hills and lots of stairs, every day","hk":3,"sh":0,"why":"That is Hong Kong's real downside: it is one of the densest and steepest cities in the world.","ar":{"t":"شوارع مزدحمة وتلال وسلالم كثيرة كل يوم","why":"هذا هو العيب الحقيقي لهونغ كونغ: من أكثر مدن العالم ازدحامًا وانحدارًا."}},{"t":"Cold, damp days of 2–10°C, dark by 5 pm","hk":0,"sh":3,"why":"That is Shanghai's real downside in late December: about 10°C by day, 2°C at night, and sunset just before 5 pm.","ar":{"t":"أيام باردة ورطبة بين 2 و10 درجات، والظلام قبل الخامسة مساءً","why":"هذا هو العيب الحقيقي لشنغهاي في أواخر ديسمبر: حوالي 10 درجات نهارًا و2 ليلًا، والغروب قبل الخامسة بقليل."}}]},{"id":"nye","kind":"situation","w":2,"q":"It is 11:50 pm on 31 December. Which New Year's Eve sounds better?","opts":[{"t":"Standing by the water with a huge, excited crowd, waiting for big fireworks to burst over the harbour.","hk":3,"sh":0,"why":"Hong Kong's harbour fireworks return this year, announced as bigger than before, and draw hundreds of thousands of people.","ar":{"why":"تعود الألعاب النارية فوق ميناء هونغ كونغ هذا العام، وأُعلن أنها ستكون أكبر من قبل، ويحضرها مئات الآلاف.","t":"نقف على الواجهة المائية وسط حشد كبير ومتحمس، ننتظر ألعابًا نارية ضخمة فوق الميناء."}},{"t":"A nice warm dinner, then a calm walk to see the city lights. Fireworks do not matter to me.","hk":1,"sh":2,"why":"Shanghai has had no official fireworks since 2016; its New Year's Eve is lights and river views.","ar":{"why":"لا توجد ألعاب نارية رسمية في شنغهاي منذ 2016؛ ليلة رأس السنة هناك أضواء ومناظر على النهر.","t":"عشاء دافئ لطيف، ثم نزهة هادئة لرؤية أضواء المدينة. الألعاب النارية لا تهمني."}}],"ar":{"q":"الساعة 11:50 مساء يوم 31 ديسمبر. أي ليلة رأس سنة تبدو أجمل؟"},"required":true,"theme":"nye"},{"id":"crowds","kind":"text","w":1,"q":"Packed streets with neon signs and noise make you feel…","opts":[{"t":"Excited","d":"I love the buzz.","hk":3,"sh":0,"why":"Parts of Hong Kong, such as Mong Kok, are among the densest places on earth, full of neon and night markets.","ar":{"why":"بعض مناطق هونغ كونغ، مثل مونغ كوك، من أكثر الأماكن ازدحامًا في العالم، مليئة بالنيون وأسواق الليل.","t":"بالحماس","d":"أحب هذه الحيوية."}},{"t":"Fine for an evening, not every day","hk":1,"sh":1,"why":"Both cities have busy areas and calmer ones.","ar":{"why":"في المدينتين مناطق مزدحمة وأخرى هادئة.","t":"لا بأس لسهرة واحدة، لكن ليس كل يوم"}},{"t":"Tired","d":"I like space to breathe.","hk":0,"sh":3,"why":"Shanghai has wide avenues and long riverside promenades (its sights do get busy on 1–3 Jan, a mainland holiday).","ar":{"why":"في شنغهاي شوارع واسعة وممشى طويل على النهر (لكن المعالم تزدحم من 1 إلى 3 يناير، وهي عطلة رسمية في الصين).","t":"بالتعب","d":"أحب المساحات الواسعة."}}],"ar":{"q":"الشوارع المزدحمة بلافتات النيون والضوضاء {تجعلكِ تشعرين|تجعلك تشعر}…"}},{"id":"evening-photo","kind":"photo","w":1,"q":"Which evening would you step into?","opts":[{"img":"hk-neon","hk":3,"sh":0,"cap":"A neon street at night, Hong Kong","why":"Hong Kong's night streets and markets, such as Mong Kok and Temple Street, are dense and lively.","ar":{"why":"شوارع هونغ كونغ وأسواقها الليلية، مثل مونغ كوك وشارع تمبل، مزدحمة ومليئة بالحياة.","cap":"شارع نيون ليلًا، هونغ كونغ"}},{"img":"sh-boulevard","hk":0,"sh":3,"cap":"A wide shopping street at night, Shanghai","why":"Shanghai's Nanjing Road is a wide, lit pedestrian avenue of big stores.","ar":{"why":"شارع نانجينغ في شنغهاي ممشى واسع مضاء تحيط به المتاجر الكبرى.","cap":"شارع تسوق واسع ليلًا، شنغهاي"}}],"ar":{"q":"أي سهرة {تحبين أن تخرجي|تحب أن تخرج} إليها؟"}},{"id":"happiest","kind":"text","w":2,"theme":"ease","q":"On a trip, when do you feel happiest?","ar":{"q":"متى {تشعرين|تشعر} بأكبر سعادة في السفر؟"},"opts":[{"t":"When everything is easy","d":"I find my way, people understand me, and nothing goes wrong.","hk":3,"sh":0,"why":"English is an official language in Hong Kong, signs are bilingual, and everything works as at home.","ar":{"t":"عندما يكون كل شيء سهلًا","why":"الإنجليزية لغة رسمية في هونغ كونغ، واللافتات بلغتين، وكل شيء يعمل كما في البيت.","d":"أعرف طريقي، والناس يفهمونني، ولا شيء يسوء."}},{"t":"When I am a little lost in a different world","d":"Working things out is part of the fun.","hk":0,"sh":3,"why":"In Shanghai, menus, apps and taxi drivers are mostly Chinese: a real adventure, with metro signs in English.","ar":{"t":"عندما {أكون تائهة|أكون تائهًا} قليلًا في عالم مختلف","why":"في شنغهاي قوائم الطعام والتطبيقات وسائقو التاكسي بالصينية غالبًا: مغامرة حقيقية، مع لافتات مترو بالإنجليزية.","d":"اكتشاف الطريق جزء من المتعة."}}]},{"id":"daytrip","kind":"situation","w":1,"q":"A day trip out of the city. Which day sounds better?","opts":[{"t":"An hour on a ferry to a little old town with pastel Portuguese squares, wavy cobblestones and egg tarts, then glittering casino resorts at night.","hk":3,"sh":0,"why":"That is Macau, an hour by ferry from Hong Kong, with no visa needed.","ar":{"why":"هذه ماكاو، على بعد ساعة بالعبّارة من هونغ كونغ، ولا تحتاج إلى تأشيرة.","t":"ساعة بالعبّارة إلى بلدة قديمة صغيرة فيها ساحات برتغالية بألوان فاتحة وأرضيات مموجة وفطائر البيض، ثم منتجعات متلألئة في المساء."}},{"t":"A fast train to a calm lake with willow-lined causeways, pagodas and tea hills, maybe a little misty.","hk":0,"sh":3,"why":"That is Hangzhou's West Lake, about 45 minutes from Shanghai by fast train.","ar":{"why":"هذه بحيرة الغرب في هانغتشو، على بعد حوالي 45 دقيقة من شنغهاي بالقطار السريع.","t":"قطار سريع إلى بحيرة هادئة فيها جسور تحفها أشجار الصفصاف ومعابد وتلال الشاي، وربما بعض الضباب."}}],"ar":{"q":"رحلة يوم خارج المدينة. أي يوم يبدو أجمل؟"},"theme":"culture"},{"id":"explore-photo","kind":"photo","w":1,"q":"Which place would you explore?","opts":[{"img":"hk-macau","hk":3,"sh":0,"cap":"A Portuguese-style square in Macau, a day trip from Hong Kong","why":"Macau's old centre is a UNESCO-listed mix of Portuguese squares, churches and Chinese streets.","ar":{"why":"وسط ماكاو القديم مسجل في اليونسكو، ويمزج الساحات البرتغالية والكنائس والشوارع الصينية.","cap":"ساحة على الطراز البرتغالي في ماكاو، رحلة يوم من هونغ كونغ"}},{"img":"sh-garden","hk":0,"sh":3,"cap":"A classical Chinese garden, Shanghai","why":"Shanghai has classical gardens with ponds, rockeries and curved roofs, such as Yu Garden.","ar":{"why":"في شنغهاي حدائق تقليدية فيها برك وصخور وأسقف منحنية، مثل حديقة يويوان.","cap":"حديقة صينية تقليدية، شنغهاي"}}],"ar":{"q":"أي مكان {تحبين أن تستكشفي|تحب أن تستكشف}؟"},"theme":"culture"},{"id":"cold","kind":"text","w":2,"required":true,"theme":"weather","q":"When you are outside in the cold for a few hours…","ar":{"q":"عندما {تكونين|تكون} في البرد خارج البيت لبضع ساعات…"},"opts":[{"t":"I stop enjoying anything","d":"I just want to get warm.","hk":3,"sh":0,"why":"Hong Kong is about 19°C by day and 14°C at night, so you will rarely feel cold.","ar":{"t":"لا أستمتع بأي شيء","why":"حرارة هونغ كونغ حوالي 19 درجة نهارًا و14 ليلًا، فنادرًا ما {ستشعرين|ستشعر} بالبرد.","d":"كل ما أريده هو أن أتدفأ."}},{"t":"I am fine if I am dressed well","hk":1,"sh":1,"why":"Either city works for you, with a good coat in Shanghai.","ar":{"t":"لا مشكلة إذا كانت ملابسي مناسبة","why":"المدينتان {مناسبتان لكِ|مناسبتان لك}، مع معطف جيد في شنغهاي."}},{"t":"I love it","d":"Cold air wakes me up.","hk":0,"sh":3,"why":"Shanghai's late-December cold (about 10°C by day and 2°C at night) is part of its winter charm.","ar":{"t":"أحبه","why":"برد شنغهاي في أواخر ديسمبر (حوالي 10 درجات نهارًا ودرجتان ليلًا) جزء من سحرها الشتوي.","d":"الهواء البارد ينعشني."}}]},{"id":"view-photo","kind":"photo","w":1,"q":"Which view would you travel for?","opts":[{"img":"hk-buddha","hk":3,"sh":0,"cap":"A giant Buddha on a green mountain, Hong Kong","why":"A 5.7 km cable car over the sea and hills leads to the Big Buddha on Lantau Island.","ar":{"why":"تلفريك بطول 5.7 كم فوق البحر والتلال يوصل إلى تمثال بوذا الكبير في جزيرة لانتاو.","cap":"تمثال بوذا ضخم على جبل أخضر، هونغ كونغ"}},{"img":"sh-skyline","hk":0,"sh":3,"cap":"The skyscrapers across the river, Shanghai","why":"Shanghai's riverfront faces one of the tallest skylines in the world; the Shanghai Tower deck is at 546 m.","ar":{"why":"تطل ضفة النهر في شنغهاي على واحد من أعلى خطوط الأفق في العالم؛ منصة برج شنغهاي على ارتفاع 546 مترًا.","cap":"ناطحات السحاب على الضفة الأخرى من النهر، شنغهاي"}}],"ar":{"q":"أي منظر يستحق السفر من أجله؟"},"theme":"nature"},{"id":"annoy","kind":"text","w":2,"required":true,"theme":"ease","q":"Which would annoy you more on holiday?","ar":{"q":"أي الأمرين {سيضايقكِ|سيضايقك} أكثر في الإجازة؟"},"opts":[{"t":"My usual apps not working","d":"WhatsApp, Instagram and Google blocked unless I set up a special SIM, and paying with Chinese apps.","hk":3,"sh":0,"why":"In Shanghai, WhatsApp, Instagram and Google are blocked, and most payments go through Alipay or WeChat Pay. In Hong Kong, everything works as at home.","ar":{"t":"تطبيقاتي المعتادة لا تعمل","why":"في شنغهاي واتساب وإنستغرام وجوجل محجوبة، ومعظم الدفع عبر Alipay أو WeChat Pay. في هونغ كونغ كل شيء يعمل كما في البيت.","d":"واتساب وإنستغرام وجوجل محجوبة إلا بشريحة خاصة، والدفع بتطبيقات صينية."}},{"t":"Not feeling far from home","d":"English signs, international malls and brands everywhere.","hk":0,"sh":3,"why":"Hong Kong is very international; Shanghai feels much more like mainland China.","ar":{"t":"ألا أشعر أنني {بعيدة|بعيد} عن البيت","why":"هونغ كونغ مدينة عالمية جدًا؛ أما شنغهاي {فتشعركِ|فتشعرك} أكثر {بأنكِ|بأنك} في الصين.","d":"لافتات بالإنجليزية ومولات وماركات عالمية في كل مكان."}}]},{"id":"feel","kind":"text","w":1,"q":"Which feels more like a holiday to you?","opts":[{"t":"A mix of East and West","d":"English everywhere, and things feel a little familiar.","hk":3,"sh":0,"why":"English is an official language in Hong Kong, a mix of British and Chinese; Macau adds Portuguese.","ar":{"why":"الإنجليزية لغة رسمية في هونغ كونغ، وهي مزيج بريطاني صيني؛ وماكاو تضيف لمسة برتغالية.","t":"مزيج من الشرق والغرب","d":"الإنجليزية في كل مكان، والأشياء مألوفة قليلًا."}},{"t":"Somewhere completely different","d":"I want to feel that I am really in China.","hk":0,"sh":3,"why":"Shanghai feels like mainland China: Chinese menus, Chinese apps, old lanes and gardens.","ar":{"why":"شنغهاي تشبه الصين الحقيقية: قوائم طعام صينية وتطبيقات صينية وحارات وحدائق قديمة.","t":"مكان مختلف تمامًا","d":"أريد أن أشعر أنني في الصين فعلًا."}}],"ar":{"q":"أي من هذين {يشعركِ|يشعرك} أكثر {بأنكِ|بأنك} في إجازة؟"},"theme":"culture"},{"id":"afternoon-photo","kind":"photo","w":1,"q":"Which afternoon?","opts":[{"img":"hk-peak","hk":3,"sh":0,"cap":"The view down over the harbour at dusk, Hong Kong","why":"From Victoria Peak you look down on the towers, the harbour and the hills around them.","ar":{"why":"من قمة فيكتوريا ترين الأبراج والميناء والتلال حولها.","cap":"منظر الميناء من أعلى الجبل عند الغروب، هونغ كونغ"}},{"img":"sh-lane","hk":0,"sh":3,"cap":"An old stone-gate lane with cafés and small shops, Shanghai","why":"Shanghai's old lane houses, such as Tianzifang and Xintiandi, are full of cafés and small shops.","ar":{"why":"حارات شنغهاي القديمة، مثل تيانزيفانغ وشينتياندي، مليئة بالمقاهي والمحلات الصغيرة.","cap":"حارة قديمة ببوابات حجرية فيها مقاهٍ ومحلات صغيرة، شنغهاي"}}],"ar":{"q":"أي عصرية {تختارين|تختار}؟"},"theme":"culture"},{"id":"variety","kind":"text","w":1,"q":"Your ideal 8 days are…","ar":{"q":"الأيام الثمانية     main.innerHTML = '<section class="card intro fade"><div class="lrow">' + gsel + '<button class="lang" id="lang1">' + esc(L.other) + '</button></div>' +
      '<p class="kind">' + esc(L.introKind(N)) + '</p><h1>' + esc(L.introH) + '</h1><p>' + esc(L.introP) + '</p>' +
      '<ul>' + L.introL.map((t, k) => '<li' + (k === 2 ? ' class="r"' : "") + '>' + esc(t) + '</li>').join("") + '</ul>' +
      '<div class="row"><button class="btn" id="go">' + esc(done ? L.cont : L.start) + '</button>' + (done ? '<button class="btn ghost" id="restart">' + esc(L.again) + '</button>' : "") + '</div></section>';
    $("lang1").addEventListener("click", () => setLang(lang === "ar" ? "en" : "ar"));
    main.querySelectorAll("[data-g]").forEach((b) => b.addEventListener("click", () => setGender(b.dataset.g)));
    $("go").addEventListener("click", () => { st.i = done ? Math.min(done, N) : 0; save(); render(); });
    if (done) $("restart").addEventListener("click", restart);
  }

  function restart() { st = { i: 0, a: {}, review: false }; save(); render(); window.scrollTo(0, 0); }

  function tally() {
    let hk = 0, sh = 0, skipped = 0, boost = null; const rows = [];
    // The "what matters most" answer doubles the weight of questions with that theme.
    QUESTIONS.forEach((Q, i) => { const o = !isSkip(i) && Q.opts[st.a[i]]; if (o && o.boost) boost = { theme: o.boost, o }; });
    QUESTIONS.forEach((Q, i) => {
      if (isSkip(i)) { skipped++; rows.push({ Q, i, skip: true, lean: 0 }); return; }
      const o = Q.opts[st.a[i]]; if (!o) return;
      const w = (Q.w || 1) * (boost && Q.theme === boost.theme ? 2 : 1); hk += o.hk * w; sh += o.sh * w;
      rows.push({ Q, o, i, lean: (o.hk - o.sh) * w });
    });
    const tot = hk + sh || 1, pHk = Math.round((hk / tot) * 100);
    const margin = Math.abs(pHk - (100 - pHk));
    return { hk, sh, pHk, pSh: 100 - pHk, rows, skipped, boost, conf: margin >= 30 ? "clear" : margin >= 12 ? "lean" : "close" };
  }

  function result(main) {
    $("bar").style.width = "100%"; $("count").textContent = L.done; $("back").hidden = false;
    const r = tally(), C = L.city;
    const ans = (x) => x.skip ? L.skipped : x.Q.kind === "photo" ? L.pickedPhoto(stripCity(tx(x.o, "cap"))) : tx(x.o, "t");
    const leanPill = (x) => x.skip ? '<span class="pill skip-p">' + esc(L.skipped) + '</span>' :
      '<span class="pill ' + (x.lean > 0 ? "hk" : x.lean < 0 ? "sh" : "even") + '">' + esc(x.lean > 0 ? C.hk : x.lean < 0 ? C.sh : L.either) + '</span>';
    const allHTML = '<section class="card sec fade"><h2>' + esc(L.all) + '</h2><div class="why">' + r.rows.map((x) => '<div class="w"><b>' + leanPill(x) + esc(tx(x.Q, "q")) + '</b><p>' + esc(ans(x)) + '</p></div>').join("") + '</div>' +
      '<div class="row"><button class="btn ghost" id="again">' + esc(L.again) + '</button></div></section>';

    // Too many skips: no winner.
    if (r.skipped > MAX_SKIP) {
      main.innerHTML = '<section class="card win none fade"><p class="eyebrow">' + esc(L.noneEyebrow) + '</p><h1>' + esc(L.noneH) + '</h1><p class="line">' + esc(L.noneLine(r.skipped, N)) + '</p>' +
        '<div class="row" style="justify-content:center"><button class="btn" id="review">' + esc(L.noneBtn) + '</button></div></section>' + allHTML;
      $("review").addEventListener("click", () => { st.review = true; let j = 0; while (j < N && !isSkip(j)) j++; st.i = j; save(); render(); window.scrollTo(0, 0); });
      $("again").addEventListener("click", restart);
      return;
    }

    const tie = r.pHk === r.pSh, win = r.pHk > r.pSh ? "hk" : "sh", lose = win === "hk" ? "sh" : "hk";
    const sign = win === "hk" ? 1 : -1;
    const tipped = r.rows.filter((x) => x.lean * sign > 0).sort((a, b) => b.lean * sign - a.lean * sign).slice(0, 4);
    const other = r.rows.filter((x) => x.lean * sign < 0).sort((a, b) => a.lean * sign - b.lean * sign).slice(0, 2);
    const whyCard = (x) => '<div class="w"><b>' + leanPill(x) + esc(ans(x)) + '</b><p>' + esc(tx(x.o, "why")) + '</p></div>';
    const photos = [];
    QUESTIONS.forEach((Q, i) => { if (Q.kind === "photo") Q.opts.forEach((o, k) => photos.push({ o, chosen: st.a[i] === k })); });

    let h = '<section class="card win fade"><p class="eyebrow">' + esc(L.eyebrow) + '</p><h1>' + esc(tie ? L.tie : C[win]) + '</h1>' +
      (tie ? "" : '<p class="conf ' + r.conf + '">' + esc(L.conf[r.conf]) + '</p>') +
      '<p class="line">' + esc(tie ? L.tieLine : L.winLine(C[win], C[lose]) + " " + L.confLine[r.conf]) + '</p>' +
      '<div class="scores">' + ["hk", "sh"].map((c) => '<div class="score ' + c + '"><span>' + esc(C[c]) + '</span><div class="track"><i data-w="' + (c === "hk" ? r.pHk : r.pSh) + '"></i></div><span class="n">' + (c === "hk" ? r.pHk : r.pSh) + '</span></div>').join("") + '</div>' +
      (r.boost ? '<p class="skipnote">' + esc(L.boostNote(tx(r.boost.o, "t"))) + '</p>' : "") +
      (r.skipped ? '<p class="skipnote">' + esc(L.skipNote(r.skipped)) + '</p>' : "") +
      '<div class="row" style="justify-content:center"><a class="btn wa" id="wa" target="_blank" rel="noopener">' + esc(L.wa) + '</a><button class="btn ghost" id="copy">' + esc(L.copy) + '</button></div></section>';
    if (tipped.length) h += '<section class="card sec fade"><h2>' + esc(L.tipped) + '</h2><div class="why">' + tipped.map(whyCard).join("") + '</div></section>';
    if (other.length && !tie) h += '<section class="card sec fade"><h2>' + esc(L.lost(C[lose])) + '</h2><div class="why">' + other.map(whyCard).join("") + '</div></section>';
    h += '<section class="card sec fade"><h2>' + esc(L.photos) + '</h2><div class="revs">' + photos.map((p) => { const c = p.o.hk > p.o.sh ? "hk" : "sh"; return '<figure class="rev' + (p.chosen ? " chosen" : "") + '"><img src="quiz/' + esc(p.o.img) + '.jpg" alt="" loading="lazy">' + (p.chosen ? '<span class="mine">' + esc(L.pick) + '</span>' : "") + '<figcaption><span class="pill ' + c + '">' + esc(C[c]) + '</span>' + esc(stripCity(tx(p.o, "cap"))) + '</figcaption></figure>'; }).join("") + '</div>' +
      '<p class="credits">' + esc(L.credits) + Object.values(CREDITS).map((c) => '<a href="' + esc(c.source) + '" target="_blank" rel="noopener">' + esc(c.title) + '</a>' + esc(L.by) + esc(c.author) + ' (' + esc(c.license) + ')').join("; ") + '.</p></section>';
    h += allHTML;
    main.innerHTML = h;
    requestAnimationFrame(() => requestAnimationFrame(() => main.querySelectorAll(".track i").forEach((i) => { i.style.width = i.dataset.w + "%"; })));
    const u = new URL(location.href); u.hash = ""; u.searchParams.delete("g");
    const text = L.share(tie ? L.shareTie : C[win], tie ? "" : L.conf[r.conf], r, tipped.map(ans)) + "\n" + u.href;
    $("wa").href = "https://wa.me/?text=" + encodeURIComponent(text);
    $("copy").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(text); $("copy").textContent = L.copied; } catch (_) { $("copy").textContent = L.copyFail; }
    });
    $("again").addEventListener("click", restart);
  }

  $("back").addEventListener("click", () => { st.review = false; st.i = Math.max(-1, st.i - 1); save(); render(); window.scrollTo(0, 0); });
  $("lang2").addEventListener("click", () => setLang(lang === "ar" ? "en" : "ar"));
  applyLang();
  render();
})();
</script>
<script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script></body></html>
