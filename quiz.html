<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Holiday Questionnaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Questionnaire for the shutdown trip: Hong Kong or Shanghai. Same look as the trip pages (Inter, grey page, white cards).
   Questions never name a place; each answer adds points to hk and/or sh (times the question weight). Cost is left out on purpose. */
:root {
  --bg: #f4f5f7; --surface: #ffffff; --sunken: #fafafa; --ink: #111827; --ink-2: #374151; --muted: #4b5563; --subtle: #9ca3af;
  --line: #e5e7eb; --accent: #1d4ed8; --accent-press: #1e3a8a; --select: #2563eb; --select-bg: #eff6ff;
  --hk: #2563eb; --sh: #7c3aed; --hk-bg: #dbeafe; --sh-bg: #ede9fe; --ok: #166534;
  --shadow: 0 1px 3px rgba(17, 24, 39, .06); --focus-ring: 0 0 0 3px rgba(37, 99, 235, .4);
  --font: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --surface: #181b21; --sunken: #1e2128; --ink: #f3f4f6; --ink-2: #d1d5db; --muted: #9ca3af; --subtle: #6b7280; --line: #2b303a;
    --accent: #8fb4ff; --accent-press: #b9cfff; --select: #6b9cff; --select-bg: #1b2740;
    --hk: #6b9cff; --sh: #a98bfa; --hk-bg: #1b2740; --sh-bg: #2a2147; --ok: #6ee7a0; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --surface: #181b21; --sunken: #1e2128; --ink: #f3f4f6; --ink-2: #d1d5db; --muted: #9ca3af; --subtle: #6b7280; --line: #2b303a;
  --accent: #8fb4ff; --accent-press: #b9cfff; --select: #6b9cff; --select-bg: #1b2740;
  --hk: #6b9cff; --sh: #a98bfa; --hk-bg: #1b2740; --sh-bg: #2a2147; --ok: #6ee7a0; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); min-height: 100vh; min-height: 100dvh; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px calc(32px + env(safe-area-inset-bottom)); }
.top { display: flex; align-items: center; gap: 12px; min-height: 44px; margin-bottom: 8px; }
.top .back { width: 44px; height: 44px; border: 0; background: none; border-radius: 12px; cursor: pointer; display: grid; place-items: center; color: var(--ink-2); flex: none; }
.top .back[hidden] { display: none; }
.top .count { font-size: 14px; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; flex: 1; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; }
h1 { font-size: 26px; line-height: 1.2; margin: 4px 0 8px; letter-spacing: -.01em; }
h2 { font-size: 21px; line-height: 1.3; margin: 0 0 6px; letter-spacing: -.01em; }
.kind { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 6px; }
.sub { color: var(--muted); margin: 0 0 16px; font-size: 15px; }
.opts { display: grid; gap: 10px; }
.opt { display: block; width: 100%; text-align: left; padding: 14px 16px; min-height: 56px; border: 1.5px solid var(--line); border-radius: 14px;
  background: var(--sunken); cursor: pointer; transition: border-color .15s, background .15s; }
.opt[aria-pressed="true"] { border-color: var(--select); background: var(--select-bg); }
.opt b { display: block; font-weight: 600; }
.opt span { display: block; font-size: 14px; color: var(--muted); margin-top: 2px; }
.opt.sit { padding: 16px 18px; }
.opt.sit b { font-weight: 500; line-height: 1.45; }
.pics { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 520px) { .pics { grid-template-columns: 1fr 1fr; } }
.pic { position: relative; padding: 0; border: 3px solid transparent; border-radius: 16px; overflow: hidden; cursor: pointer; background: var(--line); aspect-ratio: 4 / 3; }
.pic img { display: block; width: 100%; height: 100%; object-fit: cover; }
.pic[aria-pressed="true"] { border-color: var(--select); }
.pic .tag { position: absolute; left: 10px; top: 10px; width: 30px; height: 30px; border-radius: 99px; background: rgba(17, 24, 39, .65); color: #fff; font-weight: 600; font-size: 14px; display: grid; place-items: center; }
.pic[aria-pressed="true"] .tag { background: var(--select); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 12px 20px; border-radius: 12px; border: 0; cursor: pointer;
  background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; }
:root[data-theme="dark"] .btn { color: #0f1115; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn { color: #0f1115; } }
.btn.ghost { background: none; color: var(--ink-2); border: 1px solid var(--line); }
.btn.wa { background: #16a34a; color: #fff; }
.row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.intro p { margin: 0 0 12px; color: var(--ink-2); }
.intro ul { margin: 0 0 16px; padding-left: 20px; color: var(--ink-2); }
.intro li { margin-bottom: 4px; }
/* Result */
.win { text-align: center; padding: 24px 20px; }
.win .eyebrow { font-size: 14px; color: var(--muted); margin: 0; }
.win h1 { font-size: 34px; margin: 4px 0 4px; }
.win .line { color: var(--ink-2); margin: 0; }
.scores { display: grid; gap: 12px; margin-top: 20px; text-align: left; }
.score { display: grid; grid-template-columns: 96px 1fr 44px; align-items: center; gap: 10px; font-weight: 600; }
.score .track { height: 12px; background: var(--line); border-radius: 99px; overflow: hidden; }
.score .track i { display: block; height: 100%; border-radius: 99px; width: 0; transition: width .6s ease; }
.score.hk i { background: var(--hk); } .score.sh i { background: var(--sh); }
.score .n { text-align: right; font-variant-numeric: tabular-nums; }
.sec { margin-top: 16px; }
.sec h2 { font-size: 18px; margin-bottom: 10px; }
.why { display: grid; gap: 10px; }
.why .w { padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--sunken); }
.why .w b { display: block; font-weight: 600; font-size: 15px; }
.why .w p { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; margin-right: 6px; vertical-align: 1px; }
.pill.hk { background: var(--hk-bg); color: var(--hk); } .pill.sh { background: var(--sh-bg); color: var(--sh); } .pill.even { background: var(--line); color: var(--ink-2); }
.revs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rev { margin: 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--sunken); position: relative; }
.rev img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.rev figcaption { padding: 8px 10px; font-size: 13px; color: var(--ink-2); line-height: 1.35; }
.rev.chosen { border-color: var(--select); box-shadow: 0 0 0 2px var(--select); }
.rev .mine { position: absolute; top: 8px; left: 8px; background: var(--select); color: #fff; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; }
.credits { font-size: 12px; color: var(--muted); margin-top: 16px; }
.credits a { color: var(--muted); }
.note { font-size: 14px; color: var(--muted); margin-top: 12px; }
@media (hover: hover) {
  .top .back:hover { background: var(--surface); }
  .opt:hover { border-color: var(--subtle); }
  .btn:hover { background: var(--accent-press); }
  .btn.ghost:hover { background: var(--surface); }
  .btn.wa:hover { background: #15803d; }
}
button { -webkit-tap-highlight-color: transparent; }
.fade { animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fade { animation: none; } .bar i, .score .track i { transition: none; } }
</style>
</head><body>
<div class="wrap">
  <div class="top" id="top" hidden>
    <button class="back" id="back" aria-label="Previous question"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    <span class="count" id="count"></span>
  </div>
  <main id="main"></main>
</div>
<script>
(() => {
  // Theme: the trip pages remember Light/Dark per browser under "tripTheme"; light by default.
  try { const t = localStorage.getItem("tripTheme"); document.documentElement.dataset.theme = t === "dark" ? "dark" : "light"; } catch (_) { document.documentElement.dataset.theme = "light"; }

  const CITY = { hk: "Hong Kong", sh: "Shanghai" };
  // Each question: kind (text | situation | photo), q, sub, w (weight), opts [{t, d?, img?, hk, sh, why, cap?}]
  // hk/sh = points that answer gives each city (0–3). "why" explains the link at the end; "cap" names the photo.
  const QUESTIONS = [{"kind":"text","w":2,"q":"Your ideal holiday weather is…","opts":[{"t":"Mild and sunny","d":"A light jacket in the evening is enough.","hk":3,"sh":0,"why":"Hong Kong is about 19°C by day and 14°C at night over these dates, with about 8 hours of sun."},{"t":"Proper winter","d":"Coat, scarf, gloves and hot drinks.","hk":0,"sh":3,"why":"Shanghai is about 10°C by day and 2°C at night: a crisp, damp winter cold."},{"t":"I do not mind, as long as it is dry","hk":1,"sh":1,"why":"Both cities are mostly dry at this time of year."}]},{"kind":"photo","w":1,"q":"A free morning. Which walk?","opts":[{"img":"hk-trail","hk":3,"sh":0,"cap":"A ridge trail above the sea, Hong Kong","why":"About 40% of Hong Kong is country park, and late December is its hiking season."},{"img":"sh-street","hk":0,"sh":3,"cap":"A quiet plane-tree street with old villas, Shanghai","why":"Shanghai's old French Concession is made of flat, leafy streets with villas and cafés."}]},{"kind":"text","w":2,"q":"On a free day, the walking you enjoy most is…","opts":[{"t":"Up and down","d":"Hills, stairs, and a trail with a view at the top.","hk":3,"sh":0,"why":"Hong Kong is steep: stairs, hill trails, and an 800 m outdoor escalator up the hillside."},{"t":"Flat and easy","d":"Long, leafy streets and riverside promenades.","hk":0,"sh":3,"why":"Shanghai is completely flat (its average height is 4 m), so walks have no climbs."}]},{"kind":"photo","w":1,"q":"Where would you sit for an hour?","opts":[{"img":"hk-beach","hk":3,"sh":0,"cap":"A sandy bay with green hills, Hong Kong","why":"Hong Kong has beaches and islands within half an hour of the centre, warm enough to sit on in December."},{"img":"sh-lake","hk":0,"sh":3,"cap":"West Lake in Hangzhou, a day trip from Shanghai","why":"West Lake, with its willows, causeways and pagodas, is about 45 minutes from Shanghai by fast train."}]},{"kind":"situation","w":2,"q":"It is 11:50 pm on 31 December. Which New Year's Eve sounds better?","opts":[{"t":"Standing by the water with a huge, excited crowd, waiting for big fireworks to burst over the harbour.","hk":3,"sh":0,"why":"Hong Kong's harbour fireworks return this year, announced as bigger than before, and draw hundreds of thousands of people."},{"t":"A nice warm dinner, then a calm walk to see the city lights. Fireworks do not matter to me.","hk":1,"sh":2,"why":"Shanghai has had no official fireworks since 2016; its New Year's Eve is lights and river views."}]},{"kind":"text","w":1,"q":"Packed streets with neon signs and noise make you feel…","opts":[{"t":"Excited","d":"I love the buzz.","hk":3,"sh":0,"why":"Parts of Hong Kong, such as Mong Kok, are among the densest places on earth, full of neon and night markets."},{"t":"Fine for an evening, not every day","hk":1,"sh":1,"why":"Both cities have busy areas and calmer ones."},{"t":"Tired","d":"I like space to breathe.","hk":0,"sh":3,"why":"Shanghai has wide avenues and long riverside promenades (its sights do get busy on 1–3 Jan, a mainland holiday)."}]},{"kind":"photo","w":1,"q":"Which evening would you step into?","opts":[{"img":"hk-neon","hk":3,"sh":0,"cap":"A neon street at night, Hong Kong","why":"Hong Kong's night streets and markets, such as Mong Kok and Temple Street, are dense and lively."},{"img":"sh-boulevard","hk":0,"sh":3,"cap":"A wide shopping street at night, Shanghai","why":"Shanghai's Nanjing Road is a wide, lit pedestrian avenue of big stores."}]},{"kind":"situation","w":1,"q":"A day trip out of the city. Which day sounds better?","opts":[{"t":"An hour on a ferry to a little old town with pastel Portuguese squares, wavy cobblestones and egg tarts, then glittering casino resorts at night.","hk":3,"sh":0,"why":"That is Macau, an hour by ferry from Hong Kong, with no visa needed."},{"t":"A fast train to a calm lake with willow-lined causeways, pagodas and tea hills, maybe a little misty.","hk":0,"sh":3,"why":"That is Hangzhou's West Lake, about 45 minutes from Shanghai by fast train."}]},{"kind":"photo","w":1,"q":"Which ride on the water?","opts":[{"img":"hk-ferry","hk":3,"sh":0,"cap":"A ferry crossing the harbour, Hong Kong","why":"Ferries cross Hong Kong's harbour all day, and others run out to the islands."},{"img":"sh-watertown","hk":0,"sh":3,"cap":"A canal town with a stone bridge near Shanghai","why":"Zhujiajiao, a canal town with old stone bridges, is about an hour from Shanghai by metro."}]},{"kind":"situation","w":1,"q":"It is 8 pm and 2°C, with a damp wind. You are heading out to see the lights.","opts":[{"t":"Lovely. I wrap up warm and stroll with a hot drink.","hk":0,"sh":3,"why":"That is a normal Shanghai evening in late December, and it gets dark there before 5 pm."},{"t":"I would rather it were 14°C, with just a light jacket.","hk":3,"sh":0,"why":"Hong Kong evenings are about 14°C at this time of year."}]},{"kind":"photo","w":1,"q":"Which place would you explore?","opts":[{"img":"hk-macau","hk":3,"sh":0,"cap":"A Portuguese-style square in Macau, a day trip from Hong Kong","why":"Macau's old centre is a UNESCO-listed mix of Portuguese squares, churches and Chinese streets."},{"img":"sh-garden","hk":0,"sh":3,"cap":"A classical Chinese garden, Shanghai","why":"Shanghai has classical gardens with ponds, rockeries and curved roofs, such as Yu Garden."}]},{"kind":"text","w":1,"q":"On holiday, your phone…","opts":[{"t":"Should work just like at home","d":"WhatsApp, Instagram and Google Maps, with no setup.","hk":3,"sh":0,"why":"In Shanghai, Google, WhatsApp and Instagram are blocked, so you need a travel eSIM and Chinese payment apps. In Hong Kong everything works as at home."},{"t":"I do not mind setting up a travel eSIM and new apps","hk":1,"sh":1,"why":"Then this does not matter: both cities work for you."}]},{"kind":"photo","w":1,"q":"Which view would you travel for?","opts":[{"img":"hk-buddha","hk":3,"sh":0,"cap":"A giant Buddha on a green mountain, Hong Kong","why":"A 5.7 km cable car over the sea and hills leads to the Big Buddha on Lantau Island."},{"img":"sh-skyline","hk":0,"sh":3,"cap":"The skyscrapers across the river, Shanghai","why":"Shanghai's riverfront faces one of the tallest skylines in the world; the Shanghai Tower deck is at 546 m."}]},{"kind":"text","w":1,"q":"Which feels more like a holiday to you?","opts":[{"t":"A mix of East and West","d":"English everywhere, and things feel a little familiar.","hk":3,"sh":0,"why":"English is an official language in Hong Kong, a mix of British and Chinese; Macau adds Portuguese."},{"t":"Somewhere completely different","d":"I want to feel that I am really in China.","hk":0,"sh":3,"why":"Shanghai feels like mainland China: Chinese menus, Chinese apps, old lanes and gardens."}]},{"kind":"photo","w":1,"q":"Which afternoon?","opts":[{"img":"hk-peak","hk":3,"sh":0,"cap":"The view down over the harbour at dusk, Hong Kong","why":"From Victoria Peak you look down on the towers, the harbour and the hills around them."},{"img":"sh-lane","hk":0,"sh":3,"cap":"An old stone-gate lane with cafés and small shops, Shanghai","why":"Shanghai's old lane houses, such as Tianzifang and Xintiandi, are full of cafés and small shops."}]},{"kind":"text","w":1,"q":"Your perfect dinner after a long day…","opts":[{"t":"A Turkish or Lebanese grill, or Italian, near the hotel","hk":2,"sh":0,"why":"Hong Kong has more certified Middle Eastern, Turkish and Western halal restaurants, many near the main mosque on Nathan Road."},{"t":"A bowl of hand-pulled halal beef noodles in a simple local shop","hk":0,"sh":2,"why":"Shanghai has halal Lanzhou noodle and Xinjiang shops all over the city, and a Friday Muslim food market."}]},{"kind":"text","w":1,"q":"For a fun day out, you would choose…","opts":[{"t":"A cable car over the sea and mountains, then a ferry back","hk":3,"sh":0,"why":"Hong Kong has a 5.7 km cable car to the Big Buddha, and ferries everywhere."},{"t":"One of the tallest towers in the world, then a river cruise at night","hk":0,"sh":3,"why":"The Shanghai Tower deck is at 546 m, and night cruises run between the old waterfront and the skyscrapers."},{"t":"A theme park, all day","hk":2,"sh":1,"why":"Hong Kong has two parks (Disneyland and Ocean Park) with mild-weather queues; Shanghai has one big Disney park, cold queues, and holiday crowds on 1–3 Jan."}]},{"kind":"photo","w":1,"q":"Last one. Where would you wander?","opts":[{"img":"hk-island","hk":3,"sh":0,"cap":"Fishing boats in an island harbour, Hong Kong","why":"Hong Kong has 263 islands, and fishing harbours such as Cheung Chau and Tai O are a ferry ride away."},{"img":"sh-artdeco","hk":0,"sh":3,"cap":"Grand old buildings along the river, Shanghai","why":"The Bund is a riverfront row of grand early-1900s and Art Deco buildings."}]}];
  const CREDITS = {"hk-trail":{"file":"hk-trail.jpg","title":"Hikers on the Dragon's Back ridge above Shek O, Hong Kong Island","author":"Seaman Christopher Veloicaza, U.S. Navy","license":"Public domain","source":"https://commons.wikimedia.org/wiki/File:USS_Essex_visit_to_Hong_Kong_150610-N-FV739-266.jpg"},"sh-street":{"file":"sh-street.jpg","title":"Plane-tree-lined Wukang Road, former French Concession, Shanghai","author":"SSYoung","license":"CC BY-SA 4.0","source":"https://commons.wikimedia.org/wiki/File:Wukang_Road,_Shanghai,_May_2016.JPG"},"hk-beach":{"file":"hk-beach.jpg","title":"Repulse Bay beach with hills behind, Hong Kong Island","author":"Wing1990hk","license":"CC BY 3.0","source":"https://commons.wikimedia.org/wiki/File:Repulse_Bay_201501.jpg"},"sh-lake":{"file":"sh-lake.jpg","title":"Leifeng Pagoda across West Lake framed by a willow, Hangzhou","author":"Yinweichen","license":"CC BY-SA 4.0","source":"https://commons.wikimedia.org/wiki/File:Leifeng_Pagoda_and_Willow_Tree_across_West_Lake.jpg"},"hk-neon":{"file":"hk-neon.jpg","title":"Neon signs over a busy street at night, Mong Kok, Hong Kong","author":"Benh LIEU SONG from Torcy, France","license":"CC BY-SA 2.0","source":"https://commons.wikimedia.org/wiki/File:Mong_Kok_Neon_Signs_Night_(48127904386).jpg"},"sh-boulevard":{"file":"sh-boulevard.jpg","title":"Nanjing Road East pedestrian street at night, Shanghai","author":"Hermann Luyken","license":"CC0","source":"https://commons.wikimedia.org/wiki/File:2014.11.15.181406_Nanjing_Road_Pedestrian_Zone_Shanghai.jpg"},"hk-ferry":{"file":"hk-ferry.jpg","title":"Star Ferry Solar Star crossing Victoria Harbour, Hong Kong","author":"Bernard Spragg. NZ from Christchurch, New Zealand","license":"CC0","source":"https://commons.wikimedia.org/wiki/File:%22Solar_Star%22_Ferry_to_Central.HK_(15853925347).jpg"},"sh-watertown":{"file":"sh-watertown.jpg","title":"Stone arched bridge over a canal in Zhujiajiao water town, Shanghai","author":"Supanut Arunoprayote","license":"CC BY 4.0","source":"https://commons.wikimedia.org/wiki/File:Zhujiajiao_Ancient_Town_Moon_Bridge_20251129.jpg"},"hk-macau":{"file":"hk-macau.jpg","title":"Senado Square (Largo do Senado) with wave-pattern cobbles, Macau","author":"Bahnfrend","license":"CC BY-SA 4.0","source":"https://commons.wikimedia.org/wiki/File:Largo_do_Senado,_2023_(02).jpg"},"sh-garden":{"file":"sh-garden.jpg","title":"Covered walkway, pond and pavilion in Yu Garden, Shanghai","author":"Stefan Fussan","license":"CC BY-SA 3.0","source":"https://commons.wikimedia.org/wiki/File:Shanghai_-_Yu_Garden_-_0034.jpg"},"hk-buddha":{"file":"hk-buddha.jpg","title":"Tian Tan Buddha above the green hills of Lantau Island, Hong Kong","author":"Huangdan2060","license":"CC BY 4.0","source":"https://commons.wikimedia.org/wiki/File:Tian_Tan_Buddha_2023081302.jpg"},"sh-skyline":{"file":"sh-skyline.jpg","title":"Lujiazui skyline across the Huangpu River from the Bund, Shanghai","author":"YouTable","license":"CC BY-SA 4.0","source":"https://commons.wikimedia.org/wiki/File:Lujiazui_from_the_Bund_riverside.jpg"},"hk-peak":{"file":"hk-peak.jpg","title":"Hong Kong Island and Victoria Harbour at dusk from Victoria Peak","author":"Estial","license":"CC BY-SA 4.0","source":"https://commons.wikimedia.org/wiki/File:Hong_Kong_Skyscrapers.jpg"},"sh-lane":{"file":"sh-lane.jpg","title":"Ivy-covered shikumen lane with small shops in Tianzifang, Shanghai","author":"钉钉","license":"CC BY-SA 4.0","source":"https://commons.wikimedia.org/wiki/File:Tianzifang_3.jpg"},"hk-island":{"file":"hk-island.jpg","title":"Fishing boats in Cheung Chau harbour, Hong Kong","author":"Bernard Spragg. NZ from Christchurch, New Zealand","license":"CC0","source":"https://commons.wikimedia.org/wiki/File:Cheung_Chau.Hong_Kong._(17028191765).jpg"},"sh-artdeco":{"file":"sh-artdeco.jpg","title":"Peace Hotel, Bank of China and other historic Bund buildings across the Huangpu, Shanghai","author":"xiquinhosilva","license":"CC BY 2.0","source":"https://commons.wikimedia.org/wiki/File:The_Bund_22079-Shanghai_(32913511622).jpg"}};

  const KEY = "tripQuiz1";
  let st = { i: -1, a: {} };
  try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && typeof s.i === "number" && s.a) st = s; } catch (_) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (_) {} };

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const N = QUESTIONS.length;

  function render() {
    const main = $("main");
    $("top").hidden = st.i < 0;
    if (st.i < 0) return intro(main);
    if (st.i >= N) return result(main);
    $("bar").style.width = Math.round((st.i / N) * 100) + "%";
    $("count").textContent = (st.i + 1) + " of " + N;
    $("back").hidden = false;
    const Q = QUESTIONS[st.i], picked = st.a[st.i];
    const kind = { text: "Pick one", situation: "Which sounds better?", photo: "Which would you rather walk into?" }[Q.kind];
    let h = '<section class="card fade"><p class="kind">' + kind + '</p><h2>' + esc(Q.q) + '</h2>' + (Q.sub ? '<p class="sub">' + esc(Q.sub) + '</p>' : '<div style="height:10px"></div>');
    if (Q.kind === "photo") {
      h += '<div class="pics">' + Q.opts.map((o, k) => '<button class="pic" data-k="' + k + '" aria-pressed="' + (picked === k) + '" aria-label="Photo ' + "AB"[k] + '"><img src="quiz/' + esc(o.img) + '.jpg" alt="" ' + (k ? 'loading="lazy"' : '') + '><span class="tag">' + "AB"[k] + '</span></button>').join("") + '</div>';
    } else {
      h += '<div class="opts">' + Q.opts.map((o, k) => '<button class="opt' + (Q.kind === "situation" ? " sit" : "") + '" data-k="' + k + '" aria-pressed="' + (picked === k) + '"><b>' + esc(o.t) + '</b>' + (o.d ? '<span>' + esc(o.d) + '</span>' : "") + '</button>').join("") + '</div>';
    }
    h += '</section>';
    main.innerHTML = h;
    main.querySelectorAll("[data-k]").forEach((b) => b.addEventListener("click", () => {
      st.a[st.i] = +b.dataset.k; main.querySelectorAll("[data-k]").forEach((x) => x.setAttribute("aria-pressed", x === b));
      setTimeout(() => { st.i++; save(); render(); window.scrollTo(0, 0); }, 220);
    }));
    // Preload the next photo pair.
    const nx = QUESTIONS[st.i + 1]; if (nx && nx.kind === "photo") nx.opts.forEach((o) => { const im = new Image(); im.src = "quiz/" + o.img + ".jpg"; });
  }

  function intro(main) {
    const done = Object.keys(st.a).length;
    main.innerHTML = '<section class="card intro fade"><p class="kind">' + N + ' quick questions</p><h1>Where should we spend the holidays?</h1>' +
      '<p>Answer with what you would enjoy most. There are no right answers and nothing here is about money.</p>' +
      '<ul><li>Some questions are short choices, some describe a moment, and some show two photos.</li><li>Go with your first feeling.</li><li>At the end you will see which city fits you better, and why.</li></ul>' +
      '<div class="row"><button class="btn" id="go">' + (done ? "Continue" : "Start") + '</button>' + (done ? '<button class="btn ghost" id="restart">Start again</button>' : "") + '</div></section>';
    $("go").addEventListener("click", () => { st.i = done ? Math.min(done, N) : 0; save(); render(); });
    if (done) $("restart").addEventListener("click", restart);
  }

  function restart() { st = { i: 0, a: {} }; save(); render(); window.scrollTo(0, 0); }

  function tally() {
    let hk = 0, sh = 0; const rows = [];
    QUESTIONS.forEach((Q, i) => {
      const o = Q.opts[st.a[i]]; if (!o) return;
      const w = Q.w || 1; hk += o.hk * w; sh += o.sh * w;
      rows.push({ Q, o, i, lean: (o.hk - o.sh) * w });
    });
    const tot = hk + sh || 1, pHk = Math.round((hk / tot) * 100);
    return { hk, sh, pHk, pSh: 100 - pHk, rows };
  }

  function result(main) {
    $("bar").style.width = "100%"; $("count").textContent = "Done"; $("back").hidden = false;
    const r = tally(), tie = r.pHk === r.pSh, win = r.pHk > r.pSh ? "hk" : "sh", lose = win === "hk" ? "sh" : "hk";
    const sign = win === "hk" ? 1 : -1;
    const tipped = r.rows.filter((x) => x.lean * sign > 0).sort((a, b) => b.lean * sign - a.lean * sign).slice(0, 4);
    const other = r.rows.filter((x) => x.lean * sign < 0).sort((a, b) => a.lean * sign - b.lean * sign).slice(0, 2);
    const ans = (x) => { if (x.Q.kind !== "photo") return x.o.t; const c = x.o.cap.replace(/, (Hong Kong|Shanghai)$/, ""); return "You picked the photo of " + c.charAt(0).toLowerCase() + c.slice(1); };
    const whyCard = (x) => '<div class="w"><b><span class="pill ' + (x.lean > 0 ? "hk" : "sh") + '">' + CITY[x.lean > 0 ? "hk" : "sh"] + '</span>' + esc(ans(x)) + '</b><p>' + esc(x.o.why) + '</p></div>';
    const photos = [];
    QUESTIONS.forEach((Q, i) => { if (Q.kind === "photo") Q.opts.forEach((o, k) => photos.push({ o, chosen: st.a[i] === k })); });

    let h = '<section class="card win fade"><p class="eyebrow">Your holiday city</p><h1>' + (tie ? "It is a tie" : CITY[win]) + '</h1>' +
      '<p class="line">' + (tie ? "Both cities fit you equally well. Talk it over together." : CITY[win] + " fits what you enjoy better than " + CITY[lose] + ".") + '</p>' +
      '<div class="scores">' + ["hk", "sh"].map((c) => '<div class="score ' + c + '"><span>' + CITY[c] + '</span><div class="track"><i data-w="' + (c === "hk" ? r.pHk : r.pSh) + '"></i></div><span class="n">' + (c === "hk" ? r.pHk : r.pSh) + '</span></div>').join("") + '</div>' +
      '<div class="row" style="justify-content:center"><a class="btn wa" id="wa" target="_blank" rel="noopener">Send to Shady on WhatsApp</a><button class="btn ghost" id="copy">Copy result</button></div></section>';
    if (tipped.length) h += '<section class="card sec fade"><h2>What tipped it</h2><div class="why">' + tipped.map(whyCard).join("") + '</div></section>';
    if (other.length && !tie) h += '<section class="card sec fade"><h2>Where ' + CITY[lose] + ' won</h2><div class="why">' + other.map(whyCard).join("") + '</div></section>';
    h += '<section class="card sec fade"><h2>The photos</h2><div class="revs">' + photos.map((p) => '<figure class="rev' + (p.chosen ? " chosen" : "") + '"><img src="quiz/' + esc(p.o.img) + '.jpg" alt="" loading="lazy">' + (p.chosen ? '<span class="mine">Your pick</span>' : "") + '<figcaption><span class="pill ' + (p.o.hk > p.o.sh ? "hk" : "sh") + '">' + CITY[p.o.hk > p.o.sh ? "hk" : "sh"] + '</span>' + esc(p.o.cap.replace(/, (Hong Kong|Shanghai)$/, "")) + '</figcaption></figure>').join("") + '</div>' +
      '<p class="credits">Photos from Wikimedia Commons: ' + Object.values(CREDITS).map((c) => '<a href="' + esc(c.source) + '" target="_blank" rel="noopener">' + esc(c.title) + '</a> by ' + esc(c.author) + ' (' + esc(c.license) + ')').join("; ") + '.</p></section>';
    h += '<section class="card sec fade"><h2>All your answers</h2><div class="why">' + r.rows.map((x) => '<div class="w"><b><span class="pill ' + (x.lean > 0 ? "hk" : x.lean < 0 ? "sh" : "even") + '">' + (x.lean > 0 ? CITY.hk : x.lean < 0 ? CITY.sh : "Either") + '</span>' + esc(x.Q.q) + '</b><p>' + esc(ans(x)) + '</p></div>').join("") + '</div>' +
      '<div class="row"><button class="btn ghost" id="again">Start again</button></div></section>';
    main.innerHTML = h;
    requestAnimationFrame(() => requestAnimationFrame(() => main.querySelectorAll(".track i").forEach((i) => { i.style.width = i.dataset.w + "%"; })));
    const text = "Holiday questionnaire result: " + (tie ? "a tie" : CITY[win]) + "\n" + CITY.hk + " " + r.pHk + ", " + CITY.sh + " " + r.pSh + "\n\nWhat tipped it:\n" +
      tipped.map((x) => "- " + ans(x)).join("\n") + "\n\n" + location.href.split("#")[0];
    $("wa").href = "https://wa.me/?text=" + encodeURIComponent(text);
    $("copy").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(text); $("copy").textContent = "Copied"; } catch (_) { $("copy").textContent = "Copy failed"; }
    });
    $("again").addEventListener("click", restart);
  }

  $("back").addEventListener("click", () => { st.i = Math.max(-1, st.i - 1); save(); render(); window.scrollTo(0, 0); });
  render();
})();
</script>
<script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script></body></html>
