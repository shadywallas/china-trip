<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Which Trip Suits You?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Questionnaire, version 3: Trip 1 (Hong Kong, Macau, Guangzhou, Shenzhen) or Trip 2 (Shanghai, Hangzhou). 25 text questions, no photos.
   Each person answers on their own phone; the result has a box to combine two people's scores. English and Arabic (?lang=ar, &g=m for
   the masculine form). Each answer gives t1/t2 points (the other trip gets partial credit where it partly offers the same thing), times
   the question weight; the "what matters most" answer doubles one theme. "required" questions have a red frame and no Skip button.
   More than MAX_SKIP skipped questions: no winner. Cost is left out on purpose. */
:root {
  --bg: #f4f5f7; --surface: #ffffff; --sunken: #fafafa; --ink: #111827; --ink-2: #374151; --muted: #4b5563; --subtle: #9ca3af;
  --line: #e5e7eb; --accent: #1d4ed8; --accent-press: #1e3a8a; --select: #2563eb; --select-bg: #eff6ff;
  --t1: #0e7490; --t2: #7c3aed; --t1-bg: #cffafe; --t2-bg: #ede9fe;
  --req: #b91c1c; --req-bg: #fee2e2; --warn-bg: #fef3c7; --warn: #92400e; --ok-bg: #dcfce7; --ok: #166534;
  --shadow: 0 1px 3px rgba(17, 24, 39, .06); --focus-ring: 0 0 0 3px rgba(37, 99, 235, .4);
  --font: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --surface: #181b21; --sunken: #1e2128; --ink: #f3f4f6; --ink-2: #d1d5db; --muted: #9ca3af; --subtle: #6b7280; --line: #2b303a;
    --accent: #8fb4ff; --accent-press: #b9cfff; --select: #6b9cff; --select-bg: #1b2740;
    --t1: #67e8f9; --t2: #a98bfa; --t1-bg: #123038; --t2-bg: #2a2147;
    --req: #fca5a5; --req-bg: #3b1717; --warn-bg: #3a2a10; --warn: #fcd34d; --ok-bg: #12301f; --ok: #86efac; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --surface: #181b21; --sunken: #1e2128; --ink: #f3f4f6; --ink-2: #d1d5db; --muted: #9ca3af; --subtle: #6b7280; --line: #2b303a;
  --accent: #8fb4ff; --accent-press: #b9cfff; --select: #6b9cff; --select-bg: #1b2740;
  --t1: #67e8f9; --t2: #a98bfa; --t1-bg: #123038; --t2-bg: #2a2147;
  --req: #fca5a5; --req-bg: #3b1717; --warn-bg: #3a2a10; --warn: #fcd34d; --ok-bg: #12301f; --ok: #86efac; color-scheme: dark;
}
:root[lang="ar"] { --font: "Noto Sans Arabic", Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); min-height: 100vh; min-height: 100dvh; }
:root[lang="ar"] body { font-size: 17px; line-height: 1.7; }
:root[dir="rtl"] * { letter-spacing: 0 !important; }
button, input { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px calc(32px + env(safe-area-inset-bottom)); }
.top { display: flex; align-items: center; gap: 12px; min-height: 44px; margin-bottom: 8px; }
.top[hidden], .top .back[hidden] { display: none; }
.top .back { width: 44px; height: 44px; border: 0; background: none; border-radius: 12px; cursor: pointer; display: grid; place-items: center; color: var(--ink-2); flex: none; }
:root[dir="rtl"] .top .back svg { transform: scaleX(-1); }
.top .count { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.lang { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; min-height: 36px; padding: 4px 12px; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--ink-2); flex: none; }
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; flex: 1; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; }
.card.req { border: 2px solid var(--req); }
.reqtag { display: inline-flex; background: var(--req-bg); color: var(--req); font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 99px; margin: 0 0 10px; }
h1 { font-size: 26px; line-height: 1.25; margin: 4px 0 8px; letter-spacing: -.01em; }
h2 { font-size: 21px; line-height: 1.35; margin: 0 0 6px; letter-spacing: -.01em; }
.kind { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 6px; }
:root[lang="ar"] .kind { text-transform: none; font-size: 14px; }
.sub { color: var(--muted); margin: 0 0 16px; font-size: 15px; }
.opts { display: grid; gap: 10px; }
.opt { display: block; width: 100%; text-align: start; padding: 14px 16px; min-height: 56px; border: 1.5px solid var(--line); border-radius: 14px;
  background: var(--sunken); cursor: pointer; transition: border-color .15s, background .15s; }
.opt[aria-pressed="true"] { border-color: var(--select); background: var(--select-bg); }
.opt b { display: block; font-weight: 600; }
.opt span { display: block; font-size: 14px; color: var(--muted); margin-top: 2px; }
.skip { display: block; width: 100%; margin-top: 12px; min-height: 48px; border: 1.5px dashed var(--line); border-radius: 14px; background: none; color: var(--muted); font-weight: 500; cursor: pointer; }
.skip[aria-pressed="true"] { border-color: var(--subtle); color: var(--ink-2); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 12px 20px; border-radius: 12px; border: 0; cursor: pointer;
  background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; }
:root[data-theme="dark"] .btn { color: #0f1115; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn { color: #0f1115; } }
.btn.ghost { background: none; color: var(--ink-2); border: 1px solid var(--line); }
.btn.wa { background: #16a34a; color: #fff; }
@media (hover: hover) {
  .top .back:hover { background: var(--surface); }
  .opt:hover { border-color: var(--subtle); }
  .skip:hover { border-color: var(--subtle); color: var(--ink-2); }
  .btn:hover { background: var(--accent-press); }
  .btn.ghost:hover { background: var(--surface); }
  .btn.wa:hover { background: #15803d; }
}
.row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.intro .lrow { display: flex; justify-content: flex-end; align-items: center; gap: 10px; flex-wrap: wrap; margin: -4px 0 4px; }
.gsel { display: flex; align-items: center; gap: 6px; margin-inline-end: auto; font-size: 14px; color: var(--muted); }
.gsel button { border: 1px solid var(--line); background: var(--sunken); border-radius: 10px; min-height: 36px; padding: 4px 12px; font-size: 14px; cursor: pointer; color: var(--ink-2); }
.gsel button[aria-pressed="true"] { border-color: var(--select); background: var(--select-bg); color: var(--select); font-weight: 600; }
.intro p { margin: 0 0 12px; color: var(--ink-2); }
.intro ul { margin: 0 0 16px; padding-inline-start: 20px; color: var(--ink-2); }
.intro li { margin-bottom: 4px; }
.intro li.r { color: var(--req); font-weight: 500; }
.trips { display: grid; gap: 10px; margin: 4px 0 16px; }
@media (min-width: 520px) { .trips { grid-template-columns: 1fr 1fr; } }
.trip { border-radius: 12px; padding: 12px 14px; border: 1px solid var(--line); background: var(--sunken); }
.trip b { display: block; font-size: 15px; }
.trip span { display: block; font-size: 14px; color: var(--ink-2); }
.trip.t1 b { color: var(--t1); } .trip.t2 b { color: var(--t2); }
/* Result */
.win { text-align: center; padding: 24px 20px; }
.win .eyebrow { font-size: 14px; color: var(--muted); margin: 0; }
.win h1 { font-size: 34px; margin: 4px 0 0; }
.win .cities { margin: 0 0 6px; color: var(--ink-2); font-weight: 500; }
.win .line { color: var(--ink-2); margin: 0; }
.win.none h1 { font-size: 28px; }
.conf { display: inline-block; margin: 2px 0 8px; padding: 3px 12px; border-radius: 99px; font-size: 14px; font-weight: 600; }
.conf.clear { background: var(--ok-bg); color: var(--ok); } .conf.lean { background: var(--select-bg); color: var(--select); } .conf.close { background: var(--warn-bg); color: var(--warn); }
.scores { display: grid; gap: 12px; margin-top: 20px; text-align: start; }
.score { display: grid; grid-template-columns: 76px 1fr 44px; align-items: center; gap: 10px; font-weight: 600; }
.score .track { height: 12px; background: var(--line); border-radius: 99px; overflow: hidden; }
.score .track i { display: block; height: 100%; border-radius: 99px; width: 0; transition: width .6s ease; }
.score.t1 i { background: var(--t1); } .score.t2 i { background: var(--t2); }
.score .n { text-align: end; font-variant-numeric: tabular-nums; }
.note { margin: 14px 0 0; font-size: 14px; color: var(--muted); }
.sec { margin-top: 16px; }
.sec h2 { font-size: 18px; margin-bottom: 10px; }
.sec > p { margin: 0 0 12px; color: var(--ink-2); font-size: 15px; }
.why { display: grid; gap: 10px; }
.why .w { padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--sunken); }
.why .w b { display: block; font-weight: 600; font-size: 15px; }
.why .w p { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
.why .w p.wq { margin: 0 0 4px; font-size: 13px; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; margin-inline-end: 6px; vertical-align: 1px; }
.pill.t1 { background: var(--t1-bg); color: var(--t1); } .pill.t2 { background: var(--t2-bg); color: var(--t2); } .pill.even { background: var(--line); color: var(--ink-2); }
.pill.skip-p { background: var(--warn-bg); color: var(--warn); }
.combine { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.combine label { font-size: 15px; color: var(--ink-2); flex-basis: 100%; }
.combine input { width: 110px; min-height: 48px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--sunken); font-size: 18px; font-weight: 600; text-align: center; }
.together { margin-top: 14px; padding: 14px; border-radius: 12px; background: var(--sunken); border: 1px solid var(--line); }
.together[hidden] { display: none; }
.together h3 { margin: 0 0 4px; font-size: 20px; }
.fade { animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fade { animation: none; } .bar i, .score .track i { transition: none; } }
</style>
</head><body>
<div class="wrap">
  <div class="top" id="top" hidden>
    <button class="back" id="back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    <span class="count" id="count"></span>
    <button class="lang" id="lang2"></button>
  </div>
  <main id="main"></main>
</div>
<script>
(() => {
  // Theme: the trip pages remember Light/Dark per browser under "tripTheme"; light by default.
  try { const t = localStorage.getItem("tripTheme"); document.documentElement.dataset.theme = t === "dark" ? "dark" : "light"; } catch (_) { document.documentElement.dataset.theme = "light"; }

  // Each question: id, kind, w (weight), required, theme, sub, ar {q, sub}, opts [{t, d, t1, t2, why, boost?, ar {t, d, why}}]
  const QUESTIONS = [{"id":"cold","kind":"text","w":2,"q":"When you are cold for a few hours, your mood…","required":true,"theme":"weather","ar":{"q":"عندما {تشعرين|تشعر} بالبرد لبضع ساعات، {مزاجكِ|مزاجك}…"},"opts":[{"t":"Drops","d":"I cannot enjoy anything until I warm up.","t1":3,"t2":0,"why":"Trip 1 is in the south: about 20°C by day and 11–14°C at night. Trip 2 is a real winter: about 10°C by day and 2–4°C at night.","ar":{"t":"يسوء","why":"الرحلة 1 في الجنوب: حوالي 20 درجة نهارًا وبين 11 و14 ليلًا. الرحلة 2 شتاء حقيقي: حوالي 10 درجات نهارًا وبين 2 و4 ليلًا.","d":"لا أستمتع بأي شيء حتى أتدفأ."}},{"t":"Stays fine","d":"As long as I am dressed for it.","t1":1,"t2":1,"why":"Then this does not decide it: both trips work.","ar":{"t":"يبقى جيدًا","why":"إذن هذا لا يحسم الأمر: الرحلتان مناسبتان.","d":"طالما أن ملابسي مناسبة."}},{"t":"Gets better","d":"Cold air makes me feel awake.","t1":0,"t2":3,"why":"Trip 2 is a real winter: about 10°C by day and 2–4°C at night. Crisp and fresh.","ar":{"t":"يتحسن","why":"الرحلة 2 شتاء حقيقي: حوالي 10 درجات نهارًا وبين 2 و4 ليلًا، برد منعش.","d":"الهواء البارد ينعشني."}}]},{"id":"series","kind":"text","w":1,"q":"When you watch a series, you prefer…","theme":"variety","ar":{"q":"عندما {تشاهدين|تشاهد} مسلسلًا، {تفضلين|تفضل}…"},"opts":[{"t":"Short episodes, a new story each time","t1":2,"t2":0,"why":"People who love variety usually enjoy a trip that changes city every few days, like Trip 1.","ar":{"t":"حلقات قصيرة، كل حلقة قصة جديدة","why":"من يحب التنوع يستمتع غالبًا برحلة تغير المدينة كل بضعة أيام، مثل الرحلة 1."}},{"t":"One long story I can sink into","t1":0,"t2":2,"why":"People who love depth usually enjoy settling into fewer places, like Trip 2.","ar":{"t":"قصة واحدة طويلة أندمج فيها","why":"من يحب العمق يستمتع غالبًا بالاستقرار في أماكن أقل، مثل الرحلة 2."}}]},{"id":"shopping","kind":"text","w":1,"q":"The shopping that makes you happiest…","theme":"shop","ar":{"q":"التسوق الذي {يسعدكِ|يسعدك} أكثر…"},"opts":[{"t":"Hunting for deals","d":"Busy markets, gadgets, bargaining.","t1":3,"t2":1,"why":"Trip 1 has Shenzhen's huge electronics markets, Guangzhou's wholesale markets and Hong Kong's street markets.","ar":{"t":"البحث عن العروض","why":"في الرحلة 1 أسواق الإلكترونيات الضخمة في شنتشن، وأسواق الجملة في قوانغتشو، وأسواق الشارع في هونغ كونغ.","d":"أسواق مزدحمة، أجهزة إلكترونية، ومفاصلة."}},{"t":"Browsing small, stylish shops","d":"Design stores, local brands, boutiques.","t1":1,"t2":3,"why":"Shanghai is known for boutiques and local designers on its old, leafy streets.","ar":{"t":"التجول في محلات صغيرة أنيقة","why":"شنغهاي معروفة ببوتيكاتها ومصمميها المحليين في شوارعها القديمة المشجرة.","d":"متاجر تصميم وماركات محلية وبوتيكات."}},{"t":"Big malls with everything","t1":2,"t2":2,"why":"Both trips have huge malls.","ar":{"t":"مولات كبيرة فيها كل شيء","why":"في الرحلتين مولات ضخمة."}}]},{"id":"hotels","kind":"text","w":2,"q":"Packing up and changing hotels every two or three days…","required":true,"theme":"ease","ar":{"q":"حزم الحقائب وتغيير الفندق كل يومين أو ثلاثة…"},"opts":[{"t":"Keeps the trip exciting","t1":3,"t2":1,"why":"Trip 1 moves between four cities, so you change hotels about three times.","ar":{"t":"يجعل الرحلة أكثر إثارة","why":"الرحلة 1 تتنقل بين أربع مدن، فتغيرون الفندق حوالي ثلاث مرات."}},{"t":"Is fine once or twice","t1":1,"t2":2,"why":"Trip 2 has two cities, so one hotel change at most.","ar":{"t":"لا بأس به مرة أو مرتين","why":"الرحلة 2 فيها مدينتان، أي تغيير فندق واحد على الأكثر."}},{"t":"Is tiring: I want to unpack once","t1":0,"t2":3,"why":"Trip 2 can be done from one hotel, with the second city as a day trip or a single move.","ar":{"t":"متعب: أريد أن أفرغ حقيبتي مرة واحدة","why":"الرحلة 2 يمكن أن تكون من فندق واحد، والمدينة الثانية رحلة يوم أو انتقال واحد."}}]},{"id":"remember","kind":"text","w":1,"q":"Which kind of place do you remember longest?","theme":"calm","ar":{"q":"أي نوع من الأماكن يبقى في {ذاكرتكِ|ذاكرتك} أطول؟"},"opts":[{"t":"A place full of life, colour and noise","t1":3,"t2":1,"why":"Trip 1's cities are loud, colourful and full of street life.","ar":{"t":"مكان مليء بالحياة والألوان والضجيج","why":"مدن الرحلة 1 صاخبة وملونة ومليئة بحياة الشارع."}},{"t":"A place so calm and beautiful that I go quiet","t1":1,"t2":3,"why":"Trip 2 has some of China's calmest classic scenery and quiet old streets.","ar":{"t":"مكان هادئ وجميل لدرجة أنني أصمت","why":"في الرحلة 2 بعض أهدأ المناظر الصينية الكلاسيكية وشوارع قديمة هادئة."}}]},{"id":"food","kind":"text","w":2,"q":"Three days into a trip abroad, you are craving…","theme":"food","ar":{"q":"بعد ثلاثة أيام من السفر، {تشتهين|تشتهي}…"},"opts":[{"t":"Food that tastes like home","d":"Arabic grills, shawarma, fresh bread.","t1":3,"t2":1,"why":"Guangzhou's Xiaobei area is the centre of the city's Arab and Middle Eastern restaurants, and Hong Kong has certified halal Middle Eastern places. Trip 2 has fewer.","ar":{"t":"أكلًا بطعم البيت","why":"منطقة شياوبي في قوانغتشو مركز المطاعم العربية والشرق أوسطية في المدينة، وفي هونغ كونغ مطاعم شرق أوسطية حلال معتمدة. في الرحلة 2 خيارات أقل.","d":"مشويات عربية، شاورما، خبز طازج."}},{"t":"Something new at every meal","t1":1,"t2":1,"why":"Both trips have plenty of new food to try.","ar":{"t":"شيئًا جديدًا في كل وجبة","why":"في الرحلتين أكل جديد كثير للتجربة."}},{"t":"Something simple: a bowl of noodles is enough","t1":1,"t2":1,"why":"Halal noodle shops are easy to find on both trips.","ar":{"t":"شيئًا بسيطًا: طبق نودلز يكفي","why":"محلات النودلز الحلال سهلة الوجود في الرحلتين."}}]},{"id":"rhythm","kind":"text","w":1,"q":"On holiday, you like your days to…","ar":{"q":"في الإجازة، {تحبين|تحب} أن يكون {يومكِ|يومك}…"},"opts":[{"t":"Start late and finish late","t1":2,"t2":1,"why":"Trip 1's southern cities come alive in the evening, and the nights are mild.","ar":{"t":"يبدأ متأخرًا وينتهي متأخرًا","why":"مدن الجنوب في الرحلة 1 تنشط في المساء، والليالي معتدلة."}},{"t":"Start early and finish early","t1":1,"t2":2,"why":"On Trip 2 the days are short (dark before 5 pm), so early starts make the most of them.","ar":{"t":"يبدأ مبكرًا وينتهي مبكرًا","why":"في الرحلة 2 النهار قصير (الظلام قبل الخامسة)، فالبداية المبكرة تستغله أفضل."}}]},{"id":"loud","kind":"text","w":1,"q":"After two hours in a loud, packed place, you feel…","theme":"calm","ar":{"q":"بعد ساعتين في مكان صاخب ومزدحم، {تشعرين|تشعر}…"},"opts":[{"t":"Energised","t1":3,"t2":1,"why":"Hong Kong, Guangzhou and Shenzhen are among the densest, busiest cities in the world.","ar":{"t":"بالحيوية","why":"هونغ كونغ وقوانغتشو وشنتشن من أكثر مدن العالم ازدحامًا وحركة."}},{"t":"Fine, then I want a quiet break","t1":1,"t2":1,"why":"Both trips have busy parts and quiet parts.","ar":{"t":"لا بأس، ثم أحتاج إلى استراحة هادئة","why":"في الرحلتين أماكن مزدحمة وأخرى هادئة."}},{"t":"Drained","t1":0,"t2":2,"why":"Trip 2 has more calm places: quiet old streets, gardens and a lake.","ar":{"t":"بالإرهاق","why":"في الرحلة 2 أماكن هادئة أكثر: شوارع قديمة هادئة وحدائق وبحيرة."}}]},{"id":"story","kind":"text","w":1,"q":"Which story interests you more?","ar":{"q":"أي قصة {تثير اهتمامكِ|تثير اهتمامك} أكثر؟"},"opts":[{"t":"How different worlds mixed","d":"Traders, ports, East meeting West.","t1":3,"t2":1,"why":"Hong Kong (once British), Macau (once Portuguese) and Guangzhou (China's old trading port) are all stories of East meeting West.","ar":{"t":"كيف اختلطت عوالم مختلفة","why":"هونغ كونغ (بريطانية سابقًا) وماكاو (برتغالية سابقًا) وقوانغتشو (ميناء الصين التجاري القديم) كلها قصص التقاء الشرق بالغرب.","d":"تجار وموانئ، والتقاء الشرق بالغرب."}},{"t":"Ancient China","d":"Poets, emperors, tea and old dynasties.","t1":1,"t2":3,"why":"Hangzhou was an imperial capital and is the home of Longjing tea, with classical gardens and temples all around.","ar":{"t":"الصين القديمة","why":"هانغتشو كانت عاصمة إمبراطورية وهي موطن شاي لونغجينغ، والحدائق والمعابد التقليدية في كل مكان.","d":"شعراء وأباطرة وشاي وسلالات قديمة."}}]},{"id":"borders","kind":"text","w":2,"q":"Border checks, and switching between three currencies and different phone apps on one trip, feel…","required":true,"theme":"ease","ar":{"q":"نقاط الحدود، والتنقل بين ثلاث عملات وتطبيقات هاتف مختلفة في رحلة واحدة، {تبدو لكِ|تبدو لك}…"},"opts":[{"t":"Like part of the adventure","t1":3,"t2":1,"why":"Trip 1 crosses between Hong Kong, Macau and mainland China: border checks each time and three currencies (Hong Kong dollar, pataca, yuan).","ar":{"t":"جزءًا من المغامرة","why":"الرحلة 1 تعبر بين هونغ كونغ وماكاو والصين: تفتيش حدود في كل مرة وثلاث عملات (دولار هونغ كونغ، الباتاكا، اليوان)."}},{"t":"Tiring: I want it simple","t1":0,"t2":3,"why":"Trip 2 stays in mainland China: one currency, one set of apps, and no border checks after arrival.","ar":{"t":"مرهقة: أريد الأمور بسيطة","why":"الرحلة 2 داخل الصين فقط: عملة واحدة وتطبيقات واحدة، بلا تفتيش حدود بعد الوصول."}}]},{"id":"gallery","kind":"text","w":1,"q":"Your photos from a trip are mostly…","theme":"calm","ar":{"q":"صور {رحلاتكِ|رحلاتك} غالبًا…"},"opts":[{"t":"Lots of busy, colourful moments","t1":2,"t2":0,"why":"Trip 1's cities are made for lively, colourful photos.","ar":{"t":"لحظات كثيرة مزدحمة وملونة","why":"مدن الرحلة 1 مثالية للصور الحيوية الملونة."}},{"t":"Fewer, carefully framed views","t1":0,"t2":2,"why":"Trip 2's old streets, gardens and lake are made for slow, framed photos.","ar":{"t":"مناظر أقل، ملتقطة بعناية","why":"شوارع الرحلة 2 القديمة وحدائقها وبحيرتها مثالية للصور الهادئة المدروسة."}}]},{"id":"water","kind":"text","w":1,"q":"Which do you find more relaxing?","theme":"calm","ar":{"q":"أيهما {تجدينه|تجده} أكثر راحة؟"},"opts":[{"t":"Moving water","d":"Waves, wind, boats going by.","t1":3,"t2":1,"why":"Hong Kong and Macau sit on the sea, with ferries and beaches.","ar":{"t":"الماء المتحرك","why":"هونغ كونغ وماكاو على البحر، فيهما عبّارات وشواطئ.","d":"أمواج ورياح وقوارب تمر."}},{"t":"Still water","d":"A calm surface, and total silence.","t1":1,"t2":3,"why":"Hangzhou's West Lake is one of China's most famous calm landscapes.","ar":{"t":"الماء الساكن","why":"بحيرة الغرب في هانغتشو من أشهر المناظر الهادئة في الصين.","d":"سطح هادئ وصمت تام."}}]},{"id":"day","kind":"text","w":1,"q":"Your ideal holiday day is…","theme":"variety","ar":{"q":"يوم الإجازة المثالي {بالنسبة لكِ|بالنسبة لك}…"},"opts":[{"t":"Full from morning to late night","d":"Lots of different things.","t1":3,"t2":1,"why":"Trip 1 packs four cities, and each is busy until late.","ar":{"t":"مليء من الصباح حتى آخر الليل","why":"الرحلة 1 تجمع أربع مدن، وكل منها نشيطة حتى وقت متأخر.","d":"أشياء كثيرة ومختلفة."}},{"t":"A few beautiful things, slowly","d":"With long breaks in between.","t1":1,"t2":3,"why":"Trip 2 suits a slower pace: strolls, cafés and long walks by the water.","ar":{"t":"أشياء جميلة قليلة، على مهل","why":"الرحلة 2 تناسب الإيقاع الأبطأ: تمشية ومقاهٍ ومشي طويل بجانب الماء.","d":"مع استراحات طويلة بينها."}}]},{"id":"nye","kind":"text","w":1,"q":"At midnight on New Year's Eve, you want to be…","ar":{"q":"عند منتصف ليلة رأس السنة، {تريدين أن تكوني|تريد أن تكون}…"},"opts":[{"t":"In a big crowd, watching a huge show in the sky","t1":3,"t2":0,"why":"Hong Kong's harbour fireworks return this year, and Trip 1 can be planned to be in Hong Kong on 31 December. Shanghai has had no official fireworks since 2016.","ar":{"t":"وسط حشد كبير، نشاهد عرضًا ضخمًا في السماء","why":"الألعاب النارية فوق ميناء هونغ كونغ تعود هذا العام، ويمكن ترتيب الرحلة 1 لنكون في هونغ كونغ ليلة 31 ديسمبر. لا توجد ألعاب نارية رسمية في شنغهاي منذ 2016."}},{"t":"Somewhere calm and warm, just us","t1":1,"t2":2,"why":"Trip 2's New Year's Eve is quieter: city lights, without official fireworks.","ar":{"t":"في مكان هادئ ودافئ، نحن فقط","why":"ليلة رأس السنة في الرحلة 2 أهدأ: أضواء المدينة بلا ألعاب نارية رسمية."}},{"t":"It is just another night to me","t1":1,"t2":1,"why":"Then this does not decide it: both trips work.","ar":{"t":"إنها ليلة عادية بالنسبة لي","why":"إذن هذا لا يحسم الأمر: الرحلتان مناسبتان."}}]},{"id":"walk","kind":"text","w":1,"q":"Which walk do you enjoy more?","ar":{"q":"أي مشي {تستمتعين|تستمتع} به أكثر؟"},"opts":[{"t":"Up and down","d":"Slopes and stairs, with a view at the top.","t1":2,"t2":0,"why":"Hong Kong and Macau are hilly; Shanghai and Hangzhou are flat, apart from the hills around West Lake.","ar":{"t":"صعود ونزول","why":"هونغ كونغ وماكاو مدينتان جبليتان؛ أما شنغهاي وهانغتشو فمستويتان، عدا التلال حول بحيرة الغرب.","d":"منحدرات وسلالم، ومنظر في الأعلى."}},{"t":"Long and flat","d":"Easy streets and promenades.","t1":1,"t2":2,"why":"Shanghai is completely flat; Guangzhou and Shenzhen are mostly flat too.","ar":{"t":"طويل ومستوٍ","why":"شنغهاي مستوية تمامًا، وقوانغتشو وشنتشن مستويتان في معظمها أيضًا.","d":"شوارع سهلة وممشى."}}]},{"id":"evening","kind":"text","w":1,"q":"For a special evening together, you would pick…","theme":"calm","ar":{"q":"لأمسية مميزة معًا، {تختارين|تختار}…"},"opts":[{"t":"A lively place with music and city lights","t1":2,"t2":1,"why":"Trip 1's cities are at their liveliest after dark.","ar":{"t":"مكانًا حيويًا فيه موسيقى وأضواء المدينة","why":"مدن الرحلة 1 في أوج حيويتها بعد حلول الظلام."}},{"t":"A quiet, beautiful spot where we can talk","t1":1,"t2":3,"why":"Trip 2 has quiet, romantic places: old villa streets and the lakeside.","ar":{"t":"مكانًا هادئًا وجميلًا نستطيع فيه الحديث","why":"في الرحلة 2 أماكن هادئة ورومانسية: شوارع الفيلات القديمة وضفاف البحيرة."}}]},{"id":"parks","kind":"text","w":1,"q":"A whole day at a big theme park or safari park is…","ar":{"q":"يوم كامل في مدينة ملاهٍ كبيرة أو حديقة سفاري…"},"opts":[{"t":"A highlight: I would happily do two or three","t1":3,"t2":1,"why":"Trip 1 has Hong Kong Disneyland, Ocean Park and Guangzhou's Chimelong parks, among others; Trip 2 has one, Shanghai Disney.","ar":{"t":"من أجمل الأيام: أحب أن أقضي يومين أو ثلاثة كهذه","why":"في الرحلة 1 ديزني لاند هونغ كونغ وأوشن بارك وحدائق تشيمولونغ في قوانغتشو وغيرها؛ وفي الرحلة 2 حديقة واحدة هي ديزني شنغهاي."}},{"t":"Nice once","t1":1,"t2":1,"why":"Both trips have at least one big park.","ar":{"t":"جميل مرة واحدة","why":"في الرحلت يعة وعملية؛ وشنتشن بُنيت كلها تقريبًا في آخر 40 سنة."}},{"t":"Elegant, classic, refined","t1":1,"t2":3,"why":"Trip 2 is known for elegance: Shanghai's 1920s and 1930s buildings and Hangzhou's classical scenery.","ar":{"t":"أنيق، كلاسيكي، راقٍ","why":"الرحلة 2 معروفة بالأناقة: مباني شنغهاي من العشرينيات والثلاثينيات ومناظر هانغتشو الكلاسيكية."}}]},{"id":"transfers","kind":"text","w":1,"q":"Spending an hour or two on trains, ferries or border queues between cities, several times in one trip…","theme":"ease","ar":{"q":"قضاء ساعة أو ساعتين في القطارات أو العبّارات أو طوابير الحدود بين المدن، عدة مرات في الرحلة…"},"opts":[{"t":"Is fine: I like watching places go by","t1":2,"t2":1,"why":"Trip 1 has several city-to-city journeys (around an hour each, plus border checks).","ar":{"t":"لا بأس: أحب مشاهدة الأماكن من النافذة","why":"في الرحلة 1 عدة تنقلات بين المدن (حوالي ساعة لكل منها، مع تفتيش الحدود)."}},{"t":"Is wasted time: I would rather be somewhere","t1":0,"t2":2,"why":"Trip 2 has one 45-minute fast train between its two cities.","ar":{"t":"وقت ضائع: أفضل أن أكون في مكان ما","why":"في الرحلة 2 قطار سريع واحد مدته 45 دقيقة بين المدينتين."}}]},{"id":"bring","kind":"text","w":1,"q":"What do you most want to bring home?","theme":"shop","ar":{"q":"ما أكثر ما {تريدين|تريد} العودة به؟"},"opts":[{"t":"Full suitcases","d":"Gadgets, clothes and great deals.","t1":3,"t2":1,"why":"Trip 1 is a shopping trip by nature: electronics in Shenzhen, wholesale in Guangzhou, malls and markets in Hong Kong.","ar":{"t":"حقائب ممتلئة","why":"الرحلة 1 رحلة تسوق بطبيعتها: إلكترونيات في شنتشن، وجملة في قوانغتشو، ومولات وأسواق في هونغ كونغ.","d":"أجهزة وملابس وعروض رائعة."}},{"t":"Memories and calm","d":"A few special things, and a rested mind.","t1":1,"t2":3,"why":"Trip 2 is slower, with more time to rest.","ar":{"t":"ذكريات وهدوء","why":"الرحلة 2 أبطأ، وفيها وقت أكثر للراحة.","d":"أشياء قليلة مميزة، وذهن مرتاح."}}]},{"id":"regret","kind":"text","w":2,"q":"On the flight home, which would you regre     QUESTIONS.forEach((Q, i) => { const o = !isSkip(i) && Q.opts[st.a[i]]; if (o && o.boost) boost = { theme: o.boost, o }; });
    QUESTIONS.forEach((Q, i) => {
      if (isSkip(i)) { skipped++; rows.push({ Q, i, skip: true, lean: 0 }); return; }
      const o = Q.opts[st.a[i]]; if (!o) return;
      const w = (Q.w || 1) * (boost && Q.theme === boost.theme ? 2 : 1); a += o.t1 * w; b += o.t2 * w;
      rows.push({ Q, o, i, lean: (o.t1 - o.t2) * w });
    });
    const p1 = Math.round((a / (a + b || 1)) * 100);
    return { p1, p2: 100 - p1, rows, skipped, boost, conf: confOf(p1) };
  }
  const confOf = (p1) => { const m = Math.abs(2 * p1 - 100); return m >= 30 ? "clear" : m >= 12 ? "lean" : "close"; };

  function result(main) {
    $("bar").style.width = "100%"; $("count").textContent = L.done; $("back").hidden = false;
    const r = tally();
    const ans = (x) => x.skip ? L.skipped : tx(x.o, "t");
    const leanPill = (x) => x.skip ? '<span class="pill skip-p">' + esc(L.skipped) + '</span>' :
      '<span class="pill ' + (x.lean > 0 ? "t1" : x.lean < 0 ? "t2" : "even") + '">' + esc(x.lean > 0 ? L.trip.t1 : x.lean < 0 ? L.trip.t2 : L.either) + '</span>';
    const allHTML = '<section class="card sec fade"><h2>' + esc(L.all) + '</h2><div class="why">' + r.rows.map((x) => '<div class="w"><b>' + leanPill(x) + esc(tx(x.Q, "q")) + '</b><p>' + esc(ans(x)) + '</p></div>').join("") + '</div>' +
      '<div class="row"><button class="btn ghost" id="again">' + esc(L.again) + '</button></div></section>';

    // Too many skips: no winner.
    if (r.skipped > MAX_SKIP) {
      main.innerHTML = '<section class="card win none fade"><p class="eyebrow">' + esc(L.noneEyebrow) + '</p><h1>' + esc(L.noneH) + '</h1><p class="line">' + esc(L.noneLine(r.skipped, N)) + '</p>' +
        '<div class="row" style="justify-content:center"><button class="btn" id="review">' + esc(L.noneBtn) + '</button></div></section>' + allHTML;
      $("review").addEventListener("click", () => { st.review = true; let j = 0; while (j < N && !isSkip(j)) j++; st.i = j; save(); render(); window.scrollTo(0, 0); });
      $("again").addEventListener("click", restart);
      return;
    }

    const tie = r.p1 === r.p2, win = r.p1 > r.p2 ? "t1" : "t2", lose = win === "t1" ? "t2" : "t1", sign = win === "t1" ? 1 : -1;
    const tipped = r.rows.filter((x) => x.lean * sign > 0).sort((a, b) => b.lean * sign - a.lean * sign).slice(0, 4);
    const other = r.rows.filter((x) => x.lean * sign < 0).sort((a, b) => a.lean * sign - b.lean * sign).slice(0, 3);
    const whyCard = (x) => '<div class="w"><p class="wq">' + esc(tx(x.Q, "q")) + '</p><b>' + leanPill(x) + esc(ans(x)) + '</b><p>' + esc(tx(x.o, "why")) + '</p></div>';
    const scoreRows = (p1) => '<div class="scores">' + ["t1", "t2"].map((t) => { const v = t === "t1" ? p1 : 100 - p1; return '<div class="score ' + t + '"><span>' + esc(L.trip[t]) + '</span><div class="track"><i data-w="' + v + '"></i></div><span class="n">' + v + '</span></div>'; }).join("") + '</div>';

    let h = '<section class="card win fade"><p class="eyebrow">' + esc(L.eyebrow) + '</p><h1>' + esc(tie ? L.tie : L.trip[win]) + '</h1>' +
      (tie ? "" : '<p class="cities">' + esc(L.cities[win]) + '</p><p class="conf ' + r.conf + '">' + esc(L.conf[r.conf]) + '</p>') +
      '<p class="line">' + esc(tie ? L.tieLine : L.confLine[r.conf]) + '</p>' + scoreRows(r.p1) +
      (r.boost ? '<p class="note">' + esc(L.boostNote(tx(r.boost.o, "t"))) + '</p>' : "") +
      (r.skipped ? '<p class="note">' + esc(L.skipNote(r.skipped)) + '</p>' : "") +
      '<div class="row" style="justify-content:center"><a class="btn wa" id="wa" target="_blank" rel="noopener">' + esc(L.wa) + '</a><button class="btn ghost" id="copy">' + esc(L.copy) + '</button></div></section>';
    h += '<section class="card sec fade"><h2>' + esc(L.combineH) + '</h2><p>' + esc(L.combineP) + '</p><div class="combine"><label for="pin">' + esc(L.combineL) + '</label>' +
      '<input id="pin" type="number" inputmode="numeric" min="0" max="100" value="' + (st.partner == null ? "" : st.partner) + '"><button class="btn" id="comb">' + esc(L.combineBtn) + '</button></div>' +
      '<div class="together" id="tog" hidden></div></section>';
    if (tipped.length) h += '<section class="card sec fade"><h2>' + esc(L.tipped) + '</h2><div class="why">' + tipped.map(whyCard).join("") + '</div></section>';
    if (other.length && !tie) h += '<section class="card sec fade"><h2>' + esc(L.lost(L.trip[lose])) + '</h2><div class="why">' + other.map(whyCard).join("") + '</div></section>';
    main.innerHTML = h + allHTML;
    const grow = (root) => requestAnimationFrame(() => requestAnimationFrame(() => root.querySelectorAll(".track i").forEach((i) => { i.style.width = i.dataset.w + "%"; })));
    grow(main);

    // Combine: the average of the two people's Trip 1 scores.
    function showTogether() {
      const v = parseInt($("pin").value, 10), tog = $("tog");
      if (isNaN(v) || v < 0 || v > 100) { tog.hidden = true; return; }
      st.partner = v; save();
      const c1 = Math.round((r.p1 + v) / 2), cw = c1 === 50 ? null : c1 > 50 ? "t1" : "t2", cc = confOf(c1);
      tog.innerHTML = '<p class="kind">' + esc(L.together) + '</p><h3>' + esc(cw ? L.trip[cw] + " · " + L.cities[cw] : L.tie) + '</h3>' +
        (cw ? '<p class="conf ' + cc + '">' + esc(L.conf[cc]) + '</p>' : "") + '<p class="note" style="margin-top:0">' + esc(L.togetherLine(r.p1, v)) + '</p>' + scoreRows(c1);
      tog.hidden = false; grow(tog);
    }
    $("comb").addEventListener("click", showTogether);
    $("pin").addEventListener("keydown", (e) => { if (e.key === "Enter") showTogether(); });
    if (st.partner != null) showTogether();

    const u = new URL(location.href); u.hash = ""; u.searchParams.delete("g");
    const text = L.share(tie ? L.tie : L.trip[win] + ": " + L.cities[win], tie ? "" : L.conf[r.conf], r, tipped.map((x) => tx(x.Q, "q") + " " + ans(x))) + "\n" + u.href;
    $("wa").href = "https://wa.me/?text=" + encodeURIComponent(text);
    $("copy").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(text); $("copy").textContent = L.copied; } catch (_) { $("copy").textContent = L.copyFail; }
    });
    $("again").addEventListener("click", restart);
  }

  $("back").addEventListener("click", () => { st.review = false; st.i = Math.max(-1, st.i - 1); save(); render(); window.scrollTo(0, 0); });
  $("lang2").addEventListener("click", () => setLang(lang === "ar" ? "en" : "ar"));
  applyLang();
  render();
})();
</script>
<script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script></body></html>
