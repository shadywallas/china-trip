amb skewers)","cost":10,"costEstimate":true,"costBasis":"HKD 80 (55-100) a head: Lanzhou beef noodles about HKD 48-58, plus a lamb skewer or a drink (a drink is cheaper with a meal); Google price band HKD 50-100 (64 reports)","costSource":"https://www.google.com/maps/search/Wu+Zhi+Jian+Beef+Noodles+11A+Hau+Fook+Street+Tsim+Sha+Tsui (Google 4.4 from 100 reviews, HKD 50-100, checked 9 Nov 2026); https://openrice.com/en/hongkong/review/a-new-halal-chinese-restaurant-in-wanchai-e5397500 (Lanzhou beef noodles HKD 48 at the Wan Chai branch)","halal":"halal-certified","halalSource":"https://halalhk.org/ (Board of Trustees of the Islamic Community Fund list, updated 31 Oct 2026; tiers: H = Halal Restaurant, HK = Halal Kitchen, HF = Halal Friendly): Wu Zhi Jian Beef Noodles, G/F, 11A Hau Fook Street, Tsim Sha Tsui, tier H, to 20 Mar 2027","hours":"Daily 11:00 am - 10:00 pm (Google Maps, checked 9 Nov 2026); Saturday 19 Dec and Monday 21 Dec are normal days, so open","note":"Fully halal noodle shop (BOT tier H), clean and quick, rated 4.4 on Google. The gentler choice is the dry one: stir-fried hand-pulled noodles or mixed noodles (拌麵) with beef; the classic Lanzhou beef noodle soup is light too. Ask for chilli on the side (辣椒另上). A lamb skewer or the mutton-skewer bun is a good add-on. For 19 Dec it is a cheap, quick swap for Bushra before the 8:00 pm light show (walk 10 min to the waterfront); for 21 Dec it swaps for Rue du Liban, and Temple Street is about 10 min on foot.","stomach":"easy","stomachWhy":"Plain hand-pulled noodles with beef, chilli on the side; no deep frying","walkMin":7,"walkFrom":"Rue du Liban (or the hotel), 0.5 km","steps":1200,"stepsWhy":"About 7 min on foot from the hotel or from Rue du Liban, then dinner"}]},{"start":"20:30","end":"22:00","type":"shopping","title":"Ladies' Market and Temple Street night market","place":"Temple Street Night Market","igTag":"templestreetnightmarket","steps":4700,"stepsWhy":"Optional: 6 min from dinner to Temple Street, aul's","note":"About 20–25 min (est.). Show the driver 大三巴 (Ruins of St. Paul's) and ask to be dropped as close to the Ruins as possible, so the old town is walked downhill only. The exact drop-off point is not confirmed.","cost":12.42,"costUnit":"group","costEstimate":true,"costBasis":"MOP 100","costSource":"https://www.trip.com/guide/transport/macau-taxi.html (MOP 21 first 1.6 km, MOP 2 per 220 m) and https://macaudailytimes.com.mo/new-taxi-surcharge-starts-today.html (MOP 8 surcharge from Taipa Ferry Terminal); https://routing.openstreetmap.de (OpenStreetMap walking/driving route) (about 9.5 km)","steps":800,"stepsWhy":"Long corridors through Taipa ferry terminal and immigration to the taxi rank"},{"start":"10:45","end":"12:35","type":"sight","title":"Ruins of St. Paul's, then downhill to Senado Square","place":"Ruins of St. Paul's Macau","igTag":"ruinsofstpauls","steps":4000,"stepsWhy":"Taxi drop by the Ruins; about 1 h 50 min on foot downhill only: the Ruins, the lanes and Senado Square, no walk back up","note":"Start at the top and walk only downhill: the Ruins (68 steps), the lanes of Rua de São Paulo and Rua da Palha, then Senado Square. No walking back up."},{"start":"12:45","end":"14:00","type":"meal","mealId":"m-2026-12-22-lunch","meal":"lunch","title":"Lunch: hand-pulled beef noodles at Aladdin Noodle Workshop, Macau","place":"Macau Halal Aladdin Handmade Noodle Workshop (阿拉丁手工麵坊), Rua de Cinco de Outubro 201, Macau (十月初五日街201號)","cuisine":"Halal Lanzhou and Xinjiang noodles (hand-pulled beef noodles, stir-fried noodles, lamb skewers, lamb pilaf)","cost":9,"costEstimate":true,"costBasis":"MOP 70 (50-100) a head: Aladdin handmade beef noodles MOP 40, bamboo-shoot or pickled-cabbage beef noodles MOP 45, stir-fried beef noodles MOP 48, braised beef and potato mixed noodles MOP 52, lamb chop pilaf MOP 78 (menu photo, Nov 2026); Google price band MOP 1-100","costSource":"https://www.google.com/maps/search/Macau+Halal+Aladdin+Handmade+Noodle+Workshop (menu photo dated Nov 2026; Google 4.9 from 17 reviews, checked 9 Nov 2026)","halal":"unconfirmed","halalSource":"Not on the Hong Kong BOT list (https://halalhk.org/, updated 31 Oct 2026; its Macau entries are only Zam Zam, Dong Lai Shun, Vegetarian Farm and hotel outlets). Google lists it as a halal restaurant, the printed menu carries a \"Halal certified\" logo, and Muslim reviewers from Sep-Nov 2026 call it halal (https://www.google.com/maps/search/Macau+Halal+Aladdin+Handmade+Noodle+Workshop); the certifying body is not shown","hours":"Daily 9:00 am - 11:00 pm (Google Maps, checked 9 Nov 2026); Tuesday 22 Dec is a normal day, so open","note":"New, clean halal noodle shop with kind staff (rated 4.9, reviews Sep-Nov 2026). The gentler choice is dry: stir-fried beef noodles (MOP 48) or braised beef and potato mixed noodles (MOP 52); the plain Aladdin beef noodle soup (MOP 40) has a mild bone broth. Add a lamb skewer. Ask for chilli on the side (辣椒另上) and skip the Xinjiang big-plate chicken (spicy). Ask to see the halal certificate on the wall. 7 min from Senado Square, west along Avenida de Almeida Ribeiro. Replaces Loulan Islam Restaurant two doors away (169 Rua de Cinco de Outubro), which is rated only 3.9 on Google, is cash only, has reviews calling it overpriced, and had its halal status questioned on OpenRice. Egg tarts: ask Lord Stow's/Margaret's if the pastry uses lard (豬油); skip if unsure.","stomach":"easy","stomachWhy":"Hand-pulled noodles with beef in a mild broth or stir-fried, chilli on the side","move":{"mode":"walk","minutes":7,"cost":0,"costUnit":"person","local":"","route":"Senado Square west along Avenida de Almeida Ribeiro, then right into Rua de Cinco de Outubro to No. 201","source":"https://routing.openstreetmap.de (OpenStreetMap walking route) (0.55 km, 7 min)","estimate":true},"steps":800,"stepsWhy":"7 min (0.55 km) west from Senado Square, then lunch","alts":[{"id":"puffin-cafe","title":"Lunch: vegetarian café at Puffin Café, Macau","place":"Puffin Ca irymountain","note":"About 1,900 m up: −5°C to 8°C in winter, windy on the open meadow and colder after 4:00 pm. Wear a winter coat, hat, gloves and waterproof shoes. Snow on the meadow is not certain (the first snow fell on 25 Dec in 2019); the ski area makes its own snow and its season usually opens 21–23 Dec. What to do: walk the meadow; the small sightseeing train (about CNY 25, not confirmed for December) runs from the gate to the meadow and the horse ranch; horse riding, karts, snow tubing and sledding are paid on site. Winter closing time is unclear (sources say 4:00 pm or 5:30 pm): ask the tour.","place":"Fairy Mountain Chongqing","start":"14:30","steps":5000,"stepsWhy":"About 3 h walking the meadow at an easy pace (3.5–4 km). About 1,500 fewer if you ride part of the loop on the sightseeing train; 13,000 or more for the full 10 km hike.","title":"Fairy Mountain meadow","type":"sight","freezing":true,"freezingWhy":"Typically 0°C at Fairy Mountain (about 1,830 m) from 2:30 pm to 5:30 pm on this date: 0°C or colder in 6 of the last 11 years, coldest −2°C, warmest 5°C. Source: Open-Meteo weather history, 2015–2025."},{"end":"20:00","note":"Skip this if you stay the night at Fairy Mountain for Saturday. Ask the driver to drop you at the restaurant on Zhongxing Road, Jiaochangkou, on the way in.","start":"17:30","steps":300,"stepsWhy":"One rest stop on the drive","title":"Drive back to Chongqing","type":"transit"},{"cost":12,"costBasis":"CNY 85 (70-120)","costEstimate":true,"costSource":"https://www.trip.com/restaurant/china/chongqing/detail/yilanmusi-chongqing-halal-hot-pot-127757410/","cuisine":"Halal Chongqing hotpot (beef, lamb, sliced fish)","end":"21:45","halal":"muslim-owned","halalSource":"https://www.trip.com/restaurant/china/chongqing/detail/yilanmusi-chongqing-halal-hot-pot-127757410/ (清真 in name); https://www.islamichinatravel.com/destination-guide/chongqing/chongqing-halal-restaurants/ (listed as 伊兰山城马队长清真火锅, clean halal hotpot)","hours":"Daily 10:30 am - 2:30 am (Trip.com)","igTag":"chongqinghotpot","image":"img/ffe80e35a1664c379825a4f81ebe8cf7.jpg","imageCaption":"Yilanmusi storefront and its halal beef, lamb skewers and mala pot","imageKind":"restaurant","imageSource":"https://halalchinatrips.com/travel-guide/halal-food-planning/halal-food-in-chongqing/","meal":"dinner","mealId":"m-2026-12-25-dinner","move":{"cost":0,"costUnit":"group","estimate":true,"local":"","minutes":0,"mode":"car","route":"Ask the tour driver to drop you on Zhongxing Road, Jiaochangkou, on the way back into Yuzhong (about 1 km before the hotel; not yet confirmed with the operator). Walk about 10 min back to the hotel after dinner.","source":"estimate"},"note":"The one Chongqing hotpot of the trip. Open until 2:30 am, so a late 8:15 pm arrival from Wulong is safe. Halal beef, lamb and thin-sliced fish; ask for a yuanyang split pot with one mild (清汤) side.","place":"伊兰穆斯重庆清真火锅 Yilanmusi Chongqing Halal Hot Pot, 7-3 Zhongxing Road (next to the Muslim Building), Jiaochangkou, Yuzhong","replacedNote":"Zhen Yishun's ground floor is a noodle shop that closes at 9 pm, too late for an 8:15 pm hotpot.","start":"20:15","steps":1100,"stepsWhy":"The tour car drops you at the restaurant; dinner, then about 10 min walk back to the hotel","stomach":"rough","stomachWhy":"Chongqing hotpot: beef tallow and chilli, even with a split pot","title":"Dinner: halal hotpot at Yilanmusi","type":"meal"}],"order":10,"summary":"Full private day trip to the karst bridges and the Fairy Mountain meadow.","title":"Wulong: bridges and Fairy Mountain"}],["d-2026-12-26",{"date":"2026-12-26","city":"cq","title":"Saturday: still exploring","summary":"Pick one option. The timeline below is the city version; Fairy Mountain, Wulingshan or Dazu replace the whole day.","order":11,"items":[{"start":"08:30","end":"09:30","type":"meal","title":"Breakfast: croissant and coffee at the hotel or nearby","cost":10.49,"costEstimate":false,"note":"Four Points buffet, US$10.49 each: croiss rst 3 km, about 2.5 per km after)","estimate":true},"steps":5700,"stepsWhy":"About 600 m from the train to the DiDi pick-up at Hangzhou East, then about 2 h on foot at Feilai Feng and Lingyin Temple with their stairs (lunch not counted)","note":"Hangzhou plan, Lingyin first while it is quieter: Feilai Feng's stone carvings and caves, then Lingyin Temple's halls up the hillside, with lunch at the temple's vegetarian kitchen. The Lingyin Feilai Feng scenic area is free since 1 Dec 2025 but must be booked at least a day ahead in the 杭州灵隐飞来峰 mini-program. Optional saving: skip the upper terraces above the main hall (about 1,000 fewer steps)."},{"start":"13:00","end":"14:05","type":"meal","mealId":"m-2026-12-30-lunch","meal":"lunch","title":"Lunch: pasta or pizza at WL Bistro, Four Seasons by West Lake","place":"WL Bistro 西湖餐厅, Four Seasons Hotel Hangzhou at West Lake (杭州西子湖四季酒店), 5 Lingyin Road (灵隐路5号), Xihu District, Hangzhou","cuisine":"Italian (house-made pasta, pizza, risotto)","cost":32,"costEstimate":true,"costRange":[28,42],"costBasis":"CNY 230 (200-300) incl. 15% service · Italian hotel bistro (estimate; a 2020 report put the Italian set for two at CNY 468)","costSource":"https://hznews.hangzhou.com.cn/jingji/content/2020-09/22/content_7818092_2.htm (Italian set for two CNY 468 in 2020); https://opentable.com.au/r/wl-bistro-four-seasons-hangzhou-at-west-lake-hangzhoushi (US$31-50 band)","halal":"italian","halalSource":"https://www.fourseasons.com/hangzhou/dining/restaurants/wlb/ (Italian: house-made pasta, pizza, risotto; hotel kitchen, no halal certificate)","hours":"6:30 am to 10 pm daily (Trip.com listing; phone +86 571 8113 5188)","note":"Order pasta or pizza without pork (no ham, bacon, prosciutto, salami, pancetta). A margherita or mushroom pizza, a tomato or seafood pasta, or a risotto. A warm, quiet sit-down by the hotel's pond after the temple stairs, on the way from Lingyin to the lake. Book a table for 1 pm.","issue":"The lunch price is an estimate: n ve":"04:50","arriveNextDay":true,"durationMin":995,"cabin":"Economy, 40 kg bag each","includedIn":"ey-out","status":"agreed","note":"2h 15m change in Abu Dhabi. Leave for Pudong by about 3:15 pm."}],"visas":[{"id":"china-l","place":"Mainland China","title":"Tourist (L) visa, single entry, VIP service","required":true,"status":"needed","cost":168.86,"costEstimate":true,"costLabel":"9,120 EGP for two, VIP","summary":"Needed for the train into mainland China at West Kowloon on 24 Dec. Egypt is not on China's visa-free or 240-hour transit lists. We are taking the VIP service to skip the queue. Apply in person in Cairo; both of you should go.","facts":[["Cost each","4,560 EGP (about US$84): visa fee 400 EGP (reduced until 31 Dec 2026) + Regular service fee 2,080 EGP + VIP service 2,080 EGP to skip the queue."],["Processing","About 4 working days for Regular; the centre works Sunday to Thursday. Ask whether VIP is also faster. Fingerprints are waived until 31 Dec 2026 and no appointment is needed."],["Apply by","Online form by Sun 22 Nov, hand in 22–26 Nov (recommended). Latest safe date: Thu 3 Dec."],["Where","Chinese Visa Application Service Center, Dokki, Cairo. Hand in 9 am – 12 pm, collect 1 pm – 4 pm. Phone 02 3748 3425."],["Validity","Usually 3 months to enter; you need a stay of 10 days (24 Dec – 3 Jan)."],["On arrival","Fill in China's free online arrival card (NIA website, 12367 app, WeChat or Alipay) before 24 Dec."]],"documents":["Passport valid at least 6 months (keep both valid to July 2027 to be safe), with two consecutive blank pages and no damage","Online application form, printed approval certificate","Photo 48 × 33 mm, light background","Round-trip flight booking record (the centre advises buying tickets after the visa is issued)","Hotel reservations for Chongqing and Shanghai (refundable bookings; addresses and dates must match the form)","Detailed day-by-day itinerary","Employment certificate","Recent bank statement in English with the holder's name and currency; for the partner's account, an English marriage certificate"],"steps":["Create an account on the Cairo visa centre website and fill in the online form; upload the documents","Wait for the online review; fix and resubmit if it shows Rejected","When it shows Approved, print the certificate","Go to the centre with the certificate, passports and photos, and pay","Collect the passports about 4 working days later"],"sources":[{"label":"Visa fee (Chinese Embassy)","url":"https://eg.china-embassy.gov.cn/eng/ywzn/lsyw/zytz/202512/t20251231_11796187.htm"},{"label":"Service fee from 1 Oct","url":"https://bio.visaforchina.cn/CAI4_EN/tongzhigonggao/553119309547835439.html"},{"label":"L visa documents","url":"https://bio.visaforchina.cn/CAI4_EN/qianzhengyewu/jichuzhishi/banliliucheng/553119309547835404.html"},{"label":"Cairo rules (20 Oct)","url":"https://bio.visaforchina.cn/CAI4_EN/tongzhigonggao/553119309573001241.html"},{"label":"Online arrival card","url":"https://s.nia.gov.cn/ArrivalCardFillingPC/"}]},{"id":"hong-kong","place":"Hong Kong","title":"No visa needed, up to 90 days","required":false,"status":"not_needed","cost":0,"summary":"Egyptian passports enter Hong Kong visa-free for up to 90 days. There is no arrival card and no pre-arrival registration.","sources":[{"label":"Hong Kong Immigration","url":"https://www.immd.gov.hk/eng/services/visas/visit-transit/visit-visa-entry-permit.html"}]},{"id":"macau","place":"Macau","title":"No visa needed, up to 90 days","required":false,"status":"not_needed","cost":0,"summary":"Egypt is on Macau's visa-exempt list. At the border you may be asked for a passport valid 90 days beyond the stay, the return ferry ticket and proof of funds of MOP 5,000 (about US$620; a bank card or cash).","sources":[{"label":"Macau government","url":"https://www.gov.mo/en/services/ps-1474/ps-1474b/"}]}],"visaNote":"Exchange rate 1 US$ = 54.01 EGP (Central Bank of Egypt, 5 Nov 2026), so US$ amounts are approximate."},"todo":{"checkedOn":"2026-   const cols = { activities: () => D.acts.map((a) => mk(a.id, a)), days: () => D.days.map(([id, d]) => mk(id, d)), choices: choiceDocs, considered: () => (D.considered || []).map((e) => mk(e.id, e)) };
  const docs = { 'meta/trip': D.meta.trip, 'meta/travel': D.meta.travel, 'meta/todo': D.meta.todo, 'meta/localfood': D.meta.localfood };
  const choiceListeners = [];
  const db = {
    collection: (p) => ({ onSnapshot: (cb) => { if (p === 'choices') choiceListeners.push(cb); setTimeout(() => cb({ docs: (cols[p] || (() => []))(), metadata: { fromCache: false } }), 0); return () => {}; } }),
    doc: (p) => ({
      onSnapshot: (cb) => { setTimeout(() => cb(mk(p.split('/')[1], docs[p] || null)), 0); return () => {}; },
      set: async (v) => {
        if (!p.startsWith('choices/')) return;
        mine[p.slice(8)] = v.optionId; try { localStorage.setItem(KEY, JSON.stringify(mine)); } catch (_) {}
        choiceListeners.forEach((cb) => cb({ docs: choiceDocs(), metadata: { fromCache: false } }));
      },
    }),
  };
  window.claude = { use: async (n) => (n === 'db' ? db : n === 'user' ? { can: async () => true } : null) };
})();

* { box-sizing: border-box; }
html, body { overflow-x: clip; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap {
  max-width: 980px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
  display: grid; gap: 20px;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(28px, 4.5vw, 34px); }
b, strong { font-weight: 600; }
.eyebrow { font-size: 13px; font-weight: 500; color: var(--muted); }
a { color: var(--accent); }
a:hover { color: var(--accent-press); }
a:focus-visible, summary:focus-visible, button:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: 10px; }
.opt input:focus-visible + .opt-body, .m-alt:has(input:focus-visible) { box-shadow: var(--focus-ring); }
/* White bands across the full width, as on the canvas: title band at the top, sticky tab band below */
/* Light / Dark switch, top right of the title band */
.head-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.theme-sw { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--line-soft); }
.theme-sw button { font: inherit; font-size: 13px; font-weight: 500; color: var(--muted); min-height: 32px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
@media (max-width: 480px) { .head-top { flex-wrap: nowrap; } .theme-sw { flex: none; } .theme-sw button { padding: 0 9px; } .theme-sw .t { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } }
.theme-sw button svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.theme-sw button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--shadow-sel); }
:root[data-theme="dark"] .theme-sw button[aria-pressed="true"], :root[data-theme="dark"] .tab[aria-selected="true"], :root[data-theme="dark"] .ml-f[aria-pressed="true"] { background: var(--line); }
.vhead::after { content: ""; position: absolute; left: -100vmax; right: -100vmax; bottom: 0; height: 1px; background: var(--line); }
.sub { color: var(--ink-2); max-width: 64ch; margin: 0; }

/* Trip total card */
.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 18px 20px; display: grid; gap: 14px; }
.sum-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; }
.sum-top .eyebrow { font-size: 14px; }
.sum-top .value { font-size: clamp(26px, 4vw, 30px); font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
.sum-bar { display: flex; gap: 2px; height: 8px; border-radius: 999px; overflow: hidden; background: var(--line-soft); }
.sum-bar span { display: block; height: 100%; min-width: 3px; }
.sum-legend { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 24px; font-size: 13px; color: var(--ink-2); }
.sum-legend span { display: flex; align-items: center; gap: 8px; min-width: 0; }
.sum-legend i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.sum-legend b { margin-left: auto; color: var(--ink); }
.sum-cities { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 16px; padding-top: 12px; border-top: 1px solid var(--line-soft); }
.sum-cell { display: grid; grid-template-rows: 1fr auto; gap: 2px; min-width: 0; }
.sum-cell .label { font-size: 12px; font-weight: 500; color: var(--muted); }
.sum-city .value { font-size: 16px; font-weight: 600; }
.sum-city .label::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--city); margin-right: 6px; vertical-align: 1px; }
.sum-tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 14px; color: var(--muted); padding-top: 12px; border-top: 1px solid var(--line-soft); }
.sum-foot { display: contents; }
.sum-allin { margin-left: auto; font-weight: 600; font-size: 14px; }
.sum-allin a { text-decoration: none; }
@media (max-width: 640px) {
  .summary { padding: 16px; }

  .sum-allin { margin-left: 0; width: 100%; }
}
.notice { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px 14px 48px; font-size: 14px; display: grid; gap: 2px; color: var(--ink-2); position: relative; }
.notice::before { content: ""; position: absolute; left: 14px; top: 13px; width: 24px; height: 24px; border-radius: 50%; background: var(--b-purple-bg) center / 14px no-repeat; }
.notice::after { content: ""; position: absolute; left: 19px; top: 18px; width: 14px; height: 14px; background: var(--b-purple); -webkit-mask: var(--i-clock) center / contain no-repeat; mask: var(--i-clock) center / contain no-repeat; }
.notice strong { color: var(--ink); font-size: 14px; }
.state { background: var(--surface); border: 1px dashed var(--line); border-radius: 16px; padding: 28px 20px; text-align: center; color: var(--muted); }

/* Tabs */
.tabs-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--surface); box-shadow: 0 0 0 100vmax var(--surface); clip-path: inset(0 -100vmax); display: grid; gap: 8px; padding-block: 10px; }
.tabs, .daybar { scrollbar-width: none; }
.tabs::-webkit-scrollbar, .daybar::-webkit-scrollbar { display: none; }
.tabs { display: flex; gap: 4px; overflow-x: auto; padding: 4px; border-radius: 12px; background: var(--line-soft); }
.tab {
  flex: none; font: inherit; font-weight: 500; font-size: 14px; color: var(--ink-2); cursor: pointer;

  display: inline-flex; align-items: center; gap: 8px;

.tab:hover { color: var(--ink); }

.city-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 6px 16px; }
.city-head h2 { font-size: 26px; display: flex; align-items: center; gap: 10px; }
.city-head h2::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--city); flex: none; }
.city-head .meta { color: var(--muted); font-size: 14px; margin-top: 2px; }
.city-head .sub-total { font-size: 15px; font-weight: 600; text-align: right; }
.panel { display: grid; gap: 16px; }
@media (max-width: 560px) { .city-head .sub-total, .city-head .sub-total small { text-align: left; } }
.legend { display: flex; flex-wrap: wrap; gap: 8px 12px; font-size: 12.5px; color: var(--muted); align-items: center; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.legend .key { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.legend .halal { margin-left: 0; }

/* Day card */
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; scroll-margin-top: 130px; box-shadow: var(--shadow); }
.day-head { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.stub { display: grid; justify-items: center; text-align: center; line-height: 1.15; }
.stub .dow { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
.stub .d { font-size: 24px; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; }
.stub .m { font-size: 11px; color: var(--muted); font-weight: 500; }
.stub::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--city); margin-top: 3px; }
.day-head h3 { font-size: 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.day-head h3 .chip { letter-spacing: 0; }
.day-head .sum { font-size: 14px; color: var(--muted); margin-top: 2px; }
.day-head .cost { text-align: right; font-size: 15px; font-weight: 600; white-space: nowrap; }
.day-head .cost small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
@media (max-width: 560px) { .day-head { grid-template-columns: 44px minmax(0, 1fr) auto; align-items: start; padding: 14px; gap: 4px 10px; } .stub .d { font-size: 22px; } .day-head h3 { font-size: 18px; } }

.tl { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: 132px 32px minmax(0, 1fr) auto; gap: 2px 12px; padding: 14px 20px; align-items: start; position: relative; }
.row + .row { border-top: 1px solid var(--line-soft); }
.row .time { font-size: 13px; color: var(--muted); padding-top: 6px; white-space: nowrap; }
.row .time { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
.row .time .from { color: var(--ink); font-weight: 600; }
.row .dur { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); color: var(--muted); background: var(--surface); font-size: 10.5px; font-weight: 600; letter-spacing: -.02em; margin-top: -3px; }
.row .time .to { display: block; font-size: 13px; }
.row .ic { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--k) 12%, var(--surface)); color: color-mix(in srgb, var(--k) 70%, var(--ink)); }
.row .ic svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.row { --k: var(--k-free); }
.row.t-meal { --k: var(--k-meal); }
.row.t-activity { --k: var(--k-ticket); }
.row.t-travel, .row.t-transit { --k: var(--k-move); }
.row.t-shopping { --k: var(--k-shop); }
.row.t-sight { --k: var(--k-sight); }
.row.t-hotel, .row.t-stay { --k: var(--k-hotel); }
.row .main { display: grid; gap: 4px; min-width: 0; }
.row .kind { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
.row .kind::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--k); }
.row .title { font-weight: 600; font-size: 15px; line-height: 1.35; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.row .note { font-size: 13px; line-height: 1.45; color: var(--muted); }
.row .stp { display: flex; gap: 6px; align-items: baseline; font-size: 12.5px; line-height: 1.4; color: var(--muted); }
.row .stp b { flex: none; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.row .stp svg, .steps-chip svg { width: 14px; height: 14px; flex: none; align-self: center; fill: currentColor; stroke: none; }
.steps-chip { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; line-height: 1; white-space: nowrap; color: var(--sf); background: var(--sb); }
.lv-light { --sf: var(--b-green); --sb: var(--b-green-bg); }
.lv-mod { --sf: var(--b-blue); --sb: var(--b-blue-bg); }
.lv-heavy { --sf: var(--b-orange); --sb: var(--b-orange-bg); }
.lv-vheavy { --sf: var(--b-red); --sb: var(--b-red-bg); }
.stp-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 10px; box-shadow: var(--shadow); margin-bottom: 16px; }
.stp-card h2 { margin: 0; font-size: 17px; }
.stp-card p { margin: 0; font-size: 13px; line-height: 1.45; color: var(--muted); }
.stp-rows { display: grid; gap: 4px; }
.stp-rows a { display: grid; grid-template-columns: 52px 1fr 64px; gap: 10px; align-items: center; color: inherit; text-decoration: none; font-size: 13px; padding: 2px 0; }
.stp-rows a:hover .stp-bar i { filter: brightness(.95); }
.stp-rows .dt { color: var(--ink-2); font-weight: 600; white-space: nowrap; }
.stp-rows .n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.stp-bar { height: 12px; border-radius: 6px; background: var(--b-grey-bg); overflow: hidden; display: flex; }
.stp-bar i { display: block; height: 100%; border-radius: 6px; background: var(--sf); }
.stp-rows .city-gap { height: 6px; }
.stp-bar i.o { opacity: .35; border-radius: 0 6px 6px 0; }
.steps-chip .o { font-weight: 500; opacity: .85; }
.opt-tag { display: inline-block; margin-left: 4px; padding: 1px 7px; border-radius: 999px; border: 1px dashed var(--line); font-size: 11px; font-weight: 600; color: var(--muted); }
.stp-legend { display: flex; flex-wrap: wrap; gap: 6px; }
.row .right { text-align: right; display: grid; justify-items: end; gap: 4px; }
.pp { --c: var(--ink); display: inline-block; font-size: 14px; font-weight: 600; line-height: 1.3; white-space: nowrap; color: var(--ink); }
.pp-none { color: var(--muted); font-weight: 500; }
.pcap { font-size: 12px; color: var(--muted); white-space: nowrap; }
.rate-m { display: none; }
.opt-prox { font-size: 12.5px; font-weight: 600; color: var(--ok); }
/* Hotel badges: star (or Trip.com diamond) rating and a bidet icon */
.hb { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.hb-stars { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 999px; background: var(--b-grey-bg); color: var(--b-grey); }
.hb-stars i { font-style: normal; letter-spacing: 1px; font-size: 10px; }
.hb-bidet { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px 0 6px; border-radius: 999px; background: var(--b-blue-bg); color: var(--b-blue); }
.ups { display: grid; gap: 6px; }
.ups > b { font-size: 13px; }
.ups-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.up { background: var(--sunken); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; align-content: start; min-width: 0; }
.up strong { font-size: 13.5px; line-height: 1.3; }
.up .up-price { font-size: 16px; font-weight: 700; white-space: nowrap; }
.up .up-price small { font-size: 12px; font-weight: 500; color: var(--muted); }
.up .up-more { font-size: 12px; font-weight: 600; color: var(--b-orange); }
.up .up-more.less { color: var(--ok); }
.up small.up-facts { font-size: 12px; color: var(--muted); }
.opt-ups { display: block; font-size: 12.5px; color: var(--muted); }
.hguide { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 0 10px; }
.hguide > div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 1px; min-width: 0; }
.hguide span { font-size: 12px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.hguide span svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hguide b { font-size: 17px; font-weight: 700; }
.hguide small { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hguide-note { font-size: 12px; color: var(--muted); margin: -4px 0 10px; }
.hb-bidet svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Status badges: icon + label (the design's icon circles, with the word kept for clarity) */
.chip, .halal, .opt-title .rec { --bb: var(--b-grey-bg); --bf: var(--b-grey); --ic: var(--i-minus);
  display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px 0 4px; border-radius: 999px; white-space: nowrap;
  font-size: 12px; font-weight: 600; line-height: 1; letter-spacing: 0; text-transform: none; background: var(--bb); color: var(--bf); vertical-align: middle; }
.chip::before, .halal::before, .opt-title .rec::before { content: ""; width: 18px; height: 18px; flex: none; background: currentColor; -webkit-mask: var(--ic) center / 14px no-repeat; mask: var(--ic) center / 14px no-repeat; }
.chip.ice { --bb: var(--b-blue-bg); --bf: var(--b-blue); --ic: var(--i-snow); }
.row .kind .chip.ice { margin-left: 6px; }
.chip.final { --bb: var(--b-green-bg); --bf: var(--b-green); --ic: var(--i-check); }
.chip.exploring { --bb: var(--b-orange-bg); --bf: var(--b-orange); --ic: var(--i-help); }
.chip.available { --bb: var(--b-green-bg); --bf: var(--b-green); --ic: var(--i-ticket); }
.chip.not_released { --bb: var(--b-purple-bg); --bf: var(--b-purple); --ic: var(--i-clock); }
.chip.sold_out { --bb: var(--b-red-bg); --bf: var(--b-red); --ic: var(--i-x); }
.chip.unverified { --bb: var(--b-grey-bg); --bf: var(--b-grey); --ic: var(--i-help); box-shadow: inset 0 0 0 1.5px var(--line); }
.chip.skip { --bb: var(--b-grey-bg); --bf: var(--b-grey); --ic: var(--i-minus); }
.chip.free { --bb: var(--b-blue-bg); --bf: var(--b-blue); --ic: var(--i-ticket); }
.chip.agreed { --bb: var(--b-blue-bg); --bf: var(--b-blue); --ic: var(--i-bookmark); }
.chip.booked { --bb: var(--b-green-bg); --bf: var(--b-green); --ic: var(--i-check); }
.chip.needed { --bb: var(--b-orange-bg); --bf: var(--b-orange); --ic: var(--i-alert); }
.chip.not_needed { --bb: var(--b-green-bg); --bf: var(--b-green); --ic: var(--i-check); }
.stm { display: inline-flex; align-items: center; height: 26px; margin-left: 6px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; line-height: 1; letter-spacing: 0; text-transform: none; vertical-align: middle; white-space: nowrap; }
.stm.s-easy { color: var(--b-blue); background: var(--b-blue-bg); }
.stm.s-rough { color: var(--b-orange); background: var(--b-orange-bg); }
.m-row .stm, .m-alt .stm { margin-left: 0; }
.ml-gut { display: grid; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; font-size: 13.5px; color: var(--ink-2); box-shadow: var(--shadow); }
.ml-gut b { font-size: 15px; color: var(--ink); }
.ml-gut .bar { display: flex; gap: 3px; flex-wrap: wrap; margin: 4px 0 2px; }
.ml-gut .bar i { width: 14px; height: 14px; border-radius: 4px; background: var(--b-blue-bg); border: 1px solid color-mix(in srgb, var(--b-blue) 30%, transparent); }
.ml-gut .bar i.r { background: var(--cq); border-color: var(--cq); }
.ml-gut .bar i.gap { width: 6px; background: none; border: 0; }
.ml-gut ul { margin: 0; padding-left: 18px; color: var(--muted); }
.ml-day > h3 .rough { font-size: 12px; font-weight: 600; color: var(--b-orange); letter-spacing: 0; }
.chip.swapped { --bb: var(--b-blue-bg); --bf: var(--b-blue); --ic: var(--i-swap); }
.opt-title .rec { --bb: var(--b-blue-bg); --bf: var(--b-blue); --ic: var(--i-star); font-size: 0; }
.opt-title .rec::after { content: "Suggested"; font-size: 12px; }
.halal { --ic: var(--i-moon); margin-left: 6px; }
.halal.h-halal-certified { --bb: var(--b-solid-green); --bf: #ffffff; }
.halal.h-muslim-owned { --bb: var(--b-green-bg); --bf: var(--b-green); }
.halal.h-vegetarian { --bb: var(--b-lime-bg); --bf: var(--b-lime); --ic: var(--i-leaf); }
.halal.h-pork-free, .halal.h-halal-friendly, .halal.h-italian { --bb: var(--b-amber-bg); --bf: var(--b-amber); }
.ml-local > p { margin: -4px 0 0; font-size: 13.5px; color: var(--muted); max-width: 72ch; }
.chip.must { --bb: var(--b-orange-bg); --bf: var(--b-orange); --ic: var(--i-star); }
.halal.h-unconfirmed { --bb: var(--b-grey-bg); --bf: var(--muted); box-shadow: inset 0 0 0 1.5px var(--subtle); }
.halal.h-not-halal { --bb: var(--b-red-bg); --bf: var(--b-red); --ic: var(--i-x); }
.row .kind .halal { margin-left: 2px; }

.stays { display: grid; gap: 12px; }
.stay { --c: var(--k-hotel); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; display: grid; gap: 10px; scroll-margin-top: 130px; transition: box-shadow .4s; box-shadow: var(--shadow); }
.stay.flash { box-shadow: var(--focus-ring); }
.stay.empty { border-style: dashed; box-shadow: none; }
.stay-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.stay-eyebrow { font-size: 13px; font-weight: 600; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stay-price { display: grid; justify-items: end; gap: 2px; }
.stay-name { font-size: 22px; }
.stay-room { color: var(--muted); font-size: 14px; margin-top: -6px; }
.stay-dates { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stay-when { background: var(--sunken); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; display: grid; gap: 0; text-decoration: none; color: var(--ink); }
.stay-when:hover { color: var(--ink); border-color: var(--subtle); }
.stay-when span { font-size: 12px; font-weight: 600; color: var(--muted); }
.stay-when b { font-size: 15px; }
.stay-when small { font-size: 12.5px; color: var(--muted); }
.stay-facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13.5px; color: var(--ink-2); }
.stay-facts span::before { content: "•"; color: var(--subtle); margin-right: 6px; }
.stay-why { margin: 0; font-size: 13.5px; color: var(--muted); }
.stay-walk { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
.stay-walk b { font-size: 12px; margin-right: 2px; }
.wchip { padding: 4px 10px; border-radius: 999px; background: var(--b-grey-bg); color: var(--ink-2); font-weight: 500; max-width: 100%; overflow-wrap: anywhere; }
.stay details > summary .hint { margin-left: 6px; }
.row.t-stay { background: var(--sunken); }
.stay-ref { color: var(--accent); font-weight: 600; font-size: 13.5px; text-decoration: none; }
.stay-ref:hover { text-decoration: underline; }
.day-head .cost small.night { color: var(--muted); }
.city-head .sub-total small { display: block; font-size: 12.5px; font-weight: 400; color: var(--muted); text-align: right; }
.leg { display: grid; grid-template-columns: 132px 32px minmax(0, 1fr) auto; gap: 0 12px; align-items: center; padding: 2px 20px; position: relative; font-size: 13px; color: var(--muted); }
.leg::before { content: ""; grid-column: 1; }
.leg-ic { grid-column: 2; justify-self: center; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--subtle); }
.leg-ic svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.leg-main { grid-column: 3; display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; min-width: 0; }
.leg-main b { font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.leg-route { min-width: 0; }
.leg-warn { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px 0 7px; border-radius: 999px; background: var(--b-red-bg); color: var(--b-red); font-size: 12px; font-weight: 600; }
.leg-warn::before { content: ""; width: 14px; height: 14px; background: currentColor; -webkit-mask: var(--i-timer) center / contain no-repeat; mask: var(--i-timer) center / contain no-repeat; }
.leg .pp { font-size: 13px; grid-column: 4; color: var(--ink-2); }
.leg-free { grid-column: 4; font-size: 12px; }
.row + .leg, .leg + .row { border-top: 0; }
.leg + .row { border-top: 1px dashed var(--line); }
.row + .leg { border-top: 1px dashed var(--line); padding-top: 8px; }
.leg { padding-bottom: 8px; }
@media (max-width: 560px) {
  .row { grid-template-columns: 32px minmax(0, 1fr); padding: 12px 14px; gap: 2px 10px; }
  .row .time { grid-column: 2; grid-row: 1; padding-top: 0; }
  .row .time .to { display: inline; font-size: 13px; margin-left: .6em; }
  .row .time { justify-content: flex-start; align-items: center; gap: 8px; }
  .row .dur { width: 30px; height: 30px; font-size: 10px; margin-top: 0; }
  .row .ic { grid-row: 1 / span 2; }
  .row .main { grid-column: 2; }
  .row { grid-template-columns: 32px minmax(0, 1fr) auto; }
  .row .main { grid-column: 2 / -1; }
  .row .right { grid-column: 3; grid-row: 1; justify-items: end; text-align: right; align-self: center; }
  .row .rate-d { display: none; }
  .row .rate-m { display: block; }
  .leg { grid-template-columns: 32px minmax(0, 1fr) auto; padding-inline: 14px; gap: 0 10px; }
  .leg::before { display: none; }
  .leg-ic { grid-column: 1; }
  .leg-main { grid-column: 2; }
  .leg .pp, .leg-free { grid-column: 3; }
}

.ticket { display: grid; gap: 8px; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--sunken); margin-top: 4px; }
.ticket.exploring { background: color-mix(in srgb, var(--b-orange-bg) 45%, var(--surface)); border-color: color-mix(in srgb, var(--b-orange) 25%, var(--line)); }
.ticket-line { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 14px; }
.ticket-line .pick { font-weight: 600; }
.ticket-facts { font-size: 13px; color: var(--muted); }

.stars { position: relative; display: inline-block; font-size: 13px; line-height: 1; letter-spacing: 1px; color: var(--star-empty); white-space: nowrap; font-family: Arial, sans-serif; }
.stars .fill { position: absolute; inset: 0 auto 0 0; overflow: hidden; color: var(--star); }
.rate { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; white-space: nowrap; color: var(--ink-2); }
.rate .num { font-weight: 600; color: var(--ink); }
.rate .odd { color: var(--bad); font-size: 12px; font-weight: 600; }
.rate .few { color: var(--muted); font-size: 12px; }
.rate.na { color: var(--muted); font-size: 12px; }

details > summary { cursor: pointer; font-weight: 600; font-size: 14px; list-style: none; display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--accent); min-height: 34px; padding-right: 8px; }
summary::-webkit-details-marker { display: none; }
summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); margin: 0 4px 0 2px; transition: transform .15s; }
details[open] > summary::before { transform: rotate(45deg); margin-top: -4px; }
summary .hint { font-weight: 400; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { summary::before { transition: none; } }
.opts { display: grid; gap: 6px; margin-top: 6px; }
.opt { display: block; position: relative; }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt-body { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 2px 12px; align-items: start; padding: 12px 14px; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; transition: border-color .15s, background .15s; }
.opt-body:hover { border-color: var(--subtle); }
.opt input:disabled + .opt-body { cursor: default; }
.radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--subtle); background: var(--surface); margin-top: 1px; }
.opt input:checked + .opt-body { border-color: var(--select); background: var(--select-bg); }
.opt input:checked + .opt-body .radio { border: 5px solid var(--select); }
.opt-main { display: grid; gap: 4px; min-width: 0; }
.opt-title { font-weight: 600; font-size: 14px; line-height: 1.35; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.opt-meta { font-size: 13px; color: var(--muted); }
.ml { --city: var(--k-meal); }
.ml-head { display: grid; gap: 12px; }
.ml-filters { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 12px; background: var(--line); justify-self: start; }
.ml-f { font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; min-height: 40px; padding: 0 14px; border-radius: 9px; border: 0; background: transparent; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
.ml-f small { font-weight: 500; color: var(--muted); }
.ml-f[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--shadow-sel); }
.ml-stats { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13.5px; color: var(--muted); }
.ml-stats b { color: var(--ink); }
.ml-day { display: grid; gap: 12px; scroll-margin-top: 120px; }
.ml-day > h3 { font-size: 18px; display: flex; align-items: baseline; gap: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.ml-day > h3 .c { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px; }
.ml-day > h3 .c::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dc); }
.ml-day > h3 .t { margin-left: auto; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.ml-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
.mcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; min-width: 0; box-shadow: var(--shadow); scroll-margin-top: 120px; transition: box-shadow .3s; }
.mcard.flash { box-shadow: var(--focus-ring); }
.m-img { position: relative; aspect-ratio: 16 / 10; background: color-mix(in srgb, var(--dc) 8%, var(--sunken)); display: grid; place-items: center; color: color-mix(in srgb, var(--dc) 50%, var(--muted)); }
.m-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.m-img svg { width: 36px; height: 36px; opacity: .55; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.m-img::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgb(0 0 0 / .4), transparent 36%, transparent 72%, rgb(0 0 0 / .3)); pointer-events: none; }
.m-tag { position: absolute; z-index: 1; top: 10px; left: 12px; display: flex; gap: 6px; align-items: center; color: #fff; font-size: 13px; font-weight: 600; text-shadow: 0 1px 2px rgb(0 0 0 / .5); }
.m-tag .when { font-weight: 400; }
.m-tag .chip { text-shadow: none; }
.m-price { position: absolute; z-index: 1; top: 8px; right: 8px; }
.m-price .pp { background: var(--surface); padding: 4px 10px; border-radius: 8px; box-shadow: var(--shadow-sel); }
.m-cap { position: absolute; z-index: 1; bottom: 8px; left: 12px; right: 12px; color: #fff; font-size: 11.5px; text-shadow: 0 1px 2px rgb(0 0 0 / .6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-body { padding: 14px 16px 16px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.m-title { font-size: 16px; font-weight: 600; line-height: 1.35; letter-spacing: -0.01em; }
.m-place { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.m-note { font-size: 14px; margin: 0; color: var(--ink-2); }
.m-row { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; color: var(--ink-2); }
.m-row a { color: var(--accent); }
.m-row .halal { margin-left: 0; }
.m-issue { margin: 0; font-size: 13px; color: var(--b-red); background: var(--b-red-bg); border-radius: 10px; padding: 8px 10px; }
.m-swap { border-top: 1px solid var(--line-soft); padding-top: 8px; margin-top: 2px; }
.m-swap summary { cursor: pointer; font-size: 14px; font-weight: 600; color: var(--accent); list-style: none; display: flex; align-items: center; gap: 6px; }
.m-swap summary::-webkit-details-marker { display: none; }
.m-alts { display: grid; gap: 6px; margin-top: 8px; }
.m-alt { display: grid; grid-template-columns: 20px 64px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border: 2px solid var(--line); border-radius: 10px; cursor: pointer; }
.m-alt:has(input:checked) { border-color: var(--select); background: var(--select-bg); }
.m-alt input { accent-color: var(--select); width: 18px; height: 18px; margin: 0; }
.m-alt .th { width: 64px; height: 48px; border-radius: 8px; object-fit: cover; background: var(--sunken); display: block; }
.m-alt .tx { min-width: 0; display: grid; gap: 2px; font-size: 13px; }
.m-alt .tx b { font-size: 14px; line-height: 1.25; }
.m-alt .tx span { color: var(--muted); font-size: 12px; }
.m-alt .pr { font-size: 14px; font-weight: 600; color: var(--ink); }
.m-alt .halal { margin-left: 0; justify-self: start; }
.row .swap-ref { display: inline-block; margin-top: 2px; font-size: 13.5px; color: var(--accent); font-weight: 600; text-decoration: none; }
.row .swap-ref:hover { text-decoration: underline; }
@media (max-width: 640px) { .ml-grid { grid-template-columns: 1fr; } .ml-filters { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; scrollbar-width: none; } .ml-f { flex: none; } }
.tv { --c: var(--accent); }
.tv-sec { display: grid; gap: 12px; }
.tv-sec > h3 { font-size: 20px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.tv-sec > h3 small { font-size: 14px; font-weight: 600; color: var(--ink-2); letter-spacing: 0; }
.tv-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; display: grid; gap: 10px; min-width: 0; box-shadow: var(--shadow); }
.tv-card.train { --c: var(--k-move); }
.tv-card.flight { --c: var(--hk); }
.tv-card.visa { --c: var(--sh); }
.tv-card.visa.free { --c: var(--k-move); }
.tv-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.tv-when { font-size: 13px; font-weight: 600; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tv-when::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.tv-name { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; margin-top: 4px; }
.tv-route { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; background: var(--sunken); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.tv-route b { display: block; font-size: 16px; font-weight: 600; }
.tv-route span { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.tv-route .end { text-align: right; }
.tv-route .dur { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); color: var(--muted); background: var(--surface); font-size: 11px; font-weight: 600; }
.tv-facts { font-size: 13.5px; color: var(--muted); margin: 0; }
.tv-list { margin: 0; padding-left: 18px; font-size: 14px; display: grid; gap: 3px; color: var(--ink-2); }
.tv-kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 14px; margin: 0; }
.tv-kv dt { color: var(--muted); }
.tv-kv dd { margin: 0; overflow-wrap: anywhere; }
.tv-links { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; font-weight: 600; }
.tv-links a { color: var(--accent); }
.tv-card details summary { cursor: pointer; font-size: 14px; font-weight: 600; }
/* Earlier options (#considered) */
.cv .ml-filters { max-width: 100%; }
a.ml-f { text-decoration: none; }
.cv-card { --c: var(--subtle); }
.cv-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 14px; align-items: start; }
.cv-top:has(.cv-th) { grid-template-columns: 88px minmax(0, 1fr) auto; }
.cv-th { width: 88px; height: 66px; border-radius: 10px; object-fit: cover; background: var(--sunken); display: block; }
.cv-head { display: grid; gap: 4px; min-width: 0; }
.cv-head .tv-name { margin-top: 0; }
.cv-head .tv-when { font-weight: 500; }
.cv-head .tv-when::before { display: none; }
.cv-delta { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--b-orange-bg); color: var(--b-orange); }
.cv-delta.less { background: var(--b-green-bg); color: var(--b-green); }
.cv-why { font-size: 13.5px; }
.cv-ask { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; justify-content: space-between; font-size: 13px; color: var(--ink-2); background: var(--sunken); border: 1px dashed var(--line); border-radius: 10px; padding: 8px 10px; }
.cv-copy { font: inherit; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-height: 30px; padding: 0 10px; cursor: pointer; max-width: 100%; overflow-wrap: anywhere; user-select: all; }
.cv-copy:hover { color: var(--ink); border-color: var(--subtle); }
.cv-link { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; color: var(--ink); text-decoration: none; box-shadow: var(--shadow); }
.cv-link:hover { color: var(--ink); border-color: var(--subtle); }
.cv-link span { display: grid; gap: 2px; }
.cv-link small { font-size: 13px; color: var(--muted); }
.cv-link svg { width: 18px; height: 18px; flex: none; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 560px) { .cv-top, .cv-top:has(.cv-th) { grid-template-columns: minmax(0, 1fr) auto; } .cv-th { grid-column: 1 / -1; width: 100%; height: 140px; } .cv .ml-filters { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; } .cv .ml-f { flex: none; } }
.opt-cancel { display: block; font-size: 12.5px; font-weight: 600; color: var(--ok); }
.opt-cancel.no { color: var(--bad); }
.opt-side { display: grid; justify-items: end; gap: 4px; text-align: right; }
.opt-price { font-size: 14px; font-weight: 600; white-space: nowrap; }
.opt-price small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; text-align: right; }
@media (max-width: 560px) { .opt-body { grid-template-columns: 18px minmax(0, 1fr); } .opt-side { grid-column: 2; justify-items: start; text-align: left; } .opt-price small { text-align: left; } }

.icons { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.icon-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; padding: 0; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); text-decoration: none; }
.icon-btn::after { content: ""; position: absolute; inset: -5px; }
.icon-btn:hover { border-color: var(--subtle); color: var(--ink); }
.icon-btn svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.backup { border: 1px dashed var(--subtle); border-radius: 16px; padding: 16px 18px; display: grid; gap: 10px; background: var(--surface); }
.backup h3 { font-size: 18px; }
footer { font-size: 13px; color: var(--muted); display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 16px; }

/* ===== Layout of the redesign: phone = top bar + screen + bottom menu; desktop (900px+) = sticky top menu, days sidebar, screen, budget column (1200px+) ===== */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.topbar { background: var(--surface); }
.tb-in { max-width: 1360px; margin: 0 auto; padding: 12px 16px 4px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; }
.brand { display: flex; flex-direction: column; text-decoration: none; color: var(--ink); min-width: 0; }
.brand:hover { color: var(--ink); }
.brand strong { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
.brand span { font-size: 12px; color: var(--muted); }
.topnav, .tb-total { display: none; }
.tb-in .theme-sw { margin-left: auto; }
.layout { max-width: 1360px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.side, .extra { display: none; }
#main { display: grid; gap: 16px; align-content: start; min-width: 0; }
#main [id] { scroll-margin-top: 72px; }
.stack { display: grid; gap: 16px; }
.cap { margin: 0 2px; font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.cap.dot { display: flex; align-items: center; gap: 8px; }
.cap.dot::before, .eyebrow.dot::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--city, var(--muted)); flex: none; }
.eyebrow.dot { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }

/* Screen header: a white band on phones, a white card on desktop */
.vhead { background: var(--surface); box-shadow: 0 0 0 100vmax var(--surface); clip-path: inset(0 -100vmax); position: relative; padding: 8px 0 18px; display: grid; gap: 6px; }
.vhead h1 { font-size: 26px; }
.vhead .sub { font-size: 15px; }
.vh-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.back { min-height: 44px; display: inline-flex; align-items: center; gap: 2px; font-size: 15px; font-weight: 500; text-decoration: none; margin-left: -6px; }
.back svg, .dnav svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.dnavs { display: flex; gap: 4px; }
.dnav { min-height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); color: var(--ink); display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 500; text-decoration: none; }
.dnav:hover { color: var(--ink); border-color: var(--subtle); }
.dh-badges { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; padding-top: 4px; }
.dh-cost { font-size: 14px; color: var(--muted); }
.dh-cost b { color: var(--ink); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; padding: 4px; border-radius: 12px; background: var(--line-soft); }
.seg a, .seg button { font: inherit; min-height: 40px; border: 0; border-radius: 9px; background: transparent; color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 500; text-decoration: none; cursor: pointer; }
.seg [aria-pressed="true"], .seg [aria-current] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--shadow-sel); }
.seg i { width: 8px; height: 8px; border-radius: 50%; }
.seg.mode { margin-top: 6px; max-width: 420px; }
:root[data-theme="dark"] .seg [aria-pressed="true"], :root[data-theme="dark"] .seg [aria-current] { background: var(--line); }

/* Bottom menu on phones */
.bottomnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: color-mix(in srgb, var(--surface) 97%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 4px max(4px, env(safe-area-inset-left, 0px)) max(10px, env(safe-area-inset-bottom, 0px)); }
.bottomnav a { position: relative; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: var(--muted); font-size: 11.5px; font-weight: 500; }
.bottomnav a[aria-current="page"] { color: var(--ink); font-weight: 600; }
.bottomnav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nb { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--b-orange-bg); color: var(--b-orange); font-size: 11px; font-weight: 600; display: inline-grid; place-items: center; }
.bottomnav .nb { position: absolute; top: 3px; left: calc(50% + 5px); }

/* Extra status badges for days */
.chip.suggested { --bb: var(--b-blue-bg); --bf: var(--b-blue); --ic: var(--i-star); }
.chip.travel { --bb: var(--b-grey-bg); --bf: var(--b-grey); --ic: var(--i-plane); }
.chip.tight { --bb: var(--b-red-bg); --bf: var(--b-red); --ic: var(--i-timer); }
.chip.dayoff { --bb: color-mix(in srgb, var(--bar-leave) 14%, var(--surface)); --bf: color-mix(in srgb, var(--bar-leave) 75%, var(--ink)); --ic: var(--i-bookmark); }
.chip.holiday { --bb: var(--b-green-bg); --bf: var(--b-green); --ic: var(--i-check); }
.sum-leave { font-size: 13px; color: var(--muted); margin: -4px 0 0; }
.vlist { display: grid; gap: 8px; }
.vlist .v { display: grid; gap: 2px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--sunken); color: var(--ink); text-decoration: none; position: relative; }
.vlist a.v:hover { border-color: var(--subtle); color: var(--ink); }
.vlist .v.on { border-color: var(--select); background: var(--select-bg); }
.vlist .v span { font-size: 13px; color: var(--ink-2); }
.vlist .v small { font-size: 12px; color: var(--muted); }
.vlist .v.quiz { border-style: dashed; border-color: var(--select); }
.vlist .v em { font-style: normal; font-size: 12px; font-weight: 600; color: var(--select); }
.sum-leave b { color: var(--ink-2); }
.chip.ico { padding: 0 4px; gap: 0; width: 26px; justify-content: center; }

/* Days overview */
.city-seg { position: sticky; top: 0; z-index: 5; box-shadow: 0 0 0 6px var(--bg); }
.dv-city { display: grid; gap: 10px; scroll-margin-top: 64px; }
.dv-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding: 0 2px; }
.dv-head h2 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
.dv-head h2::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--city); }
.dv-head .meta { font-size: 13px; color: var(--muted); }
.dv-head > strong { font-size: 15px; white-space: nowrap; }
.dv-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
.dv-hotel { display: flex; gap: 12px; align-items: center; padding: 14px 16px; text-decoration: none; color: var(--ink); background: var(--sunken); border-bottom: 1px solid var(--line-soft); }
.dv-hotel:hover { color: var(--ink); }
.dv-hotel > span { flex: 1 1 auto; display: grid; gap: 1px; min-width: 0; }
.dv-hotel strong { font-size: 14px; }
.dv-hotel small { font-size: 12px; color: var(--muted); }
.dv-hotel svg, .dv-days svg, .tk-card svg, .card-list svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.dv-hotel > svg:first-child { color: var(--muted); width: 20px; height: 20px; }
.dv-hotel > svg:last-child, .dv-days a > svg, .tk-card > svg:last-child { color: var(--subtle); }
.dv-days { list-style: none; margin: 0; padding: 0; }
.dv-days li + li { border-top: 1px solid var(--line-soft); }
.dv-days a { display: grid; grid-template-columns: 40px minmax(0, 1fr) 18px; column-gap: 14px; align-items: center; padding: 14px 16px; text-decoration: none; color: var(--ink); }
.dv-days a:hover { background: var(--sunken); color: var(--ink); }
.dn { display: grid; justify-items: center; line-height: 1.15; }
.dn span { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--muted); }
.dn b { font-size: 20px; font-weight: 700; }
.dx { display: grid; gap: 3px; min-width: 0; }
.dx strong { font-size: 15px; line-height: 1.3; }
.dx > span:not(.dbadges) { font-size: 13px; line-height: 1.35; color: var(--muted); }
.dbadges { display: flex; gap: 6px; flex-wrap: wrap; padding-top: 3px; }

/* One day */
.pick-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 18px 16px; display: grid; gap: 10px; transition: box-shadow .3s; }
.pick-card.flash { box-shadow: var(--focus-ring); }
.pc-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pc-head h2 { font-size: 18px; letter-spacing: -0.01em; }
.pick-card .sub { font-size: 13.5px; color: var(--muted); }
.tl-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 14px 20px 10px; border-bottom: 1px solid var(--line); }
.tl-title h2 { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.tl-title span { font-size: 13px; color: var(--muted); }
.day-total { background: #111827; color: #fff; border-radius: 16px; padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; border: 1px solid #111827; }
:root[data-theme="dark"] .day-total { border-color: var(--line); }
.day-total span { display: grid; gap: 2px; }
.day-total strong { font-size: 14px; }
.day-total small { font-size: 12.5px; color: #d1d5db; }
.day-total b { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
.row.flash { background: var(--select-bg); transition: background .3s; }
/* "On the trip": hide prices, ticket options and planning warnings */
.trip-mode .row .right, .trip-mode .rate-m, .trip-mode .leg .pp, .trip-mode .leg-free, .trip-mode .ticket details, .trip-mode .leg-warn, .trip-mode .day-total, .trip-mode .opt-side, .trip-mode .dh-cost, .trip-mode .chip.tight, .trip-mode .chip.not_released { display: none; }

/* Today */
.now-card, .next-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 10px; }
.next-card { box-shadow: none; padding: 16px 18px; gap: 6px; }
.nc-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }

<script>
// Colour mode: Light by default (the design is light); the viewer's pick is remembered in this browser only
(function () {
  const KEY = "tripTheme";
  let pick = "light";
  try { pick = localStorage.getItem(KEY) === "dark" ? "dark" : "light"; } catch (_) {}
  const root = document.documentElement;
  const apply = () => {
    if (root.getAttribute("data-theme") !== pick) root.setAttribute("data-theme", pick);
    document.querySelectorAll("[data-theme-set]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.themeSet === pick)));
  };
  apply();
  // Keep the viewer's pick if the host page changes the theme attribute
  new MutationObserver(apply).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
  document.addEventListener("click", (e) => {
    const b = e.target.closest && e.target.closest("[data-theme-set]");
    if (!b) return;
    pick = b.dataset.themeSet;
    try { localStorage.setItem(KEY, pick); } catch (_) {}
    apply();
  });
})();
(function () {
  const CITY_ORDER = ["hk", "cq", "sh"];
  const CITY_FALLBACK = { hk: { id: "hk", name: "Hong Kong & Macau" }, cq: { id: "cq", name: "Chongqing" }, sh: { id: "sh", name: "Shanghai" } };
  const CITY_WORD = { hk: "Hong Kong", cq: "Chongqing", sh: "Shanghai" };
  const SHORT = { "Trip.com": "Trip.com", "Tripadvisor": "T-advisor", "Klook": "Klook" };
  const STATUS_TEXT = { available: "Available", not_released: "Not released", sold_out: "Sold out", unverified: "Not checked", free: "Free", agreed: "Agreed, not booked", booked: "Booked", needed: "Visa needed", not_needed: "No visa needed" };
  const TYPE_TEXT = { meal: "Meal", transit: "Getting around", travel: "Travel", activity: "Ticketed", sight: "Sightseeing", shopping: "Shopping", hotel: "Hotel", free: "Free time" };

  const SVG = (p) => '<svg viewBox="0 0 24 24" aria-hidden="true">' + p + '</svg>';
  const TYPE_ICON = {
    meal: SVG('<path d="M7 3v8a2 2 0 0 0 2 2v8M11 3v8a2 2 0 0 1-2 2M9 3v6"/><path d="M17 21V3c-2 1-3 4-3 7s1 4 3 4"/>'),
    transit: SVG('<rect x="5" y="3.5" width="14" height="13" rx="3"/><path d="M5 10.5h14M8.5 20l1.5-3.5M15.5 20L14 16.5"/><circle cx="9" cy="13.5" r=".6" fill="currentColor"/><circle cx="15" cy="13.5" r=".6" fill="currentColor"/>'),
    travel: SVG('<path d="M2.5 14.5l19-7-3 4-7 2 2 6-2 1-3.5-5.5-4 1.5-1.5-2z"/>'),
    activity: SVG('<path d="M3.5 8.5V6.5a1 1 0 0 1 1-1h15a1 1 0 0 1 1 1v2a2.5 2.5 0 0 0 0 5v2a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1v-2a2.5 2.5 0 0 0 0-5z"/>'),
    sight: SVG('<path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>'),
    shopping: SVG('<path d="M5 8h14l-1 12.5H6z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/>'),

    free: SVG('<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>')
  };
  // How you get to a row from the one before it (item.move)
  const MOVE = {
    walk: ["Walk", '<circle cx="13" cy="4.5" r="1.8"/><path d="M10 21l2.2-6.5L15 17v4M9 11.5l2-3.5 3.5 1 2 3 2.5 1M12.2 14.5L11 8"/>'],
    metro: ["Metro", '<rect x="6" y="3.5" width="12" height="13" rx="3"/><path d="M6 10.5h12M9 20l1.5-3.5M15 20l-1.5-3.5"/><circle cx="9.5" cy="13.5" r=".6" fill="currentColor"/><circle cx="14.5" cy="13.5" r=".6" fill="currentColor"/>'],
    monorail: ["Monorail", '<rect x="6" y="3.5" width="12" height="13" rx="3"/><path d="M6 10.5h12M12 16.5V21"/>'],
    bus: ["Bus", '<rect x="5" y="3.5" width="14" height="14" rx="2.5"/><path d="M5 11h14M8 20.5v-3M16 20.5v-3"/>'],

    taxi: ["Taxi", '<path d="M4 15.5v-3l2-5h12l2 5v3z"/><path d="M4 15.5h16v2.5H4zM9.5 5h5"/><circle cx="7.5" cy="18" r="1.4"/><circle cx="16.5" cy="18" r="1.4"/>'],
    ferry: ["Ferry", '<path d="M3 17c2 1.5 4 1.5 6 0s4-1.5 6 0 4 1.5 6 0M5 14l1.5-5h11L19 14M9 9V6h6v3"/>'],
    train: ["Train", '<rect x="6" y="3" width="12" height="14" rx="4"/><path d="M6 11h12M8.5 21l2-4M15.5 21l-2-4"/>'],

  const MODE_ALIAS = { mtr: "metro", subway: "metro", didi: "taxi", uber: "taxi", car: "taxi", "star ferry": "ferry", "peak tram": "tram", funicular: "tram", "cable car": "cable", cableway: "cable", "tour vehicle": "tour", maglev: "train" };
  const moveCost = (it) => it.move && it.move.cost ? it.move.cost * (it.move.costUnit === "group" ? 1 : travellers()) : 0;
  function renderLeg(it) {
