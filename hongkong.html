    considered: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>'
  };
  const BOTTOM = ["today", "days", "meals", "travel", "todo"];
  const BOTTOM_LABEL = { travel: "Flights" };
  const CHEV_R = SVG('<path d="M9 6l6 6-6 6"/>'), CHEV_L = SVG('<path d="M15 6l-6 6 6 6"/>');
  const PIN = SVG('<path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>');
  const NAVI = SVG('<path d="M3 11l18-8-8 18-2-8-8-2z"/>');
  const CAM = SVG('<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3"/>');

  let dayMode = "plan";
  try { dayMode = localStorage.getItem("dayMode") === "trip" ? "trip" : "plan"; } catch (_) {}
  let lastRouteKey = null, pendingTarget = null, cur = null;

  const isoLocal = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const toMin = (t) => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(t || "")); return m ? +m[1] * 60 + +m[2] : null; };
  const daysBetween = (a, b) => Math.round((Date.parse(b + "T12:00:00Z") - Date.parse(a + "T12:00:00Z")) / 864e5);
  const sortedDays = () => [...state.days.values()].sort((x, y) => x.date.localeCompare(y.date));
  const longDow = (iso) => new Date(iso + "T12:00:00Z").toLocaleDateString("en-GB", { weekday: "long", timeZone: "UTC" });
  const brandName = () => (state.meta && state.meta.brand) || "China trip";
  const tripDatesText = () => (state.meta && state.meta.tripDates) || "Fri 18 Dec 2026 – Mon 4 Jan 2027";
  const sr = (t) => '<span class="sr">' + esc(t) + '</span>';
  const whole = (n) => Math.round(n).toLocaleString("en-US");

  function nowInfo(at) {
    const ds = sortedDays(), d = new Date();
    const date = at ? at.date : isoLocal(d), min = at ? toMin(at.time) : d.getHours() * 60 + d.getMinutes();
    if (!ds.length) return { phase: "none", date, min, ds };
    const first = ds[0].date, last = ds[ds.length - 1].date;
    return { phase: date < first ? "before" : date > last ? "after" : "during", date, min, first, last, ds };
  }
  function route() {
    const h = decodeURIComponent((location.hash || "").slice(1));
    if (/^day\/\d{4}-\d{2}-\d{2}$/.test(h)) return { view: "day", date: h.slice(4) };
    const tm = /^today(?:\/(\d{4}-\d{2}-\d{2})(?:T(\d{1,2}:\d{2}))?)?$/.exec(h);
    if (tm) return { view: "today", at: tm[1] ? { date: tm[1], time: tm[2] || "09:00" } : null };
    const cm = /^considered(?:\/([a-z]+))?$/.exec(h);
    if (cm) return { view: "considered", kind: cm[1] || null };
    if (VIEWS[h]) return { view: h };
    if (CITY_ORDER.includes(h)) return { view: "days", city: h };
    return { view: nowInfo().phase === "during" ? "today" : "days" };
  }

  // ---- Status of a day: one badge for decisions, plus "not on sale yet" when a ticket or train is not released
  const BADGE = { final: ["final", "Final"], pick: ["exploring", "Pick one"], sale: ["not_released", "Not on sale yet"], suggested: ["suggested", "Suggested pick"], travel: ["travel", "Travel day"] };
  const badge = (k, iconOnly) => '<span class="chip ' + BADGE[k][0] + (iconOnly ? ' ico" title="' + esc(BADGE[k][1]) + '">' + sr(BADGE[k][1]) : '">' + esc(BADGE[k][1])) + '</span>';
  const dayActs = (day) => [...new Set((day.items || []).map((it) => it.activityId).filter(Boolean))].map((id) => state.activities.get(id)).filter((a) => a && !isHotel(a));
  function dayStatus(day) {
    const acts = dayActs(day), items = day.items || [], out = [];
    if (acts.some((a) => a.decision === "exploring" && !chosen(a))) out.push("pick");
    else if (acts.length && acts.every((a) => a.decision === "final")) out.push("final");
    else if (acts.length) out.push("suggested");
    else if (items.some((it) => it.type === "travel") && !items.some((it) => it.type === "sight" || it.type === "shopping")) out.push("travel");
    else out.push("final");
    const sale = acts.some((a) => { const p = chosen(a); return p && (p.status === "not_released" || p.price == null); }) ||
      ((state.travel && state.travel.legs) || []).some((l) => l.date === day.date && l.status === "not_released" && !l.countedInDays);
    if (sale) out.push("sale");
    return out;
  }
  function dayBreakdown(day) {
    const b = { meals: 0, tickets: 0, move: 0 }, seen = new Set();
    for (const it of effItems(day)) {
      b.move += moveCost(it) || 0;
      if (!it.activityId) { const c = itemCost(it) || 0; if (it.type === "meal") b.meals += c; else b.move += c; continue; }
      if (seen.has(it.activityId)) continue; seen.add(it.activityId);
      const a = state.activities.get(it.activityId); if (!a || isHotel(a)) continue;
      const c = costForGroup(chosen(a)) || 0; if (it.type === "meal") b.meals += c; else b.tickets += c;
    }
    b.total = b.meals + b.tickets + b.move;
    const h = stayForNight(day.date), p = h && chosen(h), hc = p && costForGroup(p);
    b.night = hc ? hc / (p.nights || 1) : 0;
    return b;
  }

  // ---- To do: items from meta/todo; ticks saved by the page as choices/todo-<id>
  const todoItems = () => ((state.todo && state.todo.items) || []).map((t) => Object.assign({}, t, { done: state.choices.get("todo-" + t.id) === "done" }));
  const MONTHS = { Jan: "01", Feb: "02", Mar: "03", Apr: "04", May: "05", Jun: "06", Jul: "07", Aug: "08", Sep: "09", Oct: "10", Nov: "11", Dec: "12" };
  function cancelDeadlines() {
    return hotels().map((h) => { const p = chosen(h); if (!p || !p.cancel) return null;
      const m = /until (.+?) on (\d{1,2}) ([A-Z][a-z]{2})/.exec(p.cancel); if (!m) return null;
      const iso = (m[3] === "Jan" ? "2027" : "2026") + "-" + MONTHS[m[3]] + "-" + m[2].padStart(2, "0");
      return { iso, date: m[2] + " " + m[3], time: m[1], name: splitLabel(p.label)[0], id: h.id };
    }).filter(Boolean).sort((a, b) => a.iso.localeCompare(b.iso));
  }

  // ---- Shared pieces
  // Days off work (meta/trip daysOff): perDay × the leave days; company holidays cost nothing. Counted in the trip total, not in the city totals.
  function leaveTotals() {
    const o = state.meta && state.meta.daysOff; if (!o) return { total: 0, days: [], free: [], perDay: 0 };
    const days = o.days || [], perDay = o.perDay || 0;
    return { total: perDay * days.length, days, free: o.free || [], perDay, note: o.note };
  }
  const leaveDay = (date) => cur && cur.lv && cur.lv.days.find((d) => d.date === date);
  const holiday = (date) => cur && cur.lv && cur.lv.free.find((d) => d.date === date);
  function leaveLine() {
    const lv = cur.lv; if (!lv.days.length) return "";
    return '<p class="sum-leave"><b>Days off: ' + lv.days.length + ' × ' + money(lv.perDay) + '</b> (' + esc(lv.days.map((d) => dayLabel(d.date)).join(", ")) + ')' + (lv.note ? '. ' + esc(lv.note) : "") + '</p>';
  }
  function budgetHTML() {
    const { t, k, pending, finals, exploring } = cur.totals, tt = cur.tt, grand = cur.grand;
    const cats = [["Flights & train", tt.legs, "flight", !!state.travel], ["Hotels", k.hotels, "hotel", true], ["Meals (est.)", k.meals, "meal", true], ["Tickets", k.tickets, "ticket", true], ["Transport", k.transport, "move", true], ["Visas", tt.visas, "visa", !!state.travel], ["Days off", cur.lv.total, "leave", cur.lv.days.length > 0]].filter((c) => c[3]);
    const bar = grand ? cats.filter((c) => c[1] > 0).map((c) => '<span style="flex:' + round2(c[1]) + ' 1 0;background:var(--bar-' + c[2] + ')" title="' + esc(c[0] + " " + money(round2(c[1]))) + '"></span>').join("") : "";
    return '<section class="summary" aria-label="Trip total"><div class="sum-top"><span class="eyebrow">Total for two</span><span class="value">' + money(round2(grand)) + '</span></div>' +
      '<div class="sum-bar" role="img" aria-label="' + esc("Spending by category: " + cats.map((c) => c[0] + " US$" + whole(c[1])).join(", ")) + '">' + bar + '</div>' +
      '<div class="sum-legend">' + cats.map((c) => '<span><i style="background:var(--bar-' + c[2] + ')"></i>' + esc(c[0]) + ' <b>' + (c[1] ? whole(c[1]) : c[2] === "hotel" ? "not chosen" : "–") + '</b></span>').join("") + '</div>' +
      leaveLine() + '<div class="sum-cities">' + cities().map((c) => c.id).map((c) => '<div class="sum-cell sum-city" style="--city: var(--' + c + ')"><span class="label">' + esc((CITY_FALLBACK[c] || {}).name || c) + '</span><span class="value">' + money(round2(t[c] || 0)) + '</span></div>').join("") + '</div>' +
      '<div class="sum-tags"><span class="chip final">' + finals + ' final</span><span class="chip exploring">' + exploring + ' still to pick</span>' + (pending ? '<span class="chip not_released">' + pending + ' not on sale yet</span>' : "") +
      (state.travel ? '<span class="sum-allin"><a href="#travel">Flights, train and visa details</a></span>' : "") + '</div></section>';
  }
  // Other versions of the trip (meta/trip versions: id, title, dates, url, total, note); tripId marks this page.
  function versionsHTML() {
    const vs = (state.meta && state.meta.versions) || []; if (vs.length < 2) return "";

      const inner = '<b>' + esc(v.title) + '</b><span>' + esc([v.dates, v.total ? "about " + money(Math.round(v.total)) + " for two" : ""].filter(Boolean).join(" · ")) + '</span>' + (v.note ? '<small>' + esc(v.note) + '</small>' : "");
      return v.id === me ? '<div class="v on" aria-current="page"><em>This page</em>' + inner + '</div>' : '<a class="v" href="' + esc(v.url) + '"' + ext + '>' + inner + '</a>';
    }).join("") + '</div></section>';
  }
  const recheckHTML = () => state.meta && state.meta.recheck ? '<div class="notice"><strong>To recheck</strong><span>' + esc(state.meta.recheck) + '</span></div>' : "";
  function keyHTML() {

  function comingUpHTML() {

  }
  const footHTML = () => '<footer><div>Ticket prices and availability come from Trip.com for each exact date. The trip total includes tickets, hotels, meals (estimates), the local transport priced in the plan, flights and trains, visas and the days off work. City totals cover only what happens in each city. Travel times marked (est.) are estimates.</div><div>' +
    (state.canWrite === false ? "You can view this page but not change the picks." : "Picks and ticks are saved for everyone who opens this page.") + '</div></footer>';

  function navHTML(r) {
    const on = r.view === "day" ? "days" : r.view, open = todoItems().filter((x) => !x.done).length;

    }).join("") + '</nav>';
  }
  const vhead = (inner, city) => '<div class="vhead"' + (city ? ' style="--city: var(--' + esc(city) + ')"' : "") + '>' + inner + '</div>';

  // ---- Days: every day by city, with the hotel on top and one status badge per day
  function daysView(r) {
    const ds = sortedDays(), t = cur.totals.t;
    let h = vhead('<div class="eyebrow">' + esc(tripDatesText()) + ' · ' + travellers() + ' travellers</div><h1>' + esc(brandName()) + '</h1><p class="sub">' + esc((state.meta && state.meta.subtitle) || "Hong Kong & Macau, Chongqing, Shanghai. Tap a day to see it hour by hour and pick tickets.") + '</p>');
    h += '<div class="phone-only stack">' + budgetHTML() + versionsHTML() + recheckHTML() + '</div>';

    h += '<nav class="seg city-seg" aria-label="Cities">' + cities().map((c) => '<a href="#' + esc(c.id) + '"' + (r.city === c.id ? ' aria-current="true"' : "") + '><i style="background:var(--' + esc(c.id) + ')"></i>' + esc(CITY_WORD[c.id] || c.name) + '</a>').join("") + '</nav>';

        return '<a class="dv-hotel" href="#stay-' + esc(x.id) + '">' + TYPE_ICON.hotel + '<span><strong>' + esc(name) + (cost ? ' · ' + money(Math.round(cost)) : "") + '</strong><small>' + esc(p ? (p.cancel || "Check the cancellation terms") : "Hotel not chosen yet") + '</small></span>' + CHEV_R + '</a>'; }).join("")
        : '<a class="dv-hotel" href="#hotels">' + TYPE_ICON.hotel + '<span><strong>Hotel not chosen yet</strong></span>' + CHEV_R + '</a>';

        '<div class="dv-card">' + hotelRows + '<ol class="dv-days">' + days.map((d) => { const dp = dateParts(d.date);
          return '<li><a href="#day/' + d.date + '"><span class="dn"><span>' + esc(dp.dow) + '</span><b>' + dp.d + '</b></span><span class="dx"><strong>' + esc(d.title) + '</strong><span>' + esc(d.summary || "") + '</span><span class="dbadges">' + dayStatus(d).map((s) => badge(s, true)).join("") + (hasSteps(d) ? dayChip(d) : "") + '</span></span>' + CHEV_R + '</a></li>'; }).join("") + '</ol></div>' +
        (backups.length ? '<div class="backup"><h3>Backup if something is cancelled</h3>' + backups.map((a) => '<div><div class="title"><b>' + esc(a.name) + '</b> <span class="note">' + esc(a.area || "") + '</span></div>' + renderTicket(a).block + '</div>').join("") + '</div>' : "") + '</section>';
    }).join("");
    return h + keyHTML();
  }

  // ---- One day: the choice to make at the top, then the hour-by-hour plan, then the day total
  function skipOption(a, cid, disabled) {
    const id = "opt-" + a.id + "-skip";
    return '<label class="opt" for="' + id + '"><input type="radio" name="pick-' + esc(a.id) + '" id="' + id + '" value="skip"' + (cid === "skip" ? " checked" : "") + disabled + '>' +
      '<span class="opt-body"><span class="radio" aria-hidden="true"></span><span class="opt-main"><span class="opt-title">Nothing planned for this slot</span><span class="opt-meta">Not counted in the total.</span></span><span class="opt-side"><span class="opt-price">US$0</span></span></span></label>';
  }
  function pickCard(a) {
    const cid = choiceId(a), pick = chosen(a), disabled = state.canWrite === false ? " disabled" : "";
    return '<section class="pick-card" id="pick-' + esc(a.id) + '"><div class="pc-head"><h2>' + esc(a.name) + '</h2>' + (pick ? '<span class="chip final">Picked</span>' : badge("pick")) + '</div>' +
      '<p class="sub">' + esc(pick ? "Your pick: " + pick.label + ". Tap another option to change it; the plan and totals update." : "Still exploring. Pick one option; the plan and totals update.") + '</p>' +
      '<div class="opts" role="radiogroup" aria-label="' + esc(a.name) + '">' + (a.options || []).map((o) => renderOption(a, o, cid, disabled)).join("") + skipOption(a, cid, disabled) + '</div></section>';
  }
  function dayView(r) {
    const ds = sortedDays(), i = ds.findIndex((d) => d.date === r.date);
    if (i < 0) return vhead('<a class="back" href="#days">' + CHEV_L + 'All days</a><h1>Day not found</h1><p class="sub">This date is not in the plan.</p>');
    const day = ds[i], prev = ds[i - 1], next = ds[i + 1], dp = dateParts(day.date);
    const tight = effItems(day).filter((it) => it.move && it.move.short).length;
    const nav = (d, dir) => d ? '<a class="dnav" href="#day/' + d.date + '" aria-label="' + (dir < 0 ? "Previous" : "Next") + ' day, ' + esc(dayLabel(d.date)) + '">' + (dir < 0 ? CHEV_L : "") + '<span>' + esc(dateParts(d.date).dow + " " + dateParts(d.date).d) + '</span>' + (dir > 0 ? CHEV_R : "") + '</a>' : "";
    const bd = dayBreakdown(day), parts = [];
    if (bd.meals) parts.push("Meals " + money(Math.round(bd.meals)) + " (est.)");
    if (bd.tickets) parts.push("Tickets " + money(Math.round(bd.tickets)));
    if (bd.move) parts.push("Getting around " + money(Math.round(bd.move)));
    let h = vhead('<div class="vh-top"><a class="back" href="#days">' + CHEV_L + 'All days</a><div class="dnavs">' + nav(prev, -1) + nav(next, 1) + '</div></div>' +
      '<div class="eyebrow dot">' + esc(dp.dow + " " + dp.d + " " + dp.m + " · Day " + (i + 1) + " of " + ds.length + " · " + (CITY_WORD[day.city] || day.city)) + '</div><h1>' + esc(day.title) + '</h1>' + (day.summary ? '<p class="sub">' + esc(day.summary) + '</p>' : "") +
      '<div class="dh-badges">' + dayStatus(day).map((s) => badge(s)).join("") + (leaveDay(day.date) ? '<span class="chip dayoff" title="' + esc(leaveDay(day.date).why || "") + '">Day off work · ' + money(cur.lv.perDay) + '</span>' : holiday(day.date) ? '<span class="chip holiday" title="' + esc(holiday(day.date).why || "") + '">' + esc(holiday(day.date).label || "Company holiday") + '</span>' : "") + (tight ? '<span class="chip tight">' + tight + ' tight change' + (tight > 1 ? "s" : "") + '</span>' : "") + (hasSteps(day) ? dayChip(day) : "") + '<span class="dh-cost">Day for two: <b>' + money(round2(bd.total)) + '</b></span></div>' +
      '<div class="seg mode" role="group" aria-label="View"><button type="button" data-mode="plan" aria-pressed="' + (dayMode === "plan") + '">Planning</button><button type="button" data-mode="trip" aria-pressed="' + (dayMode === "trip") + '">On the trip</button></div>', day.city);
    h += dayActs(day).filter((a) => a.decision === "exploring").map(pickCard).join("");
    renderTicket.pickAbove = true;
    h += '<section class="day" id="day-' + esc(day.date) + '" style="--city: var(--' + esc(day.city) + ')"><div class="tl-title"><h2>The day</h2><span>' + (dayMode === "trip" ? "On the trip: prices hidden" : "Prices for two") + '</span></div><ol class="tl">' + effItems(day).map((it, j) => renderLeg(it) + renderRow(it, day.city, day.date, j)).join("") + '</ol></section>';
    renderTicket.pickAbove = false;
    h += '<section class="day-total" aria-label="Day total"><span><strong>' + esc(longDow(day.date)) + ' for two</strong><small>' + esc(parts.join(" · ") || "Nothing priced") + (bd.night ? " · plus " + money(Math.round(bd.night)) + " hotel night" : "") + '</small></span><b>' + money(round2(bd.total)) + '</b></section>';
    return h;
  }

  // ---- Today: what is on now, next, later, and today's spend; before the trip a countdown and day 1
  function todayView(r) {
    const n = nowInfo(r.at);
    if (n.phase === "none") return vhead('<h1>Today</h1><p class="sub">No days in the plan yet.</p>');
    if (n.phase === "after") return vhead('<div class="eyebrow">' + esc(tripDatesText()) + '</div><h1>The trip is over</h1><p class="sub">Welcome home. Every day is still in <a href="#days">Days</a>.</p>');
    if (n.phase === "before") {
      const left = daysBetween(n.date, n.first), d1 = n.ds[0];
      const nd = todoItems().filter((x) => !x.done).sort((a, b) => (a.due || "").localeCompare(b.due || ""))[0];
      return vhead('<div class="eyebrow">' + esc(tripDatesText()) + '</div><h1>' + (left === 1 ? "The trip starts tomorrow" : left + " days to go") + '</h1><p class="sub">This screen follows the plan hour by hour once the trip starts on ' + esc(dayLabel(n.first)) + '.</p>') +
        (nd ? deadlineCard(nd, n.date) : "") +
        '<section class="next-card"><span class="kicker">Day 1 · ' + esc(dayLabel(d1.date)) + '</span><h3>' + esc(d1.title) + '</h3><p class="sub">' + esc(d1.summary || "") + '</p>' +
        '<ul class="mini">' + effItems(d1).slice(0, 4).map((it) => '<li><b>' + esc(ampm(it.start)) + '</b><span>' + esc(it.title) + '</span></li>').join("") + '</ul><a class="btn" href="#day/' + d1.date + '">Open day 1' + CHEV_R + '</a></section>';
    }
    const ds = n.ds, day = state.days.get("d-" + n.date) || ds.filter((d) => d.date <= n.date).pop() || ds[0];
    const idx = ds.indexOf(day), dp = dateParts(day.date), items = effItems(day).map((it, i) => Object.assign({}, it, { i }));
    const span = (it) => { const s = toMin(it.start); let e = toMin(it.end); if (e == null) e = s + 30; if (e < s) e += 1440; return [s, e]; };
    const nowIt = items.filter((it) => { const [s, e] = span(it); return s <= n.min && n.min < e; }).pop();
    const upcoming = items.filter((it) => span(it)[0] > n.min && it !== nowIt);
    const nextIt = upcoming[0], later = upcoming.slice(1), done = items.filter((it) => span(it)[1] <= n.min && it !== nowIt);
    const time = (h, m) => { const d = new Date(2000, 0, 1, Math.floor(h / 60) % 24, h % 60); return ampm(String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0")); };
    const strip = ds.slice(Math.max(0, idx - 2), Math.max(0, idx - 2) + 7).map((d) => { const p = dateParts(d.date), on = d === day;
      return '<a href="' + (on ? "#today" : "#day/" + d.date) + '"' + (on ? ' aria-current="page"' : "") + '><span>' + (on ? "Today" : esc(p.dow)) + '</span><b>' + p.d + '</b></a>'; }).join("");
    let h = vhead('<div class="vh-top"><span class="eyebrow dot">Day ' + (idx + 1) + ' of ' + ds.length + ' · ' + esc(CITY_WORD[day.city] || day.city) + '</span><span class="eyebrow">' + esc(dp.dow + " " + dp.d + " " + dp.m + " · " + time(n.min)) + '</span></div><h1>' + esc(day.title) + '</h1><nav class="strip" aria-label="Days">' + strip + '</nav>', day.city);
    const place = (it) => it.place || it.title;
    const maps = (it) => "https://maps.apple.com/?q=" + encodeURIComponent(placeTerm(place(it), it.city || day.city) || place(it));
    const photos = (it) => igSearch(placeTerm(place(it), it.city || day.city) || place(it));
    if (nowIt) {
      const [s, e] = span(nowIt), pct = Math.round(Math.max(0, Math.min(1, (n.min - s) / (e - s))) * 100), left = e - n.min;
      h += '<section class="now-card" aria-label="Now"><div class="nc-top"><span class="live">Now</span><span>' + esc(ampm(nowIt.start)) + (nowIt.end ? " – " + esc(ampm(nowIt.end)) : "") + '</span></div><h2>' + esc(nowIt.title) + '</h2>' + (nowIt.freezing ? '<p class="sub">' + iceBadge(nowIt) + '</p>' : "") +
        (nowIt.place ? '<p class="sub with-ic">' + PIN + esc(nowIt.place) + '</p>' : "") +
        '<div class="prog"><div class="bar"><i style="width:' + pct + '%"></i></div><span>' + esc(durText(left)) + ' left</span></div>' +
        '<div class="btns"><a class="btn dark" href="' + esc(maps(nowIt)) + '" target="_blank" rel="noopener">' + NAVI + 'Directions</a><a class="btn" href="' + esc(photos(nowIt)) + '" target="_blank" rel="noopener">' + CAM + 'Photos</a></div>' +
        '<a class="stay-ref" href="#r-' + day.date + '-' + nowIt.i + '">See it in the day plan</a></section>';
    } else {
      h += '<section class="now-card" aria-label="Now"><div class="nc-top"><span class="live idle">Free time</span></div><h2>Nothing planned right now</h2><p class="sub">' + esc(nextIt ? "Next up at " + ampm(nextIt.start) + "." : "The plan for today is done.") + '</p></section>';
    }
    if (nextIt) {
      const m = nextIt.move, cost = itemCost(nextIt);
      h += '<section class="next-card" aria-label="Next"><span class="kicker">Next · ' + esc(ampm(nextIt.start)) + '</span><h3>' + esc(nextIt.title) + '</h3><div class="meta-row">' +
        (m && m.mode && m.mode !== "none" ? '<span>' + esc((m.label || (MOVE[MODE_ALIAS[String(m.mode).toLowerCase()] || String(m.mode).toLowerCase()] || [m.mode])[0]) + (m.minutes ? " " + durText(m.minutes) : "")) + '</span>' : "") +
        (cost != null && !nextIt.activityId ? '<span>' + esc((nextIt.costEstimate ? "About " : "") + money(round2(nextIt.cost)) + (nextIt.costUnit === "group" ? " for the group" : " each")) + '</span>' : "") +
        (nextIt.halal ? '<span class="halal h-' + esc(nextIt.halal) + '">' + esc(HALAL_TEXT[nextIt.halal] || nextIt.halal) + '</span>' : "") + iceBadge(nextIt) + '</div></section>';
    }
    const tk = dayActs(day).map((a) => ({ a, p: chosen(a), row: items.find((it) => it.activityId === a.id) })).find((x) => x.p && x.row && span(x.row)[1] > n.min);
    if (tk) { const c = costForGroup(tk.p);
      h += '<a class="tk-card" href="#r-' + day.date + '-' + tk.row.i + '"><span class="tk-ic">' + TYPE_ICON.activity + '</span><span><strong>' + esc(tk.a.name) + ' ticket</strong><small>' + esc(tk.p.label + (c ? " · " + money(round2(c)) + " for two" : "")) + '</small></span>' + CHEV_R + '</a>'; }
    if (later.length) h += '<section class="later" aria-label="Later today"><h2 class="cap">Later today</h2><div class="card-list">' + later.map((it) =>
      '<a href="#r-' + day.date + '-' + it.i + '"><b>' + esc(ampm(it.start)) + '</b><span><span class="lt">' + esc(it.title) + '</span>' + (it.place ? '<small>' + esc(it.place) + '</small>' : "") + (it.halal ? '<span class="halal h-' + esc(it.halal) + '">' + esc(HALAL_TEXT[it.halal] || it.halal) + '</span>' : "") + iceBadge(it) + '</span></a>').join("") + '</div></section>';
    if (done.length) h += '<details class="done-earlier"><summary>Done earlier: ' + esc(done.map((it) => it.title.replace(/:.*$/, "")).slice(0, 3).join(", ") + (done.length > 3 ? " and " + (done.length - 3) + " more" : "")) + '</summary><div class="card-list">' + done.map((it) => '<a href="#r-' + day.date + '-' + it.i + '"><b>' + esc(ampm(it.start)) + '</b><span><span class="lt">' + esc(it.title) + '</span></span></a>').join("") + '</div></details>';
    const bd = dayBreakdown(day), cats = [["Meals (est.)", bd.meals, "meal"], ["Tickets", bd.tickets, "ticket"], ["Getting around", bd.move, "move"]].filter((c) => c[1] > 0);
    h += '<section class="summary" aria-label="Spend today"><div class="sum-top"><span class="eyebrow">Today for two</span><span class="value sm">' + money(round2(bd.total)) + '</span></div>' +
      '<div class="sum-bar">' + cats.map((c) => '<span style="flex:' + round2(c[1]) + ' 1 0;background:var(--bar-' + c[2] + ')"></span>').join("") + '</div>' +
      '<div class="sum-legend">' + cats.map((c) => '<span><i style="background:var(--bar-' + c[2] + ')"></i>' + esc(c[0]) + ' <b>' + whole(c[1]) + '</b></span>').join("") + '</div></section>';
    return h;
  }

  // ---- To do
  function deadlineCard(x, today) {
    const left = x.due ? daysBetween(today, x.due) : null;
    return '<section class="deadline" aria-label="Next deadline"><span class="kicker">Next deadline' + (left == null ? "" : left < 0 ? " · " + (-left) + " days late" : left === 0 ? " · today" : " · in " + left + " day" + (left > 1 ? "s" : "")) + '</span><strong>' + esc(x.title + (x.when ? " · " + x.when : "")) + '</strong><span>' + esc(x.note || "") + '</span></section>';
  }
  function todoView() {
    const items = todoItems(), today = isoLocal(new Date()), done = items.filter((x) => x.done).length;
    const disabled = state.canWrite === false ? " disabled" : "";
    const groups = (state.todo && state.todo.groups) || [...new Set(items.map((x) => x.group))];
    const next = items.filter((x) => !x.done).sort((a, b) => (a.due || "").localeCompare(b.due || ""))[0];
    let h = vhead('<div class="eyebrow">' + esc(state.todo && state.todo.checkedOn ? "Checked " + dayLabel(state.todo.checkedOn) + " · nothing booked yet" : "Bookings and deadlines") + '</div><h1>To do</h1><p class="sub">' + done + ' of ' + items.length + ' done. Ticks are saved for everyone who opens this page.</p>');
    if (!items.length) return h + '<div class="state">The to-do list is not added yet.</div>';
    if (next) h += deadlineCard(next, today);
    h += recheckHTML();
    h += groups.map((g) => { const xs = items.filter((x) => x.group === g); if (!xs.length) return "";
      return '<section class="td-group"><h2 class="cap">' + esc(g) + '</h2><div class="card-list td">' + xs.map((x) =>
        '<label class="td-item' + (x.done ? " done" : "") + '"><input type="checkbox" data-todo="' + esc(x.id) + '"' + (x.done ? " checked" : "") + disabled + '><span class="box" aria-hidden="true">' + SVG('<path d="M5 12l5 5 9-10"/>') + '</span>' +
        '<span class="td-main"><span class="when' + (x.urgent && !x.done ? " soon" : "") + '">' + esc(x.when || "") + '</span><strong>' + esc(x.title) + '</strong>' + (x.note ? '<span class="note">' + esc(x.note) + '</span>' : "") +
        (x.chips && x.chips.length ? '<span class="tchips">' + x.chips.map((c) => '<span>' + esc(c) + '</span>').join("") + '</span>' : "") + '</span></label>').join("") + '</div></section>'; }).join("");
    const cd = cancelDeadlines();
    if (cd.length) h += '<section class="td-group"><h2 class="cap">Free cancellation ends</h2><div class="card-list kv">' + cd.map((c) => '<a href="#stay-' + esc(c.id) + '"><b>' + esc(c.date) + '</b><span>' + esc(c.name + " · " + c.time) + '</span></a>').join("") + '</div></section>';
    const legs = ((state.travel && state.travel.legs) || []).filter((l) => !l.countedInDays).slice().sort((a, b) => (a.date + a.depart).localeCompare(b.date + b.depart));
    if (legs.length) h += '<section class="td-group"><h2 class="cap">Flights &amp; trains</h2><div class="card-list legs">' + legs.map((l) => { const c = legCost(l);
      return '<a href="#travel"><span class="lg-top"><span>' + esc(dayLabel(l.date) + " · " + l.number) + '</span><span class="chip ' + esc(l.status) + '">' + esc(STATUS_TEXT[l.status] || l.status) + '</span></span><strong>' + esc(l.from + " → " + l.to) + '</strong><span class="lg-bot"><span>' + esc(ampm(l.depart) + " → " + ampm(l.arrive)) + '</span><b>' + (l.includedIn ? "Included" : l.price == null ? "–" : (l.estimate ? "~" : "") + money(round2(c))) + '</b></span></a>'; }).join("") + '</div></section>';
    return h;
  }

  function hotelsView() {
    const hs = hotels().sort((x, y) => stayDates(x).ci.localeCompare(stayDates(y).ci)), total = hs.reduce((x, a) => x + (costForGroup(chosen(a)) || 0), 0);
    return '<div class="panel">' + '<div class="city-head"><div><h2>Hotels</h2><div class="meta">Refundable rates only. Each card shows the free-cancellation deadline; compare the other hotels inside it.</div></div><div class="sub-total">' + money(round2(total)) + ' for two<small>' + hs.length + ' hotels</small></div></div>' +
      cities().map((c) => { const xs = hs.filter((a) => a.city === c.id); return '<section class="hv-city" style="--city: var(--' + esc(c.id) + ')"><h3 class="cap dot">' + esc(c.name) + '</h3>' + cityGuide(xs) + '<div class="stays">' + (xs.length ? xs.map(renderStay).join("") : '<section class="stay empty"><div class="stay-eyebrow">Where we stay</div><p class="stay-why">Hotel not chosen yet.</p></section>') + '</div></section>'; }).join("") + cvLink(["hotel"], "Earlier hotel options") + '</div>';
  }
  // ---- Local food we skipped: local dishes that were in the plan, kept here to try only if you want (meta/localfood)
  const LF_CITY = { hk: ["Hong Kong", "hk"], macau: ["Macau", "hk"], cq: ["Chongqing", "cq"], hz: ["Hangzhou", "sh"], sh: ["Shanghai", "sh"] };
  function localFoodSection() {
    const items = (state.localfood && state.localfood.items) || []; if (!items.length) return "";
    const order = ["hk", "macau", "cq", "hz", "sh"], list = items.slice().sort((a, b) => (b.mustTry ? 1 : 0) - (a.mustTry ? 1 : 0) || order.indexOf(a.city) - order.indexOf(b.city));
    const card = (f) => { const c = LF_CITY[f.city] || [f.city, "hk"], term = f.place ? placeTerm(f.place, c[1]) : null;
      return '<article class="mcard" style="--dc: var(--' + c[1] + ')"><div class="m-img">' + TYPE_ICON.meal + img(f.image, f.imageCaption || f.dish) +
        '<span class="m-tag">' + esc(c[0]) + (f.mustTry ? ' <span class="chip must">Must-try</span>' : "") + '</span>' +
        (f.cost != null ? '<span class="m-price">' + pill("~" + money(round2(f.cost * travellers())), "meal", (f.costBasis ? f.costBasis + ", " : "") + "estimate for two") + '</span>' : "") +
        (f.image && f.imageKind === "dish" ? '<span class="m-cap">Similar dish' + (f.imageCaption ? ": " + esc(f.imageCaption) : "") + '</span>' : "") + '</div>' +
        '<div class="m-body"><div class="m-title">' + esc(f.dish) + '</div>' + (f.place ? '<div class="m-place">' + esc(f.place) + '</div>' : "") +
        '<div class="m-row">' + (f.halal ? '<span class="halal h-' + esc(f.halal) + '">' + esc(HALAL_TEXT[f.halal] || f.halal) + '</span>' : "") + (f.cuisine ? '<span>' + esc(f.cuisine) + '</span>' : "") +
        (f.inPlan ? '<a href="#day/' + esc(f.inPlan) + '" class="stay-ref" style="--c: var(--' + c[1] + ')">In the plan, ' + esc(dayLabel(f.inPlan)) + ' →</a>' : "") + '</div>' +
        (f.why ? '<p class="m-note">' + esc(f.why) + '</p>' : "") + (!f.inPlan && f.wasOn ? '<div class="m-place">Was planned or offered on ' + esc(dayLabel(f.wasOn)) + '</div>' : "") +
        (term ? iconLinks(term, f.source || null) : "") + '</div></article>'; };
    return '<section class="ml-day ml-local" id="local-food" style="--dc: var(--k-meal)"><h3>Local food we skipped <span class="t">' + list.length + ' dishes</span></h3>' +
      '<p>The plan keeps to international food (Middle Eastern, Turkish, Indian, Italian pasta and pizza) and skips soupy or doubtful dishes. These local dishes were in the first plan. Only the Chongqing hotpot stays as a must-try; the rest are here if you want to try one.</p>' +
      '<div class="ml-grid">' + list.map(card).join("") + '</div></section>';
  }
  function mealsView() {
    const ds = [...new Set(allMeals().filter(mealShown).map((m) => m.d.date))];
    return renderMeals().replace(/<\/div>$/, localFoodSection() + cvLink(["meal"], "Earlier meal options") + '</div>').replace('<div class="ml-head">', '<div class="jump" aria-label="Jump to a day">' + ds.map((date) => { const dp = dateParts(date); return '<button class="daychip" type="button" data-mday="' + esc(date) + '">' + esc(dp.dow) + ' <b>' + dp.d + ' ' + esc(dp.m) + '</b></button>'; }).join("") + '</div><div class="ml-head">');
  }

  // ---- Earlier options (collection "considered"): everything set aside or looked at, kept so Claude Code can switch back.
  // One doc per option: kind, topic, title, status (was-planned | was-picked | looked-at), setAside, why, replacedBy, price (for two), deltaVsPlan, legs, facts, image, restore.
  const CV_KINDS = [["all", "All"], ["flight", "Flights & trains"], ["route", "Route"], ["hotel", "Hotels"], ["meal", "Meals"], ["activity", "Activities"]];
  const CV_STATUS = { "was-planned": ["agreed", "Was in the plan"], "was-picked": ["swapped", "Was your pick"], "looked-at": ["unverified", "Looked at"] };
  const CV_BAR = { flight: "move", route: "move", hotel: "hotel", meal: "meal", activity: "ticket" };
  const isoShort = (iso) => { const dp = dateParts(iso); return dp.d + " " + dp.m; };
  const cvList = () => [...state.considered.values()];
  function cvTopic(e) {
    const m = /^m-(\d{4}-\d{2}-\d{2})-(breakfast|lunch|dinner)$/.exec(e.topic || "");
    return m ? dayLabel(m[1]) + " · " + MEAL_LABEL[m[2]] : e.topic || "Other";
  }
  function cvCard(e) {
    const st = CV_STATUS[e.status] || CV_STATUS["looked-at"];
    const price = e.price != null ? pill((e.priceFrom ? "from " : "") + (e.priceEstimate ? "~" : "") + money(round2(e.price)), CV_BAR[e.kind] || "none", "Price for two when checked") + cap(e.priceLabel || "for two") : "";
    const delta = e.deltaVsPlan ? '<span class="cv-delta' + (e.deltaVsPlan < 0 ? " less" : "") + '">' + money(Math.abs(e.deltaVsPlan)) + (e.deltaVsPlan < 0 ? " less" : " more") + ' than the plan</span>' : "";
    const legs = (e.legs || []).map((l) => '<div class="tv-route"><div><b>' + esc(ampm(l.depart)) + '</b><span>' + esc(l.from) + '</span></div><span class="dur" title="Journey time">' + (l.durationMin ? esc(durText(l.durationMin)) : "–") + '</span><div class="end"><b>' + esc(ampm(l.arrive)) + '</b><span>' + esc(l.to + (l.arriveNextDay ? " · next day" : "")) + '</span></div></div>' +
      '<p class="tv-facts">' + esc([dayLabel(l.date), l.carrier, l.number, l.note].filter(Boolean).join(" · ")) + '</p>').join("");
    const facts = (e.facts || []).map((f) => '<dt>' + esc(f[0]) + '</dt><dd>' + esc(f[1]) + '</dd>').join("");
    const halal = e.halal ? '<span class="halal h-' + esc(e.halal) + '">' + esc(HALAL_TEXT[e.halal] || e.halal) + '</span>' : "";
    const more = [e.place, e.cuisine, e.hours ? "Open " + e.hours : "", e.note].filter(Boolean);
    const ask = e.detailsLost ? "Only the name and reason were kept. Ask Claude Code to look it up again and bring it back."
      : e.restore ? "Ask Claude Code: “Switch " + (e.status === "looked-at" ? "to " : "back to ") + e.title + "”." : "Ask Claude Code to add it to the plan.";
    return '<article class="tv-card cv-card k-' + esc(e.kind) + '" id="cv-' + esc(e.id) + '">' +
      '<div class="cv-top">' + (e.image ? '<img class="cv-th" src="' + esc(e.image) + '" alt="' + esc(e.imageCaption || e.title) + '" loading="lazy" decoding="async" onerror="this.remove()">' : "") +
      '<div class="cv-head"><div class="tv-when"><span class="chip ' + st[0] + '">' + esc(st[1]) + '</span>' + (e.setAside ? '<span>Set aside ' + esc(isoShort(e.setAside)) + '</span>' : "") + '</div>' +
      '<div class="tv-name">' + esc(e.title) + '</div>' + (halal || delta ? '<div class="m-row">' + halal + delta + '</div>' : "") + '</div>' +
      (price ? '<div class="stay-price">' + price + '</div>' : "") + '</div>' +
      legs + '<dl class="tv-kv cv-why">' + facts + (e.why ? '<dt>Why</dt><dd>' + esc(e.why) + '</dd>' : "") + (e.replacedBy ? '<dt>' + (e.status === "looked-at" ? "Plan has" : "Replaced by") + '</dt><dd>' + esc(e.replacedBy) + '</dd>' : "") + (e.deltaNote ? '<dt>Money</dt><dd>' + esc(e.deltaNote) + '</dd>' : "") + '</dl>' +
      (more.length ? '<details><summary>Details</summary><ul class="tv-list">' + more.map((x) => '<li>' + esc(x) + '</li>').join("") + '</ul></details>' : "") +
      ((e.links && e.links.length) || e.imageSource ? '<div class="tv-links">' + (e.links || []).map((x) => '<a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.label) + '</a>').join("") + (e.imageSource ? '<a href="' + esc(e.imageSource) + '" target="_blank" rel="noopener">Photo source</a>' : "") + '</div>' : "") +
      '<div class="cv-ask"><span>' + esc(ask) + '</span><button type="button" class="cv-copy" data-copy="' + esc(e.id) + '" title="Copy the id to paste into Claude Code">' + esc(e.id) + '</button></div>' +
      (e.checkedOn ? '<p class="tv-facts">Prices checked ' + esc(dayLabel(e.checkedOn)) + (e.source ? ' · ' + esc(e.source) : "") + '. Fares change; recheck before switching.</p>' : e.source ? '<p class="tv-facts">Source: ' + esc(e.source) + '</p>' : "") +
      '</article>';
  }
  function consideredView(r) {
    const all = cvList(), kind = r.kind && CV_KINDS.some((k) => k[0] === r.kind) ? r.kind : "all";
    const count = (k) => k === "all" ? all.length : all.filter((e) => e.kind === k).length;
    const shown = all.filter((e) => kind === "all" || e.kind === kind);
    const order = (e) => e.kind === "flight" || e.kind === "route" ? "0" : e.kind === "hotel" ? "1" : e.kind === "activity" ? "2" : "3";
    // Groups in trip order (flights and route first); inside a group, the order Claude wrote them in (best first), then price
    const groups = new Map(), gkey = new Map();
    for (const e of shown) { const t = cvTopic(e); if (!groups.has(t)) groups.set(t, []); groups.get(t).push(e);
      const k = order(e) + (e.date || "9999") + t; if (!gkey.has(t) || k < gkey.get(t)) gkey.set(t, k); }
    for (const xs of groups.values()) xs.sort((a, b) => (a.order ?? 999) - (b.order ?? 999) || (a.price || 0) - (b.price || 0));
    const sortedGroups = [...groups.entries()].sort((a, b) => gkey.get(a[0]).localeCompare(gkey.get(b[0])));
    const intl = ((state.travel && state.travel.legs) || []).filter((l) => /CAI/.test(l.from + l.to));
    const planNote = (t) => t === "International flights" && intl.length ? '<p class="tv-facts">Now in the plan: ' + esc(intl.map((l) => l.number).join(" + ")) + ', ' + money(round2(intl.reduce((s, l) => s + legCost(l), 0))) + ' for two.</p>' : "";
    return '<div class="panel cv" style="--city: var(--subtle)">' +
      '<div class="city-head"><div><h2>Earlier options</h2><div class="meta">Nothing is deleted any more. When the plan changes, the old choice is kept here with its prices and details. To switch back, ask Claude Code; it puts the current choice here in turn.</div></div>' +
      '<div class="sub-total">' + all.length + ' kept<small>' + all.filter((e) => e.status !== "looked-at").length + ' were in the plan or picked</small></div></div>' +
      '<div class="ml-filters" role="group" aria-label="Filter earlier options">' + CV_KINDS.map(([k, l]) => '<a class="ml-f" href="#considered' + (k === "all" ? "" : "/" + k) + '" aria-pressed="' + (kind === k) + '">' + esc(l) + ' <small>' + count(k) + '</small></a>').join("") + '</div>' +
      (shown.length ? sortedGroups.map(([t, xs]) => '<section class="tv-sec"><h3>' + esc(t) + ' <small>' + xs.length + '</small></h3>' + planNote(t) + xs.map(cvCard).join("") + '</section>').join("")
        : '<div class="state">' + (all.length ? "Nothing of this kind was set aside." : "No earlier options yet.") + '</div>') +
      '</div>';
  }
  // A link to the earlier options of one kind, shown at the end of the Flights, Hotels and Meals screens
  function cvLink(kinds, label) {
    const n = cvList().filter((e) => kinds.includes(e.kind)).length; if (!n) return "";
    return '<a class="cv-link" href="#considered/' + kinds[0] + '"><span><b>' + esc(label) + '</b><small>' + n + ' set aside or looked at, with prices and reasons</small></span>' + CHEV_R + '</a>';
  }

  function render() {
    if (!state.activities.size && !state.days.size) return;
    const totalsNow = totals(), tt = travelTotals();
    const lv = leaveTotals();
    cur = { totals: totalsNow, tt, lv, grand: Object.values(totalsNow.t).reduce((s, v) => s + v, 0) + tt.all + lv.total };
    const r = route();
    if (state.meta) $("trip-dates").textContent = state.meta.tripDates || "Hong Kong · Chongqing · Shanghai";
    navHTML(r);
    $("side").innerHTML = sideHTML(r);
    $("extra").innerHTML = budgetHTML() + versionsHTML() + comingUpHTML() + keyHTML();
    const body = r.view === "day" ? dayView(r) : r.view === "today" ? todayView(r) : r.view === "todo" ? todoView() : r.view === "meals" ? mealsView() : r.view === "travel" ? renderTravel() : r.view === "hotels" ? hotelsView() : r.view === "considered" ? consideredView(r) : daysView(r);
    const key = JSON.stringify(r), same = key === lastRouteKey, y = window.scrollY;
    lastRouteKey = key;
    const main = $("main");
    main.className = "view-" + r.view + (r.view === "day" && dayMode === "trip" ? " trip-mode" : "");
    main.innerHTML = body + footHTML();
    document.title = (r.view === "day" ? dayLabel(r.date) : VIEWS[r.view] || "Days") + " · " + brandName();
    $("brand-name").textContent = brandName();
    if (same && !pendingTarget) { window.scrollTo(0, y); return; }
    const target = pendingTarget || (r.city ? "city-" + r.city : null); pendingTarget = null;
    if (target) requestAnimationFrame(() => scrollToId(target, true)); else window.scrollTo(0, 0);
  }

  const smooth = () => matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
  function scrollToId(id, flash) {
    const el = document.getElementById(id); if (!el) return;
    el.scrollIntoView({ behavior: smooth(), block: "start" });
    if (flash && el.matches(".stay, .mcard, .row, .pick-card")) { el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1400); }
  }
  // Move to another screen and then to an element on it; a hash change keeps the browser Back button working
  function go(hash, target) {
    if (decodeURIComponent(location.hash.slice(1)) === hash) { pendingTarget = null; scrollToId(target, true); return; }
    pendingTarget = target || null; location.hash = hash;
  }

  document.addEventListener("click", (e) => {
    if (!e.target.closest) return;
    const sw = e.target.closest(".swap-ref");
    if (sw) { e.preventDefault(); mealFilter = "all"; stomachFilter = "any"; openSet.add("meal:" + sw.dataset.meal); go("meals", "meal-" + sw.dataset.meal); return; }
    const a = e.target.closest('a[href^="#"]');
    if (a) {
      const href = decodeURIComponent(a.getAttribute("href").slice(1)); let m;
      if ((m = /^r-(\d{4}-\d{2}-\d{2})-\d+$/.exec(href))) { e.preventDefault(); go("day/" + m[1], href); return; }
      if (/^stay-/.test(href)) { e.preventDefault(); go("hotels", href); return; }
      if (/^(pick|mday|city|day)-/.test(href)) { e.preventDefault(); scrollToId(href, true); return; }
      if (CITY_ORDER.includes(href) && route().view === "days") { e.preventDefault(); history.replaceState(null, "", "#" + href); scrollToId("city-" + href); return; }
      if (!href) { e.preventDefault(); return; }
      return;
    }
    const md = e.target.closest("[data-mode]");
    if (md) { dayMode = md.dataset.mode; try { localStorage.setItem("dayMode", dayMode); } catch (_) {} render(); return; }
    const mf = e.target.closest(".ml-f");
    if (mf && mf.dataset.sf) { stomachFilter = mf.dataset.sf; try { localStorage.setItem("stomachFilter", stomachFilter); } catch (_) {} render(); return; }
    if (mf) { mealFilter = mf.dataset.mf; try { localStorage.setItem("mealFilter", mealFilter); } catch (_) {} render(); return; }
    const cp = e.target.closest(".cv-copy");
    if (cp) { const id = cp.dataset.copy, done = () => { cp.textContent = "Copied"; setTimeout(() => { cp.textContent = id; }, 1400); };
      try { navigator.clipboard.writeText(id).then(done, () => {}); } catch (_) {} const rg = document.createRange(); rg.selectNodeContents(cp); const sl = getSelection(); sl.removeAllRanges(); sl.addRange(rg); return; }
    const mchip = e.target.closest("[data-mday]");
    if (mchip) { scrollToId("mday-" + mchip.dataset.mday); return; }
  });
  window.addEventListener("hashchange", () => render());
  document.addEventListener("toggle", (e) => {
    const d = e.target; if (!(d instanceof HTMLDetailsElement) || !d.dataset.key) return;
    if (d.open) { openSet.add(d.dataset.key); closedSet.delete(d.dataset.key); } else { openSet.delete(d.dataset.key); closedSet.add(d.dataset.key); }
  }, true);
  async function saveChoice(id, value) {
    state.choices.set(id, value); render();
    if (state.db && state.canWrite !== false) {
      try { await state.db.doc("choices/" + id).set({ optionId: value, updatedAt: new Date().toISOString() }); }
      catch (err) { if (err && err.code === "invalid_argument") { state.canWrite = false; render(); } }
    }
  }
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (!(t instanceof HTMLInputElement)) return;
    if (t.type === "checkbox" && t.dataset.todo) { saveChoice("todo-" + t.dataset.todo, t.checked ? "done" : "open"); return; }
    if (t.type !== "radio" || !t.name.startsWith("pick-")) return;
    const id = t.name.slice(5), value = t.value;
    if (state.choices.get(id) === value) return;
    saveChoice(id, value);
  });

  function showState(msg) { if (state.activities.size || state.days.size) return; $("main").innerHTML = '<div class="state">' + esc(msg) + '</div>'; }

  async function start() {
    if (!window.claude || typeof window.claude.use !== "function") { showState("Open this page on claude.ai to see the trip plan."); return; }
    const db = await window.claude.use("db");
    if (!db) { showState("Sign in to claude.ai to see the trip plan."); return; }
    state.db = db;
    try { const user = await window.claude.use("user"); if (user && typeof user.can === "function") { const can = await user.can("data.write"); state.canWrite = can === null ? null : !!can; } } catch (_) {}
    const timer = setTimeout(() => { if (!state.got) showState("The trip data can't be reached yet. It will appear once the connection returns."); }, 10000);
    const fail = (err) => { clearTimeout(timer); showState("The trip data couldn't be loaded (" + (err && err.code) + ")."); };
    db.collection("activities").onSnapshot((snap) => {
      state.activities.clear(); snap.docs.forEach((d) => { const v = d.data(); if (v) state.activities.set(d.id, Object.assign({ id: d.id }, v)); });
      if (!snap.metadata.fromCache) { state.got = true; clearTimeout(timer); }
      render();
    }, fail);
    db.collection("days").onSnapshot((snap) => {
      state.days.clear(); snap.docs.forEach((d) => { const v = d.data(); if (v) state.days.set(d.id, Object.assign({ id: d.id }, v)); });
      if (!snap.metadata.fromCache && !state.days.size && !state.activities.size) showState("No days yet. Ask Claude to add the trip plan.");
      render();
    }, fail);
    db.doc("meta/trip").onSnapshot((snap) => { state.meta = snap.exists ? snap.data() : null; render(); }, () => {});
    db.doc("meta/travel").onSnapshot((snap) => { state.travel = snap.exists ? snap.data() : null; render(); }, () => {});
    db.doc("meta/localfood").onSnapshot((snap) => { state.localfood = snap.exists ? snap.data() : null; render(); }, () => {});
    db.doc("meta/todo").onSnapshot((snap) => { state.todo = snap.exists ? snap.data() : null; render(); }, () => {});
    db.collection("considered").onSnapshot((snap) => {
      state.considered.clear(); snap.docs.forEach((d) => { const v = d.data(); if (v) state.considered.set(d.id, Object.assign({ id: d.id }, v)); }); render();
    }, () => {});
    db.collection("choices").onSnapshot((snap) => {
      state.choices.clear(); snap.docs.forEach((d) => { const v = d.data(); if (v && v.optionId) state.choices.set(d.id, v.optionId); }); render();
    }, () => {});
  }
  start();
})();
</script>
<style>
.inst { position: fixed; left: 12px; right: 12px; bottom: calc(72px + env(safe-area-inset-bottom)); z-index: 30; display: none; align-items: center; gap: 12px;
  padding: 12px 12px 12px 14px; background: var(--surface, #fff); color: var(--ink, #111827); border: 1px solid var(--line, #e5e7eb); border-radius: 16px;
  box-shadow: 0 8px 28px rgba(0,0,0,.16); font: 14px/1.35 Inter, system-ui, sans-serif; max-width: 520px; margin: 0 auto; }
.inst.on { display: flex; }
.inst img { width: 40px; height: 40px; border-radius: 10px; flex: none; }
.inst .t { flex: 1; min-width: 0; }
.inst .t b { display: block; font-weight: 600; }
.inst .t span { color: var(--muted, #4b5563); }
.inst .share { display: inline-block; width: 16px; height: 16px; vertical-align: -3px; }
.inst button { font: inherit; border: 0; cursor: pointer; }
.inst .go { background: var(--accent, #1d4ed8); color: #fff; font-weight: 600; padding: 10px 16px; border-radius: 10px; min-height: 44px; }
.inst .no { background: none; color: var(--muted, #4b5563); width: 44px; height: 44px; border-radius: 10px; font-size: 22px; line-height: 1; flex: none; }
@media (min-width: 900px) { .inst { bottom: 20px; } }
</style>
<div class="inst" id="inst" role="dialog" aria-label="Install the app">
  <img src="icons/icon-192.png" alt="">
  <div class="t" id="inst-t"></div>
  <button class="go" id="inst-go" hidden>Install</button>
  <button class="no" id="inst-no" aria-label="Not now">&times;</button>
</div>
<script>
(() => {
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (standalone) return;
  const KEY = 'trip-install-later';
  try { if (Date.now() < +localStorage.getItem(KEY)) return; } catch (_) {}
  const box = document.getElementById('inst'), t = document.getElementById('inst-t'), go = document.getElementById('inst-go');
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const shareIcon = '<svg class="share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
  let deferred = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault(); deferred = e;
    t.innerHTML = '<b>Install China trip</b><span>Opens from your home screen and works offline.</span>';
    go.hidden = false; box.classList.add('on');
  });
  go.addEventListener('click', async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice.catch(() => {}); deferred = null; box.classList.remove('on'); });
  window.addEventListener('appinstalled', () => box.classList.remove('on'));
  document.getElementById('inst-no').addEventListener('click', () => {
    box.classList.remove('on'); try { localStorage.setItem(KEY, String(Date.now() + 3 * 864e5)); } catch (_) {}
  });
  if (ios) {
    t.innerHTML = '<b>Add China trip to your home screen</b><span>Tap Share ' + shareIcon + ' (or <b style="display:inline">&middot;&middot;&middot;</b> then Share), then <b style="display:inline">Add to Home Screen</b>.</span>';
    box.classList.add('on');
  }
})();
</script></body></html>
