. Super Nintendo World only with the free app timed entry, which can run out.","url":"https://www.trip.com/travel-guide/attraction/osaka/universal-studios-japan-81012?curr=USD&locale=en-US"},{"id":"ex4","label":"1-Day Pass + Express Pass 4: Flying Dinosaur & Minecart","price":186,"unit":"person","trips":1,"status":"available","recommended":false,"duration":"Full day","time":"Express times printed on the pass","note":"Trip.com: 1-Day Pass US$68 + Express Pass 4 \"Flying Dinosaur & Minecart\" US$118 for 1 Jan (both non-refundable). Express Pass 8 from US$403 that day.","url":"https://www.trip.com/travel-guide/attraction/osaka/universal-studios-japan-81012?curr=USD&locale=en-US"}]}],"days":[["d-2026-12-24",{"date":"2026-12-24","city":"tyo","order":0,"title":"Leave Cairo","summary":"Night flight: EgyptAir nonstop to Tokyo Narita at 11:45 pm, after the workday (24 Dec is a working day).","items":[{"start":"20:30","end":null,"type":"transit","title":"Leave for Cairo Airport, Terminal 3","note":"Be at Terminal 3 by about 8:45 pm, 3 hours before the flight. EgyptAir includes two checked bags of 23 kg and one 8 kg cabin bag each on this fare. Carry the passports with the Japan visa, the hotel bookings and the printed return ticket: Japanese immigration can ask for them.","steps":1500,"stepsWhy":"Check-in, security and the walk to the gate at Cairo airport"},{"start":"23:45","end":"18:30","type":"travel","title":"EgyptAir MS964, nonstop: Cairo → Tokyo Narita","durationMin":705,"note":"11 h 45 min nonstop, landing at 6:30 pm on Fri 25 Dec (Tokyo is 7 hours ahead of Cairo). Sleep as much as you can: you land in the evening. Already counted under Flights & visa.","steps":1500,"stepsWhy":"Aisle walks on a 12-hour flight"}]}],["d-2026-12-25",{"date":"2026-12-25","city":"tyo","order":1,"title":"Arrive in Tokyo","summary":"Christmas Day: land at Narita at 6:30 pm, Narita Express to Tokyo Station, a late dinner there and check in at lyf Ginza.","items":[{"start":"18:30","end":"19:30","type":"travel","title":"Land at Narita Terminal 1: immigration, bags and train tickets","note":"Fill in Visit Japan Web on the phone before landing: it gives the QR codes for immigration and customs. In the arrivals hall, buy the Narita Express round-trip ticket for foreign visitors at the JR East Travel Service Center or the ticket machines (passport needed), and a Welcome Suica card each for metro rides (top up ¥3,000 each to start).","steps":2000,"stepsWhy":"Gate to immigration, bags and the walk to the station under Terminal 1"},{"start":"19:49","end":"20:51","type":"transit","title":"Narita Express to Tokyo Station","place":"Narita Express (N'EX)","cost":32.55,"costUnit":"person","costBasis":"¥5,200 each: N'EX round-trip ticket for foreign visitors, the return on 3 Jan included","costSource":"N'EX TOKYO Round Trip Ticket for non-Japanese passport holders, ¥5,200 (JR East; price not confirmed on 20 Nov). A single ride is ¥3,140 (fare ¥1,410 + reserved seat ¥1,730).","note":"About 55–60 min to Tokyo Station, reserved seats, luggage racks at the car ends. Trains run about every 30–60 min in the evening: take the first one after you clear customs. The round-trip ticket covers the ride back to Narita on 3 Jan (valid 14 days).","steps":300,"stepsWhy":"Seated on the train"},{"start":"20:55","end":"21:30","type":"meal","title":"Dinner: vegan ramen at T's Tantan, Tokyo Station","place":"T's Tantan (Gransta Tokyo), Gransta Tokyo B1F (Square Zero area), JR Tokyo Station, 1-9-1 Marunouchi, Chiyoda-ku, Tokyo 100-0005","cuisine":"Vegan ramen (sesame tantanmen, yuzu salt ramen, vegan gyoza)","halal":"vegetarian","halalSource":"Fully vegan ramen shop (no meat, fish, egg or dairy). Beer is sold (Heartland ¥800). No pork or meat anywhere on the menu. (https://ts-restaurant.jp/tantan/)","hours":"Every day 10:00 am – 10:00 pm (last order 9:30 pm)","walkMin":4,"walkFrom":"Tokyo Station Yaesu exit","stomach":"easy","stomachWhy":"light vegetable yuzu salt broth","note":"Tight on 25 Dec: the Narita Express that fits after landing (7:49 pm) reaches Tokyo at 8:51 pm, and the last order is 9:30 pm. If you are late, go to Soranoiro (the alternative, last order 10:30 pm). Keep the suitcases at the table if there is room, or use the large coin lockers next to Gransta (about ¥700–900). Order: Japanese Yuzu Sio (salt) Ramen ¥1,250 for a light bowl, or Golden Sesame Tantanmen ¥1,250 (not marked hot); skip the black sesame (hot) version; 3 or 6 gyoza to share. The shop moved on 1 Aug 2026 from Keiyo Street (inside the gates) to Gransta Tokyo B1F, outside the gates; older guides still give the old spot. Last order is 9:30 pm, so they must be in the queue by about 9:15 pm; arriving at Tokyo Station at 8:15 pm leaves enough time, but with only about 12 seats a Friday queue is possible. If the line is long, Soranoiro Nippon (Tokyo Ramen Street, same basement) is open until 10:30 pm. Inside the station basement, so no outdoor walk with luggage before dinner;","cost":10.33,"costEstimate":true,"costBasis":"¥1,650 each: Japanese yuzu salt ramen or golden sesame tantanmen ¥1,250 + 3 vegan gyoza ¥400 (Oct 2026 menu)","costSource":"https://www.happycow.net/reviews/ts-tantan-tokyo-29533","rating":"HappyCow 5.0 (1,071 reviews); Google and Tabelog not found","mealId":"m-2026-12-25-dinner","meal":"dinner","steps":400,"stepsWhy":"About 4 min from the Narita Express platform to Gransta B1F","alts":[{"id":"soranoiro-nippon-tokyo-ramen-street","title":"Dinner: vegan ramen at Soranoiro, Tokyo Ramen Street","place":"Soranoiro Nippon (Tokyo Ramen Street), Tokyo Ramen Street, Tokyo Station Ichibangai B1F, unit R-2, 1-9-1 Marunouchi, Chiyoda-ku, Tokyo 100-0005","cuisine":"Ramen with a vegan menu (vegan ramen, vegan tantanmen, vegan gyoza)","halal":"vegetarian","halalSource":"Only the vegan bowls qualify; the shop also sells non-vegan ramen. Past reviewers said a 'vegetarian' broth contained shellfish or butter, so order an item labelled vegan. Alcohol not confirmed. (https://www.happycow.net/reviews/soranoiro-tokyo-120511)","hours":"Every day 9:00 am – 11:00 pm (last order 10:30 pm)","walkMin":3,"walkFrom":"Tokyo Station Yaesu exit","stomach":"easy","stomachWhy":"light vegetable broth ramen","note":"Order: The vegan shio (salt) or shoyu ramen; ask staff to confirm it is the vegan broth. Later closing than T's Tantan, which makes it the fallback if they arrive late or the T's Tantan queue is long. Some reviewers found the vegan ramen less tasty than other vegan ramen in Tokyo. Tokyo Ramen Street is in the Yaesu-side basement, so the walk on to the hotel, lyf Ginza Tokyo (2-5-4 Kyobashi), is about 8-10 minutes via the Yaesu exit. Do not confuse it with the Soranoiro branch in Kyobashi, which serves pork tonkotsu ramen.","cost":8.76,"costEstimate":true,"costBasis":"¥1,400 each: one vegan ramen bowl (exact 2026 price not confirmed)","costSource":"https://www.happycow.net/reviews/soranoiro-tokyo-120511","rating":"HappyCow 3.5 (107 reviews); Google not found","steps":200,"stepsWhy":"About 1 min closer each way than the planned meal"},{"id":"gyumon-halal-ramen-ginza","title":"Dinner: halal wagyu ramen at Gyumon, Ginza","place":"Gyumon Halal Ramen Ginza, B1F Kotobuki Building No.2, 6-12-1 Ginza, Chuo-ku, Tokyo 104-0061","cuisine":"Halal wagyu ramen","halal":"unconfirmed","halalSource":"TableCheck page says it uses A5-grade halal wagyu and that Muslim customers can dine with peace of mind; no certifying body named; alcohol not mentioned. (https://www.tablecheck.com/gyumon-ramen-ginza)","hours":"Fri hours not confirmed (the TableCheck booking calendar offers a 7:00 pm table)","walkMin":20,"walkFrom":"Tokyo Station Yaesu exit","stomach":"rough","stomachWhy":"rich creamy beef broth","note":"Order: The beef broth ramen with halal wagyu; skip the spicy miso version. Booking: recommended: TableCheck https://www.tablecheck.com/gyumon-ramen-ginza or phone 03-6264-5519. The only halal-meat option found near Tokyo Station that may be open late, but closing time is not confirmed. It is outside the preferred area: Ginza 6-chome is south of the hotel, about 20 minutes on foot from the Yaesu exit and about 15 minutes back north to the hotel, lyf Ginza Tokyo (2-5-4 Kyobashi). Only worth it by taxi, after dropping the luggage at the hotel. Call before going. Mazulu Halal Beef Noodle at Tokyo Station closed in Sept 2020.","cost":18.78,"costEstimate":true,"costBasis":"¥3,000 each: wagyu ramen, about ¥3,000 per person (TableCheck budget)","costSource":"https://www.tablecheck.com/gyumon-ramen-ginza","rating":"not found","steps":3600,"stepsWhy":"About 16 min further each way than the planned meal"}]},{"start":"21:35","end":"21:55","type":"transit","title":"Taxi from Tokyo Station to the hotel","cost":6.26,"costUnit":"group","costEstimate":true,"costBasis":"¥1,000, estimate (about 1 km)","note":"Take the Yaesu South exit to the taxi rank. With suitcases a taxi is easier than the 10 min walk. Tokyo taxis take cards and IC cards; the back door opens by itself.","steps":600,"stepsWhy":"Gransta to the Yaesu taxi rank, about 4 min underground"},{"start":"21:55","end":"22:15","type":"hotel","title":"Check in at lyf Ginza Tokyo","activityId":"jp-hotel-tyo","role":"checkin","note":"Send the hotel a message on Booking.com that you arrive around 10 pm. You pay at the hotel; free cancellation until the end of 23 Dec.","steps":200,"stepsWhy":"Lobby and room"}]}],["d-2026-12-26",{"date":"2026-12-26","city":"tyo","order":2,"title":"Asakusa, Meiji Jingu and Shibuya Sky at sunset","summary":"Senso-ji in the morning (Saturday), lunch in Asakusa, Meiji Jingu shrine and Harajuku, Shibuya Sky as the sun sets, the Shibuya Crossing and dinner in Shibuya.","items":[{"start":"08:30","end":"09:10","type":"meal","title":"Breakfast: croissant and coffee at Starbucks, Kyobashi Edogrand","place":"Starbucks Coffee Kyobashi Edogrand, Kyobashi Edogrand, 2-2-1 Kyobashi, Chuo-ku","cuisine":"Coffee chain; pastries","halal":"vegetarian","halalSource":"Coffee and a plain pastry; skip ham or bacon items. Croissant availability varies by store (not confirmed). (https://store.starbucks.co.jp/detail-1357/)","hours":"Mon - Fri 7:00 am - 10:00 pm; Sat 8:00 am - 8:00 pm; Sun and holidays 9:00 am - 8:00 pm","walkMin":4,"walkFrom":"lyf Ginza Tokyo (2-5-4 Kyobashi)","stomach":"easy","stomachWhy":"plain pastry and coffee","note":"Order: Latte and a croissant or scone","cost":5.63,"costEstimate":true,"costBasis":"¥900 each: latte and pastry, about ¥900 (estimate)","costSource":"https://store.starbucks.co.jp/detail-1357/","rating":"not found","mealId":"m-2026-12-26-breakfast","meal":"breakfast","steps":800,"stepsWhy":"About 4 min walk each way between the hotel and the café","alts":[{"id":"sbux-tofrom-yaesu","title":"Breakfast: croissant and coffee at Starbucks, TOFROM Yaesu Tower","place":"Starbucks Coffee TOFROM Yaesu Tower, B1F TOFROM YAESU TOWER, 1-6-1 Yaesu, Chuo-ku","cuisine":"Coffee chain; pastries","halal":"vegetarian","halalSource":"Coffee and a plain pastry; skip ham or bacon items. Croissant availability varies by store (not confirmed). (https://store.starbucks.co.jp/detail-4584/)","hours":"Temporary hours 16 Nov - 31 Dec 2026: every day 7:00 am - 10:30 pm (normally Mon - Fri 7:00 am, Sat, Sun and holidays 8:00 am)","walkMin":7,"walkFrom":"lyf Ginza Tokyo (2-5-4 Kyobashi)","stomach":"easy","stomachWhy":"plain pastry and coffee","note":"Order: Latte and a croissant or scone","cost":5.63,"costEstimate":true,"costBasis":"¥900 each: latte and pastry, about ¥900 (estimate)","costSource":"https://store.starbucks.co.jp/detail-4584/","rating":"not found","steps":1400,"stepsWhy":"About 3 min further each way than the planned meal"},{"id":"city-bakery-oazo","title":"Breakfast: croissant and coffee at The City Bakery, Marunouchi OAZO","place":"THE CITY BAKERY Marunouchi OAZO, B1F Marunouchi OAZO, 1-6-4 Marunouchi, Chiyoda-ku, Tokyo","cuisine":"Bakery café: croissants (including the pretzel croissant), coffee","halal":"vegetarian","halalSource":"Bakery and café; order plain or almond croissant and coffee. The breakfast plates include bacon, so skip the plates. (https://www.thecitybakery.jp/shop/)","hours":"Mon - Sat 7:00 am - 10:00 pm; Sun and holidays 7:00 am - 9:00 pm","walkMin":15,"walkFrom":"lyf Ginza Tokyo (2-5-4 Kyobashi)","stomach":"easy","stomachWhy":"plain pastry and coffee","note":"Order: Pretzel croissant or plain croissant with a latte","cost":5.63,"costEstimate":true,"costBasis":"¥900 each: croissant and coffee, about ¥900 (estimate, menu prices not checked)","costSource":"https://www.thecitybakery.jp/shop/","rating":"not found","steps":3000,"stepsWhy":"About 11 min further each way than the planned meal"}]},{"start":"09:30","end":"11:45","type":"sight","title":"Senso-ji Temple and Nakamise Street, Asakusa","move":{"mode":"metro","minutes":25,"cost":1.31,"costUnit":"person","local":"¥209","route":"Walk 2 min to Kyobashi station, Ginza line to Asakusa (about 17 min), then the Kaminarimon gate is next to exit 1.","source":"fare from the operator's fare table (IC card fare)","estimate":false},"note":"Tokyo's oldest temple, free. The grounds are always open; the main hall 6:00 am – 5:00 pm. Walk in through the Kaminarimon gate and its giant lantern, then Nakamise Street (souvenir and snack stalls, open about 10:00 am), the five-storey pagoda and the main hall. Saturday mornings get busy after 10:30 am.","steps":4600,"stepsWhy":"Station corridors, then about 2 h walking the temple grounds, Nakamise and the side streets"},{"start":"12:00","end":"13:00","type":"meal","title":"Lunch: halal wagyu ramen at Shunpudou, Asakusa","place":"Halal Wagyu Ramen & Beef Cutlet Shunpudou, 3F Asakusa Heiwa Store Building, 2-6-11 Asakusa, Taito-ku, Tokyo 111-0032","cuisine":"Halal wagyu ramen and gyukatsu (wagyu beef cutlet)","halal":"halal-certified","halalSource":"Official site: 'We only use Halal-certified ingredients' and no alcohol or inappropriate animal-derived ingredients. The certifier of the restaurant itself is not named. Savor Japan lists a prayer room and washing facilities. Also has a labelled vegan ramen. (https://shunpudou.com/)","hours":"Sat 11:00 am - 10:00 pm (last order 9:30 pm); open every day","walkMin":5,"walkFrom":"Senso-ji main hall","stomach":"easy","stomachWhy":"non-spicy chicken broth ramen","note":"Order: White Broth A5 Wagyu Ramen (or Clear Broth Chicken Ramen for the lightest bowl); share one A5 wagyu cutlet set if hungry; skip the spicy and fried-chicken ramen. Booking: recommended: Savor Japan online booking https://savorjapan.com/0004038871 or phone 03-5830-6700 (small third-floor room). Hard to spot from the street: it is on the 3rd floor. One reviewer called it a bit pricey, another good value. The gyukatsu (fried wagyu cutlet) is the 'rough' option; the ramen is the easy one.","cost":21.91,"costEstimate":true,"costBasis":"¥3,500 each: A5 wagyu ramen or wagyu cutlet set; Savor Japan average lunch spend ¥3,500 (menu prices not published online)","costSource":"https://shunpudou.com/","rating":"HappyCow 4.0 (8 reviews); Gurunavi 5-star review Jan 2026; Tripadvisor 45 reviews (score not read); Google not found","mealId":"m-2026-12-26-lunch","meal":"lunch","steps":600,"stepsWhy":"About 5 min from Senso-ji to the restaurant (3rd floor)","alts":[{"id":"asakusa-sushiken","title":"Lunch: halal sushi at Sushiken, Asakusa","place":"Asakusa Sushiken, 2-11-4 Asakusa, Taito-ku, Tokyo 111-0032","cuisine":"Halal sushi and Japanese rice bowls","halal":"halal-certified","halalSource":"Listed as Halal Certified on Halal Gourmet; described as Tokyo's first halal-certified sushi restaurant, with halal soy sauce and rice seasoning. Certifier not named; alcohol not confirmed. (https://halalgourmet.jp/restaurant/640)","hours":"Sat 12:00 pm - 3:00 pm (last order 2:30 pm), dinner 5:00 pm - 10:00 pm; closed Wednesday","walkMin":5,"walkFrom":"Senso-ji main hall","stomach":"easy","stomachWhy":"light nigiri, nothing fried","note":"Order: A lunch nigiri set; the tendon (tempura bowl) is the fried option. Booking: recommended: phone 03-5246-6547. Raw fish. Call to confirm it is still open and the Saturday lunch hours (Zabihah shows 12:00 pm - 10:00 pm without a break).","cost":13.77,"costEstimate":true,"costBasis":"¥2,200 each: lunch sushi set (lunch menus ¥1,200 - ¥2,200, Coto Academy Dec 2025)","costSource":"https://halalgourmet.jp/restaurant/640","rating":"not found","steps":600,"stepsWhy":"About the same walk as the planned meal"},{"id":"shinjukutei-asakusa","title":"Lunch: halal wagyu ramen at Shinjuku-tei, Asakusa","place":"Halal Wagyu Ramen Shinjuku-tei Asakusa, 2F YN Building, 1-10-2 Asakusa, Taito-ku, Tokyo","cuisine":"Halal wagyu ramen","halal":"halal-certified","halalSource":"Savor Japan: all ingredients 100% halal, prayer room, Muslim staff; the chain's TableCheck pages say 100% halal-certified ramen, free from pork and alcohol. Certifier not named. (https://savorjapan.com/0004038970)","hours":"Sat 12:00 pm - 9:00 pm (same every day; last order not listed)","walkMin":8,"walkFrom":"Senso-ji main hall","stomach":"easy","stomachWhy":"non-spicy shoyu ramen","note":"Order: Shoyu or paitan A5 wagyu ramen; skip the Spicy Red. Booking: recommended: Savor Japan online booking https://savorjapan.com/0004038970. Opens at 12:00 pm, so a 12:30 pm lunch fits. Same chain as the Shibuya dinner pick; choose one of the two to avoid the same ramen twice in a day.","cost":21.91,"costEstimate":true,"costBasis":"¥3,500 each: A5 wagyu ramen ¥3,500 (chain price on TableCheck); Savor Japan average ¥4,000","costSource":"https://savorjapan.com/0004038970","rating":"not found","steps":1200,"stepsWhy":"About 3 min further each way than the planned meal"}]},{"start":"13:50","end":"14:50","type":"sight","title":"Meiji Jingu shrine","move":{"mode":"metro","minutes":40,"cost":1.58,"costUnit":"person","local":"¥252","route":"Ginza line from Asakusa to Omotesando (about 30 min), Chiyoda line one stop to Meiji-jingumae (Harajuku), then the shrine gate is next to the station.","source":"fare from the operator's fare table (IC card fare)","estimate":false},"note":"Free. The shrine to Emperor Meiji in a forest in the middle of the city: a 10 min walk on gravel under huge torii gates to the main hall. In December the gates open at 6:40 am and close at 4:00 pm (sunset), so go by about 3:00 pm.","steps":3500,"stepsWhy":"Gravel forest path about 10 min each way, plus the shrine courtyard"},{"start":"14:55","end":"15:30","type":"shopping","title":"Takeshita Street, Harajuku","optional":true,"move":{"mode":"walk","minutes":5,"cost":0,"costUnit":"person","local":"","route":"From the shrine gate across the road to Takeshita Street.","source":"estimate from OpenStreetMap positions","estimate":true},"note":"Optional: the narrow street of crêpe stands, fashion and character shops, very crowded on Saturdays. Omotesando avenue next to it has the big brands.","steps":1500,"stepsWhy":"Optional: about 30 min along the street"},{"start":"15:45","end":"17:15","type":"activity","title":"Shibuya Sky at sunset","activityId":"jp-shibuya-sky","move":{"mode":"train","minutes":12,"cost":1,"costUnit":"person","local":"¥160","route":"JR Yamanote line from Harajuku to Shibuya (2 min), then follow the signs to Shibuya Scramble Square; the ticket floor is the 14th.","source":"JR East fare table (IC card)","estimate":false},"note":"Book the 3:40 pm or 4:00 pm entry slot: sunset is about 4:34 pm, and you stay on the open-air roof as the city lights come on. Bags go in free lockers before the roof; hats and loose items are not allowed up there. Dress warmly: it is windy at 229 m.","steps":1300,"stepsWhy":"Lifts, then about an hour walking around the open roof deck"},{"start":"17:20","end":"17:50","type":"sight","title":"Shibuya Crossing and the Hachiko statue","move":{"mode":"walk","minutes":5,"cost":0,"costUnit":"person","local":"","route":"Down from Scramble Square to the Hachiko exit side of the station.","source":"estimate from OpenStreetMap positions","estimate":true},"note":"Free. Cross the scramble a couple of times, then look down on it from the second-floor windows of the Shibuya station passage (the Mark City walkway) or the MAGNET building's rooftop.","steps":1500,"stepsWhy":"About 30 min crossing and walking around the square"},{"start":"18:15","end":"19:30","type":"meal","title":"Dinner: Turkish at Ankara, Dogenzaka, Shibuya","place":"Turkish Restaurant Ankara (Dogenzaka), B1F Sosial Dogenzaka, 1-14-9 Dogenzaka, Shibuya-ku, Tokyo","cuisine":"Turkish (kebabs, meze, bread)","halal":"pork-free","halalSource":"Zabihah lists it as fully halal, confirmed by the owners; Turkish owner-chef since 1988 (Retty). No certificate found. Alcohol likely served (not confirmed). (https://www.zabihah.com/restaurants/c9f06032-7767-11ef-95ae-6045bdeb9f57/ankara-shibuya-ku-tky-to)","hours":"Saturdays 5:00 pm – 12:00 am (last order 11:15 pm); 26 Dec bookable on Tabelog","walkMin":7,"walkFrom":"Shibuya Sky (Shibuya Scramble Square)","stomach":"easy","stomachWhy":"grilled kebab, ask for chicken","note":"Order: Grilled chicken or lamb shish kebab with bread and a cold meze plate; check the menu on the day. Booking: recommended for Saturday: phone 03-3780-1366. Chosen over halal ramen because lunch the same day is ramen and Turkish is on the preferred cuisine list. The Miyamasuzaka branch of Ankara is closed; go to the Dogenzaka branch. Tabelog still shows an old notice of shortened hours (5:00 pm - 10:00 pm), which still covers 6:30 pm.","cost":25.04,"costEstimate":true,"costBasis":"¥4,000 each: kebab main with meze and bread (Tabelog listed budget ¥3,000 - ¥3,999; reviewers with drinks spent more)","costSource":"https://tabelog.com/en/tokyo/A1303/A130301/13003394/","rating":"Tabelog 3.39 (207 reviews); Google not found","mealId":"m-2026-12-26-dinner","meal":"dinner","steps":800,"stepsWhy":"About 7 min from the Shibuya Crossing up Dogenzaka","alts":[{"id":"shinjukutei-shibuya","title":"Dinner: halal wagyu ramen at Shinjuku-tei, Shibuya","place":"Halal Wagyu Ramen Shinjuku-tei Shibuya, B1F DIX Jinnan Building, 1-17-2 Jinnan, Shibuya-ku, Tokyo 150-0041","cuisine":"Halal wagyu ramen","halal":"halal-certified","halalSource":"TableCheck lists it as Halal Certified with 100% halal-certified ramen, free from pork and alcohol; prayer room and Muslim staff (Savor Japan). Certifier not named. (https://www.tablecheck.com/en/shinjukutei-shibuya)","hours":"Sat 12:00 pm - 9:00 pm (same every day; last order not listed)","walkMin":12,"walkFrom":"Shibuya Sky (Shibuya Scramble Square)","stomach":"easy","stomachWhy":"non-spicy shoyu ramen","note":"Order: Shoyu or miso A5 wagyu ramen; skip the Spicy Red. Booking: recommended: TableCheck https://www.tablecheck.com/en/shinjukutei-shibuya. Closes at 9:00 pm, so a 6:30 pm dinner fits. Pick this if they skip ramen at lunch.","cost":21.91,"costEstimate":true,"costBasis":"¥3,500 each: A5 wagyu ramen ¥3,500 (TableCheck); Savor Japan average ¥5,000 with sets","costSource":"https://www.tablecheck.com/en/shinjukutei-shibuya","rating":"not found","steps":1800,"stepsWhy":"About 5 min further each way than the planned meal"},{"id":"gyumon-shibuya","title":"Dinner: halal wagyu yakiniku at Gyumon, Shibuya","place":"Halal Wagyu Yakiniku Gyumon Shibuya, 3-14-5 Shibuya, Shibuya-ku, Tokyo (near the Namikibashi crossing)","cuisine":"Halal wagyu yakiniku (grill at the table)","halal":"halal-certified","halalSource":"Time Out: certified halal throughout. Alcohol: sources conflict (Zabihah says no alcohol allowed; Coto Academy Dec 2025 says it serves alcohol). (https://www.timeout.com/tokyo/restaurants/gyumon)","hours":"Sat 12:00 pm - 11:00 pm (Zabihah; an older Time Out listing says 12:00 pm - 5:00 am)","walkMin":8,"walkFrom":"Shibuya Sky (Shibuya Scramble Square)","stomach":"rough","stomachWhy":"fatty grilled A5 wagyu","note":"Order: The ¥4,000 halal BBQ set for each; do not add the pricey A5 platters. Booking: recommended for Saturday evening: phone the restaurant (number not confirmed). Call to confirm it is open and the set price before going.","cost":25.04,"costEstimate":true,"costBasis":"¥4,000 each: halal BBQ set ¥4,000 per person incl. tax, drinks extra (Zabihah); dinner sets from ¥2,500 (Coto Academy); à la carte wagyu plates ¥7,000-8,000","costSource":"https://www.timeout.com/tokyo/restaurants/gyumon","rating":"not found","steps":1000,"stepsWhy":"About 1 min further each way than the planned meal"}]},{"start":"19:30","end":"20:05","type":"transit","title":"Ginza line back to Kyobashi","cost":1.31,"costUnit":"person","costBasis":"¥209 each (IC card)","note":"Direct, about 25 min from Shibuya to Kyobashi, then 2 min to the hotel.","steps":900,"stepsWhy":"Station corridors and the walk from Kyobashi station"}]}],["d-2026-12-27",{"date":"2026-12-27","city":"tyo","order":3,"title":"teamLab Planets, Odaiba and Shinjuku at night","summary":"teamLab Planets in the morning, lunch in Odaiba, the Unicorn Gundam and the bay, sunset over Rainbow Bridge, a rest, then dinner and the lights in Shinjuku.","items":[{"start":"08:15","end":"08:55","type":"meal","title":"Breakfast: croissant and coffee at Starbucks, TOFROM Yaesu Tower","place":"Starbucks Coffee TOFROM Yaesu Tower, B1F TOFROM YAESU TOWER, 1-6-1 Yaesu, Chuo-ku","cuisine":"Coffee chain; pastries","halal":"vegetarian","halalSource":"Coffee and a plain pastry; skip ham or bacon items. Croissant availability varies by store (not confirmed). (https://store.starbucks.co.jp/detail-4584/)","hours":"Temporary hours 16 Nov - 31 Dec 2026: every day 7:00 am - 10:30 pm (normally Mon - Fri 7:00 am, Sat, Sun and holidays 8:00 am)","walkMin":7,"walkFrom":"lyf Ginza Tokyo (2-5-4 Kyobashi)","stomach":"easy","stomachWhy":"plain pastry and coffee","note":"Order: Latte and a croissant or scone","cost":5.63,"costEstimate":true,"costBasis":"¥900 each: latte and pastry, about ¥900 (estimate)","costSource":"https://store.starbucks.co.jp/detail-4584/","rating":"not found","mealId":"m-2026-12-27-breakfast", b Planets","activityId":"jp-teamlab","move":{"mode":"metro","minutes":30,"cost":1.11,"costUnit":"person","local":"¥178","route":"Walk 6 min to Ginza-itchome, Yurakucho line to Toyosu (8 min), then about 8 min on foot to teamLab Planets (or Yurikamome to Shin-Toyosu, next door).","source":"fare from the operator's fare table (IC card fare)","estimate":false},"note":"Timed entry: book the 9:30 am slot. You walk barefoot, partly through knee-deep water: wear trousers that roll up above the knee (shorts are lent free). Free lockers for shoes and bags. About 1.5–2 hours inside.","steps":2800,"stepsWhy":"Walk from the station, then about 1.5 h walking slowly through the rooms"},{"start":"12:00","end":"13:00","type":"meal","title":"Lunch: halal soba and tempura at Sojibo, DiverCity Odaiba","place":"Shinshu Soba Sojibo, DiverCity Tokyo Plaza, DiverCity Tokyo Plaza 6F, 1-1-10 Aomi, Koto-ku, Tokyo 135-0064","cuisine":"Halal soba and tempura","halal":"halal-certified","halalSource":"Listed as a 'Muslim Friendly Restaurant' certified by NPO Japan Halal Association; all food halal, halal meat and seasonings, dedicated halal kitchen and tableware (Halal Gourmet Japan). DiverCity's own site says the store is halal-certified. Alcohol is served, in separate glasses (Zabihah). No pork. (https://www.halalgourmet.jp/restaurant/679)","hours":"Every day 11:00 am – 10:00 pm (last order 9:00 pm); no closure announced","walkFrom":"teamLab Planets (Shin-Toyosu Station); Yurikamome Shin-Toyosu to Daiba, then about 5 minutes on foot (ride time not checked)","stomach":"easy","stomachWhy":"Plain soba, light broth","note":"Order: Zaru soba or kake soba with a small shrimp tempura The only halal-certified sit-down restaurant found in Odaiba (JNTO's Muslim guide also recommends it). From teamLab Planets: Yurikamome Shin-Toyosu to Daiba is 9 stops (estimate about 20 min), then about 5 min walk. Alcohol is served in the room.","cost":9.39,"costEstimate":true,"costBasis":"¥1,500 each: soba set; mall lists budget ¥1,000-1,999","costSource":"https://www.halalgourmet.jp/restaurant/679","rating":"not found","mealId":"m-2026-12-27-lunch","meal":"lunch","move":{"mode":"train","label":"Yurikamome","minutes":25,"cost":2.07,"costUnit":"person","local":"¥330","route":"Yurikamome from Shin-Toyosu (next to teamLab Planets) to Daiba, about 20 min, then 5 min on foot to DiverCity Tokyo Plaza.","source":"estimate from the Yurikamome fare table (Shimbashi → Shin-Toyosu is ¥388)","estimate":true},"steps":900,"stepsWhy":"Station walks and 5 min to DiverCity, 6th floor","alts":[{"id":"logic-odaiba-decks","title":"Lunch: pizza and pasta at Trattoria LOGIC, Decks Odaiba","place":"Trattoria & Pizzeria LOGIC Odaiba, Decks Tokyo Beach 3F, 1-6-1 Daiba, Minato-ku, Tokyo","cuisine":"Italian wood-fired pizza and pasta","halal":"italian","halalSource":"Not halal. Italian menu; alcohol served; pork dishes likely on the menu (not confirmed), so order a margherita, seafood or vegetable pizza or pasta. (https://tabelog.com/en/tokyo/A1313/A131306/13188736/)","hours":"Sun 11:00 am - 10:00 pm (last order 9:00 pm); closed days follow Decks Tokyo Beach","walkFrom":"teamLab Planets (Shin-Toyosu Station)","stomach":"easy","stomachWhy":"Simple pizza and pasta","note":"Order: Margherita or marinara pizza to share plus a seafood or tomato pasta Wood-fired pizza supervised by world-champion pizzaiolo Shoji (Gurunavi listing). Older reviews say pizza and pasta are good but service and prices are mixed. Yurikamome Shin-Toyosu to Odaiba-kaihinkoen is 10 stops (estimate about 22 min).","cost":12.52,"costEstimate":true,"costBasis":"¥2,000 each: pizza or pasta lunch; Tabelog lunch budget ¥1,000-1,999, reviewers ¥2,000-2,999 (¥495 service charge applies at dinner only)","costSource":"https://tabelog.com/en/tokyo/A1313/A131306/13188736/","rating":"Tabelog 3.20 (273)","steps":900,"stepsWhy":"About the same walk as the planned meal"},{"id":"vegan-ramen-uzu-tokyo","title":"Lunch: vegan ramen at UZU, by teamLab Planets","place":"Vegan Ramen UZU Tokyo, 6-1-16 Toyosu, Koto-ku, Tokyo 135-0061 (inside the teamLab Planets TOKYO grounds)","cuisine":"Vegan ramen (Kyoto Bib Gourmand shop's Tokyo branch, teamLab art space)","halal":"vegetarian","halalSource":"Fully vegan menu (no meat, fish or animal stock). Not halal-certified; alcohol not confirmed. Gluten-free noodles available per reviewers. (https://www.happycow.net/reviews/vegan-ramen-uzu-tokyo-256764)","hours":"Sun 11:00 am - 8:00 pm (HappyCow; another listing says 10:30 am - 9:30 pm). Tabelog lists no hours, so not confirmed on an official page.","walkMin":1,"walkFrom":"teamLab Planets (Shin-Toyosu Station)","stomach":"easy","stomachWhy":"Light plant-based miso broth","note":"Order: Yuzu miso ramen (not the spicy miso), plus a vegan dessert to share Not in Odaiba: eat here before boarding the Yurikamome if they prefer no detour; only for teamLab Planets ticket holders. teamLab Planets tickets cost about ¥3,800-4,800 (Feb 2026 review). Soupy noodles, but it is a sit-down ramen shop, not street food. A second HappyCow listing 'Uzu Ramen' was removed in July 2026 as a duplicate, not a closure.","cost":13.77,"costEstimate":true,"costBasis":"¥2,200 each: one bowl: Yuzu Miso Ramen seen at ¥2,200 in a 2026 Tabelog review photo (older photo shows soy or miso at ¥1,320); Tabelog reviewers spend ¥2,000-2,999","costSource":"https://www.happycow.net/reviews/vegan-ramen-uzu-tokyo-256764","rating":"HappyCow 4.5 (243); Tabelog 3.34 (80)","steps":900,"stepsWhy":"About the same walk as the planned meal"}]},{"start":"13:00","end":"14:00","type":"sight","title":"Unicorn Gundam statue and DiverCity, Odaiba","note":"Free. The life-size 19.7 m Unicorn Gundam stands in front of DiverCity Tokyo Plaza; it transforms with lights and music at set times through the day (check the board next to it).","steps":1500,"stepsWhy":"About an hour around the statue and the plaza"},{"start":"14:00","end":"15:30","type":"shopping","title":"DiverCity and Aqua City shops","optional":true,"move":{"mode":"walk","minutes":10,"cost":0,"costUnit":"person","local":"","route":"From DiverCity along the deck to Aqua City.","source":"estimate from OpenStreetMap positions","estimate":true},"note":"Optional: two big malls with Japanese brands, Uniqlo and character shops. Skip it to rest in a café with a view of the bay.","steps":2500,"stepsWhy":"Optional: about 1.5 h walking through the malls"},{"start":"15:45","end":"16:45","type":"sight","title":"Sunset over Rainbow Bridge, Odaiba Seaside Park","move":{"mode":"walk","minutes":8,"cost":0,"costUnit":"person","local":"","route":"From Aqua City down to the beach promenade.","source":"estimate from OpenStreetMap positions","estimate":true},"note":"Free. Sunset is about 4:35 pm:28 pm: Rainbow Bridge, the Statue of Liberty replica and the Tokyo skyline light up across the water. Then ride the Yurikamome back over the bridge (sit at the front of the driverless train).","steps":2500,"stepsWhy":"About 15 min to the beach and a slow walk along the promenade"},{"start":"16:50","end":"17:30","type":"transit","title":"Yurikamome over Rainbow Bridge, then the Ginza line to the hotel","cost":3.37,"costUnit":"person","costBasis":"¥330 Yurikamome to Shimbashi + ¥209 Ginza line to Kyobashi","note":"Odaiba-kaihinkoen to Shimbashi about 15 min, then 4 min on the Ginza line to Kyobashi.","steps":900,"stepsWhy":"Station corridors and the walk to the hotel"},{"start":"17:30","end":"18:30","type":"hotel","title":"Rest at the hotel","steps":100,"stepsWhy":"In the room"},{"start":"19:00","end":"20:15","type":"meal","title":"Dinner: Turkish at Bosphorus Hasan, Shinjuku","place":"Bosphorus Hasan Shinjuku, 1F, 2-7-2 Shinjuku, Shinjuku-ku, Tokyo","cuisine":"Turkish","halal":"unconfirmed","halalSource":"Restaurant states it uses halal meat (Tabelog, Halal Gourmet Japan); Zabihah says all food is certified halal, but no certificate or body is named. Alcohol served (Turkish wine and beer, all-you-can-drink plan). Pork not o 45)","hours":"Sun 12:00 pm - 9:00 pm (last order not confirmed)","walkMin":7,"walkFrom":"Shinjuku Station (east side)","stomach":"rough","stomachWhy":"Rich, fatty wagyu beef broth","note":"Order: A5 wagyu ramen (or chicken ramen for a lighter bowl) MATCHA guides are sponsored by the operator. Walk time is an estimate. Arrive by 8:30 pm.","cost":21.91,"costEstimate":true,"costBasis":"¥3,500 each: A5 wagyu ramen; chicken broth ramen ¥2,000; plus ¥200 table charge per person when booked","costSource":"https://locally.matcha-jp.com/en/27145","rating":"not found","steps":2000,"stepsWhy":"About 3 min closer each way than the planned meal"},{"id":"ain-soph-journey-shinjuku","title":"Dinner: vegan Western plates at Ain Soph. Journey, Shinjuku","place":"Ain Soph. Journey Shinjuku, not confirmed (Shinjuku 3-chome, near Shinjuku-sanchome Station; see Tabelog)","cuisine":"Vegan Western (plates, desserts, famous pancakes)","halal":"vegetarian","halalSource":"Fully vegan. Not halal-certified; alcohol not confirmed. (https://www.happycow.net/reviews/ain-soph-journey-tokyo-36193)","hours":"Sun 11:30 am - 5:00 pm and 6:00 pm - 9:00 pm (last order 8:00 pm), per older listings; reviewers report sometimes finding it closed in stated hours","walkMin":8,"walkFrom":"Shinjuku Station (east side)","stomach":"easy","stomachWhy":"Light vegan plates","note":"Order: A vegan main plate and the soufflé pancakes to share Booking: recommended; official site ain-soph.jp/journeyshinjuku or phone 050-3503-8688. Hours, price and exact address not confirmed on a 2026 page; call before going. Walk time is an estimate.","cost":null,"costBasis":"Price not confirmed","rating":"not found","steps":2200,"stepsWhy":"About 2 min closer each way than the planned meal"}]},{"start":"20:20","end":"21:20","type":"sight","title":"Tokyo Metropolitan Government Building: free night view and the projection-mapping show","note":"Free. On Sun 27 Dec both observatories are open: the South Observatory until 10:00 pm (last en  anniversary \"Sparkling Jubilee\" runs all year). Open 9:00 am – 9:00 pm on Tue 29 Dec; be at the gate by 8:30 am, as the year-end week is one of the busiest of the year. Shows on 29 Dec: Sparkling Jubilee Celebration 11:15 am, 1:45 pm and 3:45 pm, Believe! Sea of Dreams night harbour show 7:30 pm, \"New Day, New Dreams\" New Year fireworks 8:30 pm (from 26 Dec). Closed that day: Mermaid Lagoon Theater and Liberty Landing Diner. Use the Tokyo Disney Resort app for waiting times; Disney Premier Access (paid in the app on the day): Anna and Elsa's Frozen Journey and Soaring ¥2,500 each. Ristorante di Canaletto takes Priority Seating from 10:00 am Japan time on 29 Nov (3:00 am Cairo time). If you pick Disneyland instead: Harmony in Color parade 2:15 pm, Electrical Parade Dreamlights 7:00 pm, New Year fireworks 8:30 pm. No halal food in the parks; outside food is allowed only in the picnic area outside the gate (official FAQ), except for guests with dietary needs.","steps":21000,"stepsWhy":"About 12 hours in the park, theme-park walking with queues"},{"start":"12:30","end":"13:30","type":"meal","title":"Lunch: pizza or pasta at Zambini Brothers' Ristorante, DisneySea","place":"Zambini Brothers' Ristorante, Tokyo DisneySea, Mediterranean Harbor","cuisine":"Italian pizza and pasta (counter service)","halal":"italian","halalSource":"Not halal. Order the vegetarian Pizza Margherita (¥750) or Spaghetti with Vegetable Sauce (¥1,200), or the Seafood Pizza (¥1,400). Meatballs, prosciutto and alcohol are on the menu. (https://www.tokyodisneyresort.jp/en/tds/restaurant/food/403/)","hours":"Park 9:00 am – 9:00 pm; not on the 29 Dec closure list","walkFrom":"previous ride area","stomach":"easy","stomachWhy":"plain pizza and tomato pasta","note":"Order: Pizza Margherita plus Spaghetti with Vegetable Sauce, or Seafood Pizza","cost":12.21,"costEstimate":true,"costBasis":"¥1,950 each: Pizza Margherita ¥750 + Spaghetti with Vegetable Sauce ¥1,200","costSource":"https://www.tokyodisneyresort.jp/en/tds/restaurant/food/403/","rating":"not found","mealId":"m-2026-12-29-lunch","meal":"lunch","steps":300,"stepsWhy":"Inside the park (walking is counted in the park row)","alts":[{"id":"tds-restaurant-sakura","title":"Lunch: seafood or vegetable tempura bowl at Restaurant Sakura, DisneySea","place":"Restaurant Sakura, Tokyo DisneySea, American Waterfront","cuisine":"Japanese rice bowls (table service)","halal":"unconfirmed","halalSource":"Not halal. Seafood bowl ¥3,000 or vegetable tempura bowl ¥2,900; wagyu sukiyaki and sake also served; soy sauce and mirin may contain alcohol. (https://www.tokyodisneyresort.jp/en/tds/restaurant/food/432/)","hours":"Tue 29 Dec: park open 9:00 am - 9:00 pm; restaurant hours vary (hours checked for early December; recheck for 29 Dec)","walkFrom":"previous ride area","stomach":"easy","stomachWhy":"fresh seafood over rice","note":"Order: Assorted Seafood over Rice Booking: recommended: Priority Seating on the Tokyo Disney Resort reservation site or app.","cost":18.78,"costEstimate":true,"costBasis":"¥3,000 each: Assorted Seafood over Rice set ¥3,000","costSource":"https://www.tokyodisneyresort.jp/en/tds/restaurant/food/432/","rating":"not found","steps":300,"stepsWhy":"About the same walk as the planned meal"},{"id":"tds-horizon-bay-restaurant","title":"Lunch: fried seafood plate at Horizon Bay Restaurant, DisneySea","place":"Horizon Bay Restaurant, Tokyo DisneySea, Port Discovery","cuisine":"Western plates","halal":"unconfirmed","halalSource":"Not halal. Fried Seafood Plate ¥1,480, or Special Dietary Menu Vegetable Stew with Rice ¥980 (ask whether it has meat). Pork, chicken, beef and alcohol on the menu. (https://www.tokyodisneyresort.jp/en/tds/restaurant/food/451/)","hours":"Tue 29 Dec: park open 9:00 am - 9:00 pm; restaurant hours vary (hours checked for early December; recheck for 29 Dec)","walkFrom":"previous ride area","stomach":"rough","stomachWhy":"main seafood choice is fried","note":"Order: Vegetable Stew with Ric der: A croissant or two to eat on the 9:00 am Shinkansen, coffee from a station Starbucks","cost":4.38,"costEstimate":true,"costBasis":"¥700 each: croissant and coffee from a station kiosk, about ¥700 (estimate)","costSource":"https://media.jreast.co.jp/articles/537","rating":"not found","steps":300,"stepsWhy":"About the same walk as the planned meal"}]},{"start":"09:00","end":"11:15","type":"travel","title":"Shinkansen Nozomi: Tokyo → Kyoto","durationMin":135,"note":"Reserved seats; Nozomi trains leave about every 10 min. Sit on the right (seat E) to see Mount Fuji about 40–45 min after leaving Tokyo if the sky is clear. Already counted under Flights & visa. smartEX, checked 21 Nov for 2 adults: the early-booking seats for 30 Dec are sold out. Nozomi 135 and the 9 other trains leaving Tokyo between 9:00 and 9:36 am had no Ordinary or Green seats for two (Nozomi 19 at 9:12 am and Nozomi 21 at 9:30 am showed a seat in the train list, but none on the fare screen); Nozomi 139 (9:39 am) and Nozomi 141 (9:45 am) were not opened. smartEX price ¥28,740 for two (¥14,370 each). Book at general sale instead: 10:00 am Japan time on Mon 30 Nov (3:00 am Cairo time), in the smartEX app or site; expect a waiting queue (about 6 min on 21 Nov).","steps":300,"stepsWhy":"Seated on the train"},{"start":"11:30","end":"12:30","type":"meal","title":"Lunch: vegan ramen at Uno Ramen, Kyoto Station","place":"Uno Ramen (Kyoto Station), Kyoto Station Building 10F, 901 Higashishiokoji-cho, Shimogyo-ku, Kyoto 600-8216","cuisine":"Vegan soy-milk ramen","halal":"vegetarian","halalSource":"Fully vegan and gluten-free; no animal products allowed on the premises (HappyCow). Alcohol is served (gluten-free beer, matcha and sakura cocktails). (https://www.happycow.net/reviews/uno-ramen-kyoto-station-491180)","hours":"11:00 am – 10:00 pm (last order 9:30 pm), as Kyoto Ramen Koji","walkMin":7,"walkFrom":"Kyoto Station Central Exit","stomach":"easy","stomachWhy":"light soy broth, no meat","note":"No year-end notice found for 30 Dec (not confirmed). Order: Soy-milk shoyu ramen; skip the spicy dan dan ramen On the 10th floor, the same floor as Kyoto Ramen Koji (not confirmed that it is part of Ramen Koji). Reviewers call it pricey for ramen. Walk time is an estimate (escalators from the Central Exit). Then JR Nara Line to Inari Station for Fushimi Inari.","cost":18.78,"costEstimate":true,"costBasis":"¥3,000 each: one bowl of soy-milk ramen, about ¥2,100 - ¥3,500 according to reviewers (no official price list seen)","costSource":"https://www.happycow.net/reviews/uno-ramen-kyoto-station-491180","rating":"HappyCow 4.5 (35 reviews); Google not found","mealId":"m-2026-12-30-lunch","meal":"lunch","steps":800,"stepsWhy":"About 7 min from the Shinkansen gates up to the 10th floor of the station building","alts":[{"id":"mimi-vegan-fushimi-inari","title":"Lunch: vegan pizza and pasta at MIMI, near Fushimi Inari","place":"MIMI - Vegan Sweets & Restaurant, 361-14 Honmachi 18-chome, Higashiyama-ku, Kyoto 605-0981","cuisine":"Vegan Western and Japanese plates, pizza, pasta, ramen, cakes","halal":"vegetarian","halalSource":"Fully vegan restaurant using organic ingredients (HappyCow). Alcohol not mentioned. (https://www.happycow.net/reviews/mimi-vegan-sweets-and-restaurant-kyoto-465236)","hours":"Tue 11:00 am - 8:00 pm (last order 7:30 pm) (hours checked for early December; recheck for 30 Dec)","walkFrom":"Fushimi Inari Taisha main gate","stomach":"easy","stomachWhy":"plain vegan plates and pizza","note":"Order: Teriyaki vegan chicken set plate or a margherita pizza, matcha cake to finish Card only: a 17 Nov 2026 review says cash is not accepted. Reviewers say it is near Fushimi Inari, but the walking time from the shrine gate was not confirmed; check it on a map.","cost":16.9,"costEstimate":true,"costBasis":"¥2,700 each: teriyaki vegan chicken set plate ¥2,700 (hayashi rice ¥1,400; pizza about ¥1,800)","costSource":"https://www.happycow.net/reviews/mimi-vegan-sweets-and-restaurant-kyoto-465236","rating":"HappyCow 4.5 (34 reviews)","steps":800,"stepsWhy":"About the same walk as the planned meal"},{"id":"gyumon-kyoto-station","title":"Lunch: halal wagyu ramen at Gyumon, Kyoto Station","place":"Halal Wagyu Ramen & Gyukatsu GYUMON Kyoto Station, 746-1 Tatsumi-cho, Shimogyo-ku, Kyoto 600-8307","cuisine":"Halal wagyu ramen and gyukatsu","halal":"pork-free","halalSource":"Halal Gourmet Japan lists it as Muslim-friendly: halal meat, halal seasoning, pork-free, no alcoholic drinks, dedicated halal kitchen and tableware, prayer space. Halal certification is in progress, not granted yet. Vegan options available. (https://halalgourmet.jp/restaurant/162685)","hours":"Tue 12:00 pm - 10:00 pm (hours checked for early December; recheck for 30 Dec)","walkMin":7,"walkFrom":"Kyoto Station Central Exit","stomach":"rough","stomachWhy":"rich beef-bone broth, fatty wagyu","note":"Order: Wagyu ramen in the creamy beef-bone broth, not the spicy miso AutoReserve showed evening hours (6:00 pm - 10:00 pm) on some days, which conflicts with Halal Gourmet Japan's 12:00 pm - 10:00 pm daily; lunch at 12:00 is right at opening, so confirm. Walk time is an estimate from the 0.5 km distance.","cost":28.17,"costEstimate":true,"costBasis":"¥4,500 each: A5 wagyu ramen ¥2,610 - ¥5,490 (AutoReserve, user-added); Halal Gourmet Japan gives a lunch budget of ¥4,000 - ¥6,000","costSource":"https://halalgourmet.jp/restaurant/162685","rating":"not found (AutoReserve 3.00 with 0 reviews; new in 2026)","steps":800,"stepsWhy":"About the same walk as the planned meal"}]},{"start":"12:45","end":"14:15","type":"sight","title":"Fushimi Inari Taisha: the thousand red gates","move":{"mode":"train","minutes":10,"cost":0.94,"costUnit":"person","local":"¥150","route":"JR Nara line from Kyoto to Inari (5 min, 2 stops); the shrine gate is across the road.","source":"JR West fare table","estimate":false},"note":"Free and always open. Walk through the Senbon Torii tunnels of red gates to the Okusha prayer hall and on up the first stretch of gates, then back down (about 1.5 h). The climb on to the Yotsutsuji crossing, with a view over Kyoto, adds about 45 min and 3,000 steps: only if your legs are fresh. The summit loop (2–3 h) is not needed. Late December is busier than usual, with traffic controls around the shrine from 30 Dec; the big New Year (hatsumode) crowds of about 2.5 million people start on the night of 31 Dec.","steps":5000,"stepsWhy":"About 1.5 h on the gate paths and their stone steps"},{"start":"14:35","end":"16:30","type":"activity","title":"Kiyomizu-dera at sunset","activityId":"jp-kiyomizu","move":{"mode":"taxi","minutes":18,"cost":11.27,"costUnit":"group","local":"¥1,800","route":"Taxi from Fushimi Inari to the Kiyomizu-dera car drop-off (about 4.5 km), which saves the steep climb up from the bus stop.","source":"estimate from the Kyoto taxi tariff (from 6 Aug 2025: ¥500 for the first 0.9 km, then ¥100 every 255 m)","estimate":true},"note":"The wooden stage over the hillside, with the city below; sunset is about 4:54 pm. Take your time: sit in the tea house by the Otowa waterfall before the light goes. Then walk down Sannenzaka and Ninenzaka.","steps":4000,"stepsWhy":"Temple grounds on a slope, about 2 h at an easy pace"},{"start":"16:30","end":"17:45","type":"sight","title":"Sannenzaka, Ninenzaka and Yasaka Shrine to Gion","note":"Free. The old stone lanes of tea shops and pottery downhill from Kiyomizu-dera (25 min at a stroll), past the Yasaka pagoda, to Yasaka Shrine and its lanterns. Shops close about 5–6 pm.","steps":3500,"stepsWhy":"About 1.2 km downhill on lanes and steps, with stops"},{"start":"17:45","end":"18:15","type":"sight","title":"Gion: Hanamikoji Street at dusk","note":"Free. The geisha district's main lane of wooden teahouses. Do not take photos on the private side lanes (signs; fines up to ¥10,000) and never stop or touch a geiko or maiko.","steps":1500,"stepsWhy":"About 30 min along Hanamikoji and Shirakawa"},{"start":"18:30","end":"19:45","type":"meal","title":"Dinner: Turkish at Istanbul Saray, Kawaramachi","place":"Istanbul Saray, Matsuki Bldg 3F, 534-28 Ebisu-cho, Kawaramachi-dori Sanjo-agaru, Nakagyo-ku, Kyoto","cuisine":"Turkish","halal":"pork-free","halalSource":"The restaurant states that all its meat is halal-certified (Tabelog); Zabihah reports a halal certificate on display. The restaurant itself is not halal-certified and serves alcohol (wine and other drinks). (https://tabelog.com/en/kyoto/A2601/A260202/26002357/)","hours":"Weekdays 5:30 pm – 10:00 pm (dinner only); open year-round per Tabelog","walkMin":22,"walkFrom":"Yasaka Shrine / Hanamikoji","stomach":"easy","stomachWhy":"grilled chicken, bread, meze","note":"Order: Chicken shish kebab, mixed meze and a pide; ask staff to confirm each meat dish is halal Booking: recommended, by phone +81-75-213-2995 (Japanese only may be spoken). Not in Gion: it is on Kawaramachi near Sanjo, about 1.7 km from Yasaka Shrine (walk time is an estimate; a taxi is quicker). A Tabelog 3.5+ score is very good. Cards and QR payments accepted, no service charge.","cost":28.17,"costEstimate":true,"costBasis":"¥4,500 each: dinner with meze, a kebab and bread: Tabelog averages ¥3,000 - ¥3,999 (restaurant) and ¥5,000 - ¥5,999 (reviewers)","costSource":"https://tabelog.com/en/kyoto/A2601/A260202/26002357/","rating":"Tabelog 3.53 (214 reviews), Tabelog 100 in 2022, 2023, 2024 and 2026","mealId":"m-2026-12-30-dinner","meal":"dinner","move":{"mode":"walk","minutes":20,"cost":0,"costUnit":"person","local":"","route":"From Hanamikoji along Shijo-dori, across the Kamo River bridge and up Pontocho alley to Kawaramachi-Sanjo, about 1.5 km (a ¥1,200 taxi if tired).","source":"estimate from OpenStreetMap positions","estimate":true},"steps":2300,"stepsWhy":"About 20 min walk from Gion across the river and through Pontocho","alts":[{"id":"shinjuku-tei-gion","title":"Dinner: halal wagyu ramen at Shinjuku-tei, Gion","place":"Halal Wagyu Ramen Shinjuku-tei Gion Kyoto, Shijo-dori Gion Building B1F, 288 Gion-machi Kitagawa, Higashiyama-ku, Kyoto 605-0073","cuisine":"Halal wagyu ramen, tendon, wagyu yakiniku","halal":"halal-certified","halalSource":"States it is 100% halal-certified with no pork and no alcohol; certifying body not named. Prayer room with ablution area reported. (https://www.tablecheck.com/en/shinjukutei-gionkyoto)","hours":"Tue 12:00 pm - 9:00 pm (last order 8:30 pm) (hours checked for early December; recheck for 30 Dec)","walkMin":5,"walkFrom":"Yasaka Shrine / Hanamikoji","stomach":"rough","stomachWhy":"rich ramen broth, fatty wagyu","note":"Order: A5 wagyu ramen with shoyu soup (not the spicy red) Booking: recommended via TableCheck https://www.tablecheck.com/en/shinjukutei-gionkyoto. No closing day listed by any source. Walk time is an estimate from the address.","cost":21.91,"costEstimate":true,"costBasis":"¥3,500 each: wagyu ramen, TableCheck average ¥3,500","costSource":"https://www.tablecheck.com/en/shinjukutei-gionkyoto","rating":"not found (AutoReserve and Zabihah show 0 reviews)","steps":200,"stepsWhy":"About 17 min closer each way than the planned meal"},{"id":"wagyu-panga-gion-shijo","title":"Dinner: halal wagyu on rice at Wagyu Panga, Gion-Shijo","place":"Wagyu Panga Kyoto Gion-Shijo, Shimaya Bldg 3F, 206 Nakano-cho, Higashiyama-ku, Kyoto 605-0075","cuisine":"Halal wagyu hitsumabushi (beef on rice), cutlet and sukiyaki bowls","halal":"pork-free","halalSource":"All ingredients and seasonings are halal-certified, but the restaurant itself is not halal-certified (Groovy Japan, Feb 2026). Liquor is served. Prayer space reported. (https://www.groovyjapan.com/en/panga-gion-shijo/)","hours":"Lunch 12:30 pm - 3:00 pm (one listing); Tuesday dinner hours not confirmed (TableCheck offers 7:00 pm bookings)","walkMin":10,"walkFrom":"Yasaka Shrine / Hanamikoji","stomach":"easy","stomachWhy":"lean beef on rice","note":"Order: A5 lean wagyu hitsumabushi 110 g Booking: recommended via TableCheck https://www.tablecheck.com/en/wagyu-panga-kyoto-gion (phone 075-585-2329). Confirm dinner hours before booking. Sirloin versions are fatty (rough). Walk time is an estimate from the address.","cost":23.79,"costEstimate":true,"costBasis":"¥3,800 each: A5 lean wagyu hitsumabushi 110 g ¥3,800 (sirloin 150 g up to ¥7,500)","costSource":"https://www.tablecheck.com/en/wagyu-panga-kyoto-gion","rating":"not found","steps":200,"stepsWhy":"About 12 min closer each way than the planned meal"}]},{"start":"19:45","end":"20:50","type":"transit","title":"Hankyu train to Osaka-umeda, then a taxi to the hotel","city":"osa","cost":2.57,"costUnit":"person","costBasis":"¥410 each, Hankyu Kyoto line (estimate); the ¥1,000 taxi is under the move","costSource":"estimate from the Hankyu fare table (Kyoto-kawaramachi → Osaka-umeda)","move":{"mode":"taxi","minutes":8,"cost":6.26,"costUnit":"group","local":"¥1,000","route":"Taxi from the Hankyu Osaka-umeda taxi rank to the hotel in Higashi-Umeda, about 1.5 km (the walk is 10–15 min through the Umeda corridors).","source":"estimate from the Osaka taxi tariff (from 5 Nov 2025: ¥600 for the first 1.2 km, then ¥100 every 231 m)","estimate":true},"note":"Walk about 7 min from Istanbul Saray down Kawaramachi to Kyoto-kawaramachi station. The limited express reaches Osaka-umeda in about 45 min. Then a short taxi to the hotel in Higashi-Umeda.","steps":1300,"stepsWhy":"About 7 min to the station, then station halls to the taxi rank"},{"start":"20:50","end":"21:05","type":"hotel","title":"Check in at HOTEL GEOMETIQ Osaka Umeda","city":"osa","activityId":"jp-hotel-osa","role":"checkin","note":"The suitcases should be waiting at the front desk. You pay at the hotel; free cancellation until the end of 2 Dec.","steps":200,"stepsWhy":"Lobby and room"}]}],["d-2026-12-31",{"date":"2026-12-31","city":"kyo","order":7,"title":"Arashiyama and Kinkaku-ji, then Dotonbori at night (New Year's Eve)","summary":"Kyoto again by train: the Arashiyama bamboo grove early, Tenryu-ji garden, the river, lunch, the Golden Pavilion, back to Osaka for a rest, then Dotonbori's lights and dinner.","items":[{"start":"07:30","end":"08:05","type":"meal","title":"Breakfast: croissant and coffee at the hotel buffet, GEOMETIQ","place":"HOTEL GEOMETIQ Osaka Umeda breakfast buffet, HOTEL GEOMETIQ Osaka Umeda, 2-15-23 Sonezaki, Kita-ku, Osaka","cuisine":"Hotel breakfast buffet","halal":"vegetarian","halalSource":"Hotel buffet with no halal claim: take croissants, pastries, fruit, yogurt or eggs and coffee; skip ham, bacon, sausage and any chicken or beef.","hours":"6:30 am – 9:30 am, 2nd floor (hotel press release, 16 Nov 2026)","walkMin":0,"walkFrom":"hotel room","stomach":"easy","stomachWhy":"plain pastry and coffee","note":"Order: Croissant and coffee","cost":17,"costBasis":"US$17 each at the hotel (Booking.com: \"Breakfast US$17 (optional)\"; the room is priced without breakfast; 30 Dec – 3 Jan)","rating":"not found","mealId":"m-2026-12-31-breakfast","meal":"breakfast","steps":200,"stepsWhy":"Hotel restaurant","alts":[{"id":"sbux-umeda-est","title":"Breakfast: croissant and coffee at Starbucks, Umeda EST","place":"Starbucks Coffee Umeda EST, EST building, 3-25 Kakudacho, Kita-ku, Osaka","cuisine":"Coffee chain; pastries","halal":"vegetarian","halalSource":"Coffee and a plain pastry; skip ham or bacon items. Croissant availability varies by store (not confirmed). (https://store.starbucks.co.jp/detail-1762/)","hours":"Every day 7:00 am - 11:00 pm (last order 10:45 pm)","walkMin":8,"walkFrom":"HOTEL GEOMETIQ Osaka Umeda (Sonezaki 2-15-23)","stomach":"easy","stomachWhy":"plain pastry and coffee","note":"Order: Latte and a croissant or scone","cost":5.63,"costEstimate":true,"costBasis":"¥900 each: latte and pastry, about ¥900 (estimate)","costSource":"https://store.starbucks.co.jp/detail-1762/","rating":"not found","steps":1800,"stepsWhy":"About 8 min further each way than the planned meal"},{"id":"sbux-umeda-ema","title":"Breakfast: croissant and coffee at Starbucks, Umeda Ema","place":"Starbucks Coffee Umeda Ema, B2F Umeda Ema, 1-12-6 Umeda, Kita-ku, Osaka","cuisine":"Coffee chain; pastries","halal":"vegetarian","halalSource":"Coffee and a plain pastry; skip ham or bacon items. (https://store.starbucks.co.jp/detail-4019/)","hours":"Mon - Fri 7:00 am - 10:00 pm; Sat, Sun and holidays 8:00 am - 10:00 pm (hours checked for early December; recheck for 31 Dec)","walkMin":6,"walkFrom":"HOTEL GEOMETIQ Osaka Umeda (Sonezaki 2-15-23)","stomach":"easy","stomachWhy":"plain pastry and coffee","note":"Order: Latte and a croissant or scone","cost":5.63,"costEstimate":true,"costBasis":"¥900 each: latte and pastry, about ¥900 (estimate)","costSource":"https://store.starbucks.co.jp/detail-4019/","rating":"not found","steps":1400,"stepsWhy":"About 6 min further each way than the planned meal"}],"costEstimate":false,"costSource":"https://www.booking.com/hotel/jp/hotel-dans-le-coeur-osaka-umeda.html?checkin=2026-12-30&checkout=2027-01-02&group_adults=2&no_rooms=1&group_children=0&selected_currency=USD"},{"start":"09:10","end":"10:15","type":"sight","title":"Arashiyama Bamboo Grove","move":{"mode":"train","minutes":65,"cost":6.01,"costUnit":"person","local":"¥960","route":"Walk 10 min to JR Osaka, Special Rapid to Kyoto (29 min), JR Sagano line to Saga-Arashiyama (about 16 min), then 10 min on foot to the grove.","source":"JR West fare table","estimate":false},"note":"Free and always open. The path through tall bamboo is best before 10 am, before the tour groups. Continue to the Okochi Sanso side and back.","steps":3500,"stepsWhy":"Walk from the station and about an hour on the bamboo paths"},{"start":"10:15","end":"11:15","type":"activity","title":"Tenryu-ji temple garden","activityId":"jp-tenryuji","note":"A UNESCO Zen temple; its 14th-century pond garden faces the Arashiyama hills. The north gate opens straight from the bamboo grove.","steps":2000,"stepsWhy":"About an hour around the garden paths"},{"start":"11:15","end":"12:15","type":"meal","title":"Lunch: Zen vegetarian set at Shigetsu, inside Tenryu-ji","place":"Shigetsu (Tenryu-ji Zen vegetarian restaurant), Inside Tenryu-ji, 68 Susukinobaba-cho, Saga-Tenryuji, Ukyo-ku, Kyoto 616-8385","cuisine":"Shojin ryori (Buddhist temple vegetarian set)","halal":"vegetarian","halalSource":"Zen vegetarian temple cuisine run by Tenryu-ji: no meat or fish. Not confirmed whether cooking sake or mirin is used; one HappyCow reviewer suspected a bonito dashi, which the temple's own page does not support. Ask when booking. (https://www.tenryuji.com/en/shigetsu/)","hours":"Closed on Thursdays","walkMin":2,"walkFrom":"Tenryu-ji / Bamboo Grove","stomach":"easy","stomachWhy":"light tofu and vegetable dishes","note":"Closed on Thursdays, so closed on New Year's Eve (official page): use Yoshiya Oku no Niwa (the alternative), which had an 11:30 am table on 31 Dec when checked on 20 Nov. Book at least 2 days ahead (see the To do list). Order: Yuki set (¥3,800); Tsuki (¥6,500) if you want more dishes Booking: required: Yuki set at least 2 days ahead (Tsuki and Hana sets 3 days ahead for 2+ people), online lunch form on the Tenryu-ji site or phone 075-882-9725 (9:00 am - 5:00 pm). Inside the Tenryu-ji temple grounds, so it fits between the temple and the Bamboo Grove. Last seating time not stated; 12:30 pm is well inside 11:00 am - 2:00 pm. Menu changes with the season.","cost":26.92,"costEstimate":true,"costBasis":"¥4,300 each: Yuki set (rice, soup, five side dishes) ¥3,800 plus ¥500 garden entry (cash only for the garden fee)","costSource":"https://www.tenryuji.com/en/shigetsu/","rating":"Google 4.6 (484, via a guide site); Klook 4.6 (51); Tripadvisor 188 reviews (score not seen); MICHELIN Bib Gourmand (Guide Kyoto Osaka 2025)","mealId":"m-2026-12-31-lunch","meal":"lunch","steps":300,"stepsWhy":"Inside the Tenryu-ji grounds, next to the garden","alts":[{"id":"yoshiya-oku-no-niwa","title":"Lunch: halal tofu, yuba and Omi beef at Yoshiya Oku no Niwa, Arashiyama","place":"Yoshiya Oku no Niwa, 31 Saga-Tenryuji Tsukurimichi-cho, Ukyo-ku, Kyoto 616-8384","cuisine":"Halal Japanese: tofu and yuba, halal Omi beef","halal":"halal-certified","halalSource":"Halal Friendly certification from the Kyoto Halal Council; all ingredients in the halal dishes are certified (TableCheck). Zabihah lists it as fully halal with no alcohol. (https://www.tablecheck.com/en/shops/yosiya-okunoniwa/reserve)","hours":"Lunch 11:00 am – 3:00 pm; 31 Dec bookable on TableCheck","walkMin":5,"walkFrom":"Tenryu-ji / Bamboo Grove","stomach":"rough","stomachWhy":"set includes tempura and hotpot","note":"Order: Halal set meal (¥3,300) Booking: required: TableCheck https://www.tablecheck.com/en/shops/yosiya-okunoniwa/reserve (2+ people, card needed; reservations until 5:00 pm the day before per kyoto.travel). Phone numbers differ: 075-871-0448 (TableCheck) and +81-75-871-0456 (kyoto.travel). One Navitime reviewer found the halal menu limited. Cancellation fees: 30% two days before, 50% the day before, 100% on the day. Walk time is an estimate.","cost":20.66,"costEstimate":true,"costBasis":"¥3,300 each: Halal set meal ¥3,300: teriyaki tofu on rice, vegetable tempura, yuba and vegetable hotpot, dessert","costSource":"https://www.tablecheck.com/en/shops/yosiya-okunoniwa/reserve","rating":"not found","steps":900,"stepsWhy":"About 3 min further each way than the planned meal"},{"id":"oagari-arashiyama","title":"Lunch: halal wagyu on rice at OAGARI, Arashiyama","place":"Wagyu Volcano OAGARI Arashiyama (Niku no Kakurega Oagari), 31-7 Saga-Tenryuji Tsukurimichi-cho, Ukyo-ku, Kyoto 616-8384","cuisine":"Halal wagyu hitsumabushi (beef on rice)","halal":"unconfirmed","halalSource":"Halal Gourmet Japan: Muslim-friendly, halal-certified wagyu, halal seasoning, dedicated halal kitchen and tableware, no alcohol. Zabihah calls it partially halal (halal beef, sign displayed, no alcohol). Pork not mentioned. (https://www.halalgourmet.jp/restaurant/482762)","hours":"Wed 10:30 am - 6:30 pm (last order 6:00 pm) (hours checked for early December; recheck for 31 Dec)","walkMin":5,"walkFrom":"Tenryu-ji / Bamboo Grove","stomach":"rough","stomachWhy":"rich fatty wagyu on rice","note":"Order: Wagyu hitsumabushi Booking: not confirmed (a TableCheck page exists for an Arashiyama annex). Next door to Yoshiya Oku no Niwa (same street address block). Walk time is an estimate.","cost":18.78,"costEstimate":true,"costBasis":"¥3,000 each: wagyu hitsumabushi; Halal Gourmet Japan lunch budget ¥2,860 - ¥10,000 (menu prices not seen)","costSource":"https://www.halalgourmet.jp/restaurant/482762","rating":"not found","steps":900,"stepsWhy":"About 3 min further each way than the planned meal"}]},{"start":"12:15","end":"13:00","type":"sight","title":"Togetsukyo Bridge and the Katsura River","move":{"mode":"walk","minutes":8,"cost":0,"costUnit":"person","local":"","route":"From the Tenryu-ji main gate down the main street to the bridge.","source":"estimate from OpenStreetMap positions","estimate":true},"note":"Free. The wooden bridge with the forested hills behind; walk along the riverbank. Optional: the shops on the main street.","steps":2500,"stepsWhy":"About 8 min to the bridge and 40 min by the river and on the main street"},{"start":"13:35","end":"14:35","type":"activity","title":"Kinkaku-ji, the Golden Pavilion","activityId":"jp-kinkakuji","move":{"mode":"taxi","minutes":25,"cost":20.03,"costUnit":"group","local":"¥3,200","route":"Taxi from Arashiyama to Kinkaku-ji, about 8 km.","source":"estimate from the Kyoto taxi tariff (from 6 Aug 2025: ¥500 for the first 0.9 km, then ¥100 every 255 m)","estimate":true},"note":"The gold-leaf pavilion on its pond. A one-way path of about 30–40 min. Open 9:00 am – 5:00 pm.","steps":2000,"stepsWhy":"About an hour on the one-way garden path"},{"start":"14:40","end":"16:00","type":"transit","title":"Taxi to Kyoto Station, then JR back to Osaka","cost":17.53,"costUnit":"group","costEstimate":true,"costBasis":"¥2,800 taxi (estimate) + ¥580 each JR Special Rapid","move":{"mode":"train","minutes":29,"cost":3.63,"costUnit":"person","local":"¥580","route":"JR Special Rapid from Kyoto to Osaka, 29 min","source":"JR West fare table","estimate":false},"note":"About 25 min by taxi to Kyoto Station, 29 min by JR Special Rapid to Osaka, then 10 min on foot to the hotel.","steps":2000,"stepsWhy":"Kyoto Station halls, Osaka Station and 10 min to the hotel"},{"start":"16:00","end":"17:45","type":"hotel","title":"Rest at the hotel","city":"osa","steps":100,"stepsWhy":"In the room"},{"start":"18:10","end":"19:00","type":"sight","title":"Dotonbori: the Glico Running Man and the canal lights","city":"osa","move":{"mode":"metro","minutes":20,"cost":1.5,"costUnit":"person","local":"¥240","route":"Walk 8 min to Higashi-Umeda or Umeda station, Midosuji line to Namba (8 min), then 5 min on foot to Ebisu Bridge.","source":"Osaka Metro fare table","estimate":false},"note":"Free. Osaka's neon canal: the Glico sign from Ebisu Bridge, the giant crab and puffer-fish signs, the riverside walk. Busy and lively every evening. New Year's Eve: there is no official countdown, but an informal crowd packs Ebisu Bridge towards midnight, and it is the last night of the Midosuji Illumination (5:00 pm – 1:00 am). Be back at the hotel before the late crowds.","steps":2500,"stepsWhy":"About 50 min walking along the canal and the side streets"},{"start":"19:00","end":"20:15","type":"meal","title":"Dinner: halal Kobe beef at Wanomiya, Namba","place":"Kobe Beef Wanomiya Namba Midosuji, 1-7-8 Namba, Chuo-ku, Osaka 542-0076","cuisine":"Halal Kobe beef steak, sukiyaki and yakiniku","halal":"halal-certified","halalSource":"The official site says its halal Kobe beef is officially halal certified, but it does not name the certifying body. The site lists 36 halal menu items. Halal cookware, tableware and storage are kept separate. The halal sukiyaki is made without mirin, sake or uncertified animal ingredients. A regular (non-halal) menu is served as well, and the site does not say whether pork or alcohol is served.","hours":"Every day 11:00 am – 11:00 pm (official page); 31 Dec not confirmed","walkMin":8,"walkFrom":"Namba Station / Dotonbori Glico sign","stomach":"easy","stomachWhy":"lean grilled beef, not fried","note":"New Year's Eve opening not confirmed (the official page says open every day; no 31 Dec notice yet): call 06-6213-8129 when booking. The one Japanese must-try dinner. Order only from the halal menu and ask to see the halal certificate; the restaurant also has a regular menu. Order: Halal Kobe lean steak (150 g) each, or share one premium lean steak and one halal sukiyaki. Ask for the halal menu. Booking: Recommended: TableCheck https://www.tablecheck.com/shops/wanomiya-namba-midosuji/reserve (table-only booking, credit card needed), or phone 06-6213-8129. This is the pick from the halal wagyu survey (wagyuOsaka). It is 1 min from Namba Exit 14 and about 8 min on foot from the Glico sign (estimate). Sirloin and fillet cost far more (¥30,800 and up per 150 g), so stay with the lean or premium lean cuts, or the sukiyaki.","cost":70.74,"costEstimate":true,"costBasis":"¥11,300 each: Halal Kobe lean steak ¥10,780 tax included (weight not shown on the official site; one listing says 150 g) plus 5% dinner service charge; halal sukiyaki ¥9,130","costSource":"https://www.koubegyuu.com/wanomiya-namba-midousuji/","rating":"not found (the official site republishes Google reviews but shows no overall score; reviewers praise the tender beef and the chef, and one says the price is a little high)","mealId":"m-2026-12-31-dinner","meal":"dinner","move":{"mode":"walk","minutes":8,"cost":0,"costUnit":"person","local":"","route":"From Ebisu Bridge (Glico sign) along Dotonbori to Midosuji and Namba exit 14.","source":"estimate from OpenStreetMap positions","estimate":true},"city":"osa","steps":900,"stepsWhy":"About 8 min from the Glico sign to Namba exit 14","alts":[{"id":"chibo-diversity-dotonbori","title":"Dinner: halal okonomiyaki at Chibo Diversity, Dotonbori","place":"CHIBO Diversity Dotonbori Building (Muslim & Vegetarian Friendly), 7F Chibo Dotonbori Building, 1-5-5 Dotonbori, Chuo-ku, Osaka 542-0071","cuisine":"Okonomiyaki and teppanyaki made with halal ingredients","halal":"pork-free","halalSource":"This is the Chibo chain's own Muslim-friendly branch, on the 7th floor; the regular Chibo floors (1F-6F) are separate. It uses halal-certified ingredients and domestic halal wagyu for teppanyaki (Halal Food in Japan). HalalSpy (checked Oct 2026) calls it Muslim-friendly but not fully certified. It has a prayer room with ablution facilities and a vegetarian menu. Whether alcohol is served is not confirmed.","hours":"Wed 5:00 pm - 10:00 pm (last order 9:00 pm); closing days are in a linked document (not confirmed) (hours checked for early December; recheck for 31 Dec)","walkMin":3,"walkFrom":"Namba Station / Dotonbori Glico sign","stomach":"rough","stomachWhy":"griddled batter, sauce and mayo","note":"Order: Share one Chibo-yaki or a seafood or vegetable okonomiyaki plus a negi-yaki; add halal wagyu teppanyaki if hungry Booking: Recommended: https://e.japanticket.com/shops/5719 or phone 050-1809-0649 (it reopened in 2023 on a reservation basis). This is a cheaper Osaka-specialty dinner if they skip the wagyu. It is also the okonomiyaki entry in localfood.","cost":15.65,"costEstimate":true,"costBasis":"¥2,500 each: One okonomiyaki (about ¥1,500-1,700) plus a side or drink. These prices come from older Chibo menus and are not confirmed for this branch.","costSource":"https://shop.chibo.com/detail/37392/","rating":"not found for this branch (mixed comments on HappyCow; the Chibo Dotonbori shop is praised on Wanderlog)","steps":200,"stepsWhy":"About 5 min closer each way than the planned meal"},{"id":"halal-ramen-honolu-namba","title":"Dinner: halal chicken ramen at Honolu, Namba","place":"Halal Ramen Honolu Namba, 2-5-27 Motomachi, Naniwa-ku, Osaka","cuisine":"Halal chicken ramen","halal":"pork-free","halalSource":"Halal Food in Japan lists no pork but says alcohol is served, and it names no certifying body. Other guides say the chicken, noodles and soy sauce are halal certified. It has a prayer room. (https://www.halalfoodinjapan.com/restaurant/Osaka/AREAL3142/AREAM3144/R10152/)","hours":"Mon-Sat 11:30 am - 2:30 pm and 4:00 pm - 9:00 pm according to the listing, so Wednesday is included; last order not stated; Sunday not listed (hours checked for early December; recheck for 31 Dec)","walkMin":15,"walkFrom":"Namba Station / Dotonbori Glico sign","stomach":"easy","stomachWhy":"mild chicken broth, not spicy","note":"Order: Shio (salt) chicken ramen, 'soft' (not spicy), with halal gyoza This is the budget fallback. Alcohol is served. The walk from the Glico sign is an estimate; from Midosuji Namba it is about 12 min.","cost":8.14,"costEstimate":true,"costBasis":"¥1,300 each: A bowl of ramen at about ¥1,000 (listing budget) plus halal gyoza, which is served in the evenings","costSource":"https://www.halalfoodinjapan.com/restaurant/Osaka/AREAL3142/AREAM3144/R10152/","rating":"not found","steps":2300,"stepsWhy":"About 7 min further each way than the planned meal"}]},{"start":"20:15","end":"21:00","type":"shopping","title":"Shinsaibashi-suji covered shopping street","city":"osa","optional":true,"note":"Optional: 600 m of covered arcade from Dotonbori north, with drugstores, Uniqlo and sweets; most shops close about 9 pm.","steps":2000,"stepsWhy":"Optional: about 45 min along the arcade"},{"start":"21:00","end":"21:30","type":"transit","title":"Midosuji line back to Umeda","city":"osa","cost":1.5,"costUnit":"person","costBasis":"¥240 each","note":"From Shinsaibashi or Namba to Umeda, about 8 min, then 8 min on foot.","steps":1300,"stepsWhy":"Station corridors and the walk to the hotel"}]}],["d-2027-01-01",{"date":"2027-01-01","city":"osa","order":8,"title":"Universal Studios Japan: a full day","summary":"New Year's Day at USJ from opening: Super Nintendo World w  USJ app right after entering, which can run out within minutes. Then the Wizarding World of Harry Potter, Minions and the Flying Dinosaur. No halal food inside; guests with dietary restrictions may bring their own food (official FAQ).","steps":19000,"stepsWhy":"About 11–12 hours in the park, theme-park walking with queues"},{"start":"12:30","end":"13:30","type":"meal","title":"Lunch: plant-based pizza at Park Side Grille, USJ","place":"Park Side Grille, Universal Studios Japan, New York Area","cuisine":"American grill; plant-based pizza","halal":"vegetarian","halalSource":"Not halal. Plant-based Marinara Pizza with Mushrooms and Vegetables (no animal ingredients). Meat and alcohol on the rest of the menu. (https://www.usj.co.jp/web/en/us/service-guide/barrier-free/dietary-restriction/plant-based-menu)","hours":"Restaurant hours for 1 Jan not published","walkFrom":"previous ride area","stomach":"easy","stomachWhy":"tomato and vegetable pizza","note":"Order: Plant-based Marinara Pizza with Mushrooms and Vegetables","cost":17.53,"costEstimate":true,"costBasis":"¥2,800 each: Marinara Pizza with Mushrooms and Vegetables with a soft drink ¥2,800","costSource":"https://tdrexplorer.com/your-guide-to-plant-based-dining-at-universal-studios-japan-in-2026/","rating":"not found","mealId":"m-2027-01-01-lunch","meal":"lunch","steps":300,"stepsWhy":"Inside the park (walking is counted in the park row)","alts":[{"id":"usj-beverly-hills-boulangerie","title":"Lunch: plant-based sandwich at Beverly Hills Boulangerie, USJ","place":"Beverly Hills Boulangerie, Universal Studios Japan, Hollywood Area","cuisine":"Bakery café; plant-based sandwich","halal":"vegetarian","halalSource":"Not halal. Plant-based vegetable sandwich set and berry salad. (https://www.usj.co.jp/web/en/us/service-guide/barrier-free/dietary-restriction/plant-based-menu)","hours":"Fri 1 Jan: park hours not confirmed (not confirmed) (hours checked for early December; recheck for 1 Jan)","walkFrom":"previous ride area"," wo (¥14,920 each). Book at general sale instead: 10:00 am Japan time on Thu 3 Dec (3:00 am Cairo time); afternoon trains into Tokyo on 3 Jan are expected to fill quickly. Then the Narita Express (return half of the round-trip ticket)."}],"visas":[{"id":"japan-tourist","place":"Japan","title":"Short-term tourist visa, single entry","required":true,"status":"needed","cost":185.84,"costEstimate":true,"costLabel":"10,000 EGP for two, cash on collection","summary":"Needed: Egyptians living in Egypt cannot use Japan's eVISA. Apply in person at the Embassy of Japan in Maadi; the embassy keeps the passports while it processes (at least 5 working days, not guaranteed; it advises 3 weeks ahead). For a 24 Dec departure there is time to wait for the China decision first: apply by about 6–9 Dec.","facts":[["Cost each","5,000 EGP (about US$93), paid in cash when you collect the visa. Multiple entry 10,000 EGP."],["Processing","Minimum 5 business days, not guaranteed; may take longer depending on the case. The embassy strongly advises applying at least 3 weeks before departure. Results are announced by uploading the acceptance number on the embassy website."],["Timing","For Thu 24 Dec: the embassy advises applying by about 3 Dec (3 weeks ahead); the minimum 5 working days means a complete file handed in by Wed 9 Dec should be back around Wed 16 Dec. The embassy closes for its own holidays on 30–31 Dec."],["Where","In person at the Consular Section, Embassy of Japan, 1st floor, 81 Corniche El Nil Street, Maadi, Cairo. No appointment needed for application or pickup. Sunday - Thursday 9:00 am - 2:00 pm (be at the gate at least 20 minutes before closing; security check). Closed Friday, Saturday and embassy holidays. Embassy holidays: 30–31 Dec. Documents cannot be sent by mail, fax or email. No designated agencies are mentioned; Egyptian citizens apply directly at the embassy."],["Validity","A single-entry visa is valid for entry within 3 months from the date of issue."],["On arrival","Fill in Visit Japan Web before landing for the immigration and customs QR codes."]],"documents":["Visa application form, filled in and signed (one per person)","1 recent passport-size photo, white background (damaged or old photos refused)","Valid passport","Certificate of employment showing salary, tenure and position (enrollment certificate for students)","Original stamped bank statement for the last 3 months, in English","Detailed travel itinerary (embassy's English/Japanese form)","Flight itinerary (reservation)","Hotel reservation confirmation","If applying together as a family: proof of relationship (e.g. marriage certificate)","All Arabic documents need an English or Japanese translation attached; attach a copy of the flight, hotel and itinerary to each application; do not staple. Additional documents may be requested."]}]},"todo":{"checkedOn":"2026-11-20","groups":["November","December"],"items":[{"id":"egyptair","group":"November","when":"Soon","due":"2026-11-25","urgent":true,"title":"EgyptAir MS964 / MS965, Cairo ⇄ Narita, 24 Dec – 3 Jan","note":"Trip.com \"Economy Best Offer\" US$970 each (cancellation from US$65). Holiday fares rise; a reservation is enough for the visa file."},{"id":"hotels","group":"November","when":"Now","due":"2026-11-25","title":"Book lyf Ginza (25–30 Dec) and HOTEL GEOMETIQ Umeda (30 Dec – 3 Jan)","note":"Booking.com, pay at the hotel, nothing paid now; free cancellation until the end of 23 Dec (lyf) and 24 Dec (GEOMETIQ). US$1,171 + US$633."},{"id":"disney","group":"November","when":"Now","due":"2026-11-30","title":"DisneySea tickets, Tue 29 Dec","note":"Trip.com US$75 each (conditional cancellation) or the official site; year-end dates sell out. Canaletto Priority Seating opens 3:00 am Cairo time on 29 Nov."},{"id":"fuji","group":"November","when":"Now","due":"2026-11-30","title":"Mount Fuji small-group tour, Mon 28 Dec","note":"Trip.com, Package I (9-person group, hotel pick-up) US$62.46 each; free cancellation until 2 days
